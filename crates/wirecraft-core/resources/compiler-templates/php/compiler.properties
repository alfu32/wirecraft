# Compiler-wide output and traversal policy.
fileExtension=php
defaultLayoutStrategyId=direct-file-system-homomorphism
emitLinkFiles=false
skipCompilerTemplates=true
staticFiles=composer.json,.env
# Semantic roles mapped to Pebble source templates. See README.md.
template.processor.declaration=processor.peb
template.node.declaration=processor.peb
template.generator.declaration=generator.peb
template.service-library.declaration=service-library-declaration.peb
template.group.declaration=composite.peb
template.composite.declaration=composite.peb
template.link.declaration=link-declaration.peb
template.link.instantiation=link-instantiation.peb
template.type.declaration=type-declaration.peb
template.note.declaration=note.peb
template.child.import=child-import.peb
template.runtime.support=runtime.peb
template.composite.single-file=assembly-single.peb
template.composite.file-based=assembly-file.peb
template.static-file.path=static-path.peb
# Project-level files receive project context, not the current-node context.
project.1.path={{ safeProjectName }}/composer.json
project.1.content=composer-json.peb
project.1.reason=Composer manifest
