# Compiler-wide output and traversal policy.
fileExtension=kt
defaultLayoutStrategyId=source-set
emitLinkFiles=false
skipCompilerTemplates=true
staticFiles=build.gradle.kts,settings.gradle.kts,gradle.properties
# Semantic roles mapped to Pebble source templates. See README.md.
template.project.name=project-name.peb
template.processor.declaration=processor.peb
template.node.declaration=processor.peb
template.generator.declaration=generator.peb
template.group.declaration=processor.peb
template.composite.declaration=processor.peb
template.processor.declaration.single-file=processor-single.peb
template.node.declaration.single-file=processor-single.peb
template.generator.declaration.single-file=generator-single.peb
template.group.declaration.single-file=processor-single.peb
template.composite.declaration.single-file=processor-single.peb
template.link.declaration=link-declaration.peb
template.link.instantiation=link-instantiation.peb
template.type.declaration=type-declaration.peb
template.note.declaration=note.peb
template.composite.single-file=assembly-single.peb
template.primary-file.path.source-set=source-path.peb
template.static-file.path=static-path.peb
# Project-level files receive project context, not the current-node context.
project.1.path=settings.gradle.kts
project.1.content=settings.peb
project.1.reason=Gradle settings
project.2.path=build.gradle.kts
project.2.content=build.peb
project.2.reason=Gradle build file
project.3.path=src/main/kotlin/generated/Runtime.kt
project.3.content=runtime-file.peb
project.3.reason=Runtime support
project.3.layouts=direct-file-system-homomorphism,classified-filesystem,source-set
project.3.elementKind=Runtime
project.4.path=src/main/kotlin/generated/Main.kt
project.4.content=main.peb
project.4.reason=Application entry point
project.4.layouts=direct-file-system-homomorphism,classified-filesystem,source-set
