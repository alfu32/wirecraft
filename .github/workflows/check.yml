name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config cmake clang clangd libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build Linux package
        if: github.event_name == 'workflow_dispatch'
        run: scripts/package-linux.sh release
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: wirecraft-linux
          path: dist/*.tar.gz*
