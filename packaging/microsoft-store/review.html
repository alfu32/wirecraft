р, түрлер, типтелген байланыстар және құрама түйіндер бар көрнекі деректер ағыны құрастырушысы", "Үлкен топологияларға арналған оқуға ыңғайлы 45 градустық байланыс бағыттауы", "Бір жобадан C17, Rust, Go, Kotlin, JavaScript және PHP бағдарламаларын жасау", "Жасалған функция тақырыбы код үстіне бекітілген дене редакторы", "clangd немесе rust-analyzer арқылы аяқтау, кеңестер, семантикалық түстер және диагностика", "Процессор денелері бойынша анықтамаға өту және сілтемелерді табу", "Типтелген порттары бар, мазмұн хешімен бекітілген қайта пайдаланылатын компоненттер", "Архетиптер кітапханасы және деректер, қателер мен тәуелділіктер ағындарының желілік талдауы", "Kanban тақтасы, бэклог, жауапкершілік және нұсқалар тарихы", "Сызбаларды PDF, SVG, PNG және Mermaid-ке экспорттау және ЖИ агенттеріне арналған жергілікті MCP сервері"], "searchTerms": ["деректер ағыны", "бағдарлама дизайны", "код генерациясы", "C17", "Rust", "MCP сервері", "архитектура"], "captions": ["Веб-серверді процессорлар, түрлер және байланыстар графы ретінде жобалаңыз.", "Процессорларды құрама түйіндерге топтаңыз; бағытталған байланыстар әр буферді көрсетеді.", "Жобаны типтелген кіріс және шығыс порттары бар компонент ретінде жариялаңыз.", "Басқа жобадан компонентке сілтеме жасаңыз; оның порттары байланыстарыңызға қосылады.", "Процессор денесін бекітілген, жасалған C17 функция тақырыбының астында өңдеңіз.", "clangd көмегімен берілген кітапхана мүшелерін теру кезінде аяқтаңыз.", "rust-analyzer орнатылғанда Rust денелерінде меңзер құжаттамасын оқыңыз.", "Мөртабаны бар сызбаларды алдын ала қарап, PDF, SVG, PNG немесе Mermaid-ке экспорттаңыз.", "Нысандарды Kanban тақтасында күйімен, жауаптыларымен және орындаушыларымен бақылаңыз.", "ЖИ агенттеріне жергілікті MCP сервері мен оның кіру журналы арқылы жұмыс істетіңіз."], "minimumHardware": ["DirectX 11 қолдайтын графикалық драйверлер", "Пернетақта және тінтуір"], "recommendedHardware": ["Кодты тексеру үшін clang, clangd немесе rust-analyzer орнатылған", "Кенепті жылжытуға арналған үш батырмалы тінтуір"]}, "ko": {"language": "한국어", "description": "소프트웨어를 데이터 흐름 그래프로 설계하고, 그 설계에서 프로그램을 생성하세요.\n\nWirecraft는 이벤트 기반 및 데이터 흐름 소프트웨어를 위한 무료 오픈 소스 설계 도구입니다. 캔버스에 프로세서, 데이터 형식, 형식이 지정된 링크를 배치하고 복합 노드로 묶으면, 45도 라우팅이 큰 토폴로지도 읽기 쉽게 유지합니다. 각 링크는 형식이 지정된 버퍼이고 각 프로세서는 함수이며, 서비스 라이브러리는 이를 사용하는 프로세서에 대여됩니다.\n\n같은 설계로부터 Wirecraft는 C17, Rust, Go, Kotlin, JavaScript(Node.js), PHP로 된 완전한 프로그램을 생성합니다. 각 프로세서의 본문은 생성된 함수 헤더를 코드 위에 고정해 주는 편집기에서 작성하므로, 생성기가 전달할 매개변수를 항상 확인할 수 있습니다. clang, clangd 또는 rust-analyzer를 설치하면 코드 완성, 마우스오버 문서, 의미 기반 색상, 정의로 이동, 참조 찾기, 그리고 작성한 엔터티와 줄에 연결된 컴파일러 진단을 사용할 수 있습니다.\n\n설계의 일부를 형식이 지정된 포트를 가진 재사용 가능한 구성 요소로 게시하고 다른 설계에서 참조하세요. 참조는 콘텐츠 해시로 고정되어 업데이트가 의도적으로 이루어집니다. 원형 라이브러리에서 새 작업을 시작하고, 데이터·오류·종속성 흐름의 네트워크 분석으로 설계를 점검할 수 있습니다.\n\n설계와 함께 프로젝트 관리(상태, 책임, 리비전 기록이 있는 칸반 보드와 백로그), 인쇄와 공유를 위한 도면 및 문서의 PDF, SVG, PNG, Mermaid 내보내기, 그리고 호환되는 AI 에이전트가 문서화된 도구로 설계를 읽고 편집할 수 있는 선택적 로컬 MCP 서버도 제공합니다.\n\nWirecraft는 Threadworks .orch 프로젝트를 열고 그 데이터를 보존합니다. 계정이 필요 없으며 설계 작업은 오프라인으로 가능합니다. 앱 인터페이스는 영어입니다. Wirecraft는 활발히 개발 중입니다.", "shortDescription": "데이터 흐름 소프트웨어를 시각적으로 설계하고 C17, Rust, Go, Kotlin, JavaScript 또는 PHP 프로그램을 생성하세요. 언어 서버의 도움으로 프로세서 본문을 편집하고, 구성 요소를 재사용하고, 도면을 내보내고, 로컬 MCP 서버로 AI 에이전트를 연결하세요.", "features": ["프로세서, 형식, 형식 지정 링크, 복합 노드를 갖춘 시각적 데이터 흐름 설계기", "큰 토폴로지에서도 읽기 쉬운 45도 링크 라우팅", "하나의 설계에서 C17, Rust, Go, Kotlin, JavaScript, PHP 프로그램 생성", "생성된 함수 헤더가 코드 위에 고정되는 본문 편집기", "clangd 또는 rust-analyzer를 통한 완성, 마우스오버, 의미 색상, 진단", "프로세서 본문 전반에서 정의로 이동 및 참조 찾기", "형식 지정 포트를 갖추고 콘텐츠 해시로 고정되는 재사용 구성 요소", "원형 라이브러리와 데이터·오류·종속성 흐름의 네트워크 분석", "칸반 보드, 백로그, 책임자, 리비전 기록", "PDF, SVG, PNG, Mermaid 도면 내보내기와 AI 에이전트용 로컬 MCP 서버"], "searchTerms": ["데이터 흐름", "소프트웨어 설계", "코드 생성", "C17", "Rust", "MCP 서버", "아키텍처"], "captions": ["웹 서버를 프로세서, 형식, 링크로 이루어진 데이터 흐름 그래프로 설계합니다.", "프로세서를 복합 노드로 묶고, 라우팅된 링크로 각 버퍼를 보여 줍니다.", "설계를 형식 지정 입출력 포트가 있는 재사용 구성 요소로 게시합니다.", "다른 설계에서 구성 요소를 참조하면 그 포트가 링크에 연결됩니다.", "고정된 생성 C17 함수 헤더 아래에서 프로세서 본문을 편집합니다.", "clangd로 대여된 라이브러리의 멤버를 입력하면서 완성합니다.", "rust-analyzer를 설치하면 Rust 본문에서 마우스오버 문서를 읽을 수 있습니다.", "표제란이 있는 도면을 미리 보고 PDF, SVG, PNG, Mermaid로 내보냅니다.", "상태, 책임자, 담당자와 함께 칸반 보드에서 엔터티를 추적합니다.", "AI 에이전트가 로컬 MCP 서버와 액세스 로그를 통해 작업하게 합니다."], "minimumHardware": ["DirectX 11을 지원하는 그래픽 드라이버", "키보드와 마우스"], "recommendedHardware": ["코드 검사를 위한 clang, clangd 또는 rust-analyzer 설치", "캔버스 이동을 위한 3버튼 마우스"]}, "lt": {"language": "Lietuvių", "description": "Kurkite programinę įrangą kaip duomenų srauto grafą ir generuokite iš jo programą.\n\nWirecraft – nemokamas atvirojo kodo kūrimo įrankis įvykiais ir duomenų srautu grindžiamai programinei įrangai. Dėkite procesorius, duomenų tipus ir tipizuotas jungtis ant drobės, grupuokite juos į sudėtinius elementus, o 45 laipsnių maršrutizavimas išlaikys net didelių topologijų aiškumą. Kiekviena jungtis yra tipizuotas buferis, kiekvienas procesorius – funkcija, o paslaugų bibliotekos skolinamos jas naudojantiems procesoriams.\n\nIš to paties projekto Wirecraft generuoja išbaigtas programas C17, Rust, Go, Kotlin, JavaScript (Node.js) ir PHP kalbomis. Kiekvieno procesoriaus kūną rašykite redaktoriuje, kuris virš jūsų kodo prisega sugeneruotą funkcijos antraštę, todėl visada matote parametrus, kuriuos perduos generatorius. Įdiegę clang, clangd arba rust-analyzer gausite kodo užbaigimą, dokumentaciją užvedus žymeklį, semantines spalvas, perėjimą prie apibrėžimo, nuorodų paiešką ir kompiliatoriaus diagnostiką, susietą su jūsų parašytu objektu ir eilute.\n\nSkelbkite projekto dalis kaip pakartotinai naudojamus komponentus su tipizuotais prievadais ir nurodykite juos kituose projektuose, prisegtus turinio maiša, kad atnaujinimai būtų sąmoningi. Pradėkite naują darbą iš archetipų bibliotekos ir tirkite projektą atlikdami jo duomenų, klaidų ir priklausomybių srautų tinklo analizę.\n\nAplink projektą taip pat gaunate projektų valdymą (Kanban lentą ir darbų sąrašą su būsena, atsakomybe ir peržiūrų istorija), planų ir dokumentacijos eksportą į PDF, SVG, PNG ir Mermaid spausdinti bei dalytis, ir pasirinktinį vietinį MCP serverį, per kurį suderinami DI agentai gali skaityti ir redaguoti projektą dokumentuotais įrankiais.\n\nWirecraft atidaro Threadworks .orch projektus ir išsaugo jų duomenis. Paskyros nereikia, o projektavimas veikia be ryšio. Programos sąsaja yra anglų kalba. Wirecraft aktyviai kuriamas.", "shortDescription": "Vizualiai kurkite duomenų srauto programinę įrangą ir generuokite programas C17, Rust, Go, Kotlin, JavaScript arba PHP kalbomis. Redaguokite procesorių kūnus padedant kalbų serveriams, pakartotinai naudokite komponentus, eksportuokite planus ir junkite DI agentus per vietinį MCP serverį.", "features": ["Vizualus duomenų srauto kūrimo įrankis su procesoriais, tipais, tipizuotomis jungtimis ir sudėtiniais elementais", "Aiškus 45 laipsnių jungčių maršrutizavimas didelėse topologijose", "Generuokite C17, Rust, Go, Kotlin, JavaScript ir PHP programas iš vieno projekto", "Kūnų redaktorius su virš kodo prisegta sugeneruota funkcijos antrašte", "Užbaigimas, užuominos, semantinės spalvos ir diagnostika su clangd arba rust-analyzer", "Perėjimas prie apibrėžimo ir nuorodų paieška procesorių kūnuose", "Pakartotinai naudojami komponentai su tipizuotais prievadais, prisegti turinio maiša", "Archetipų biblioteka ir duomenų, klaidų bei priklausomybių srautų tinklo analizė", "Kanban lenta, darbų sąrašas, atsakomybė ir peržiūrų istorija", "Planų eksportas į PDF, SVG, PNG ir Mermaid bei vietinis MCP serveris DI agentams"], "searchTerms": ["duomenų srautas", "programų kūrimas", "kodo generavimas", "C17", "Rust", "MCP serveris", "architektūra"], "captions": ["Sukurkite žiniatinklio serverį kaip procesorių, tipų ir jungčių duomenų srauto grafą.", "Grupuokite procesorius į sudėtinius; maršrutizuotos jungtys rodo kiekvieną buferį.", "Paskelbkite projektą kaip komponentą su tipizuotais įvesties ir išvesties prievadais.", "Nurodykite komponentą kitame projekte; jo prievadai prisijungia prie jūsų jungčių.", "Redaguokite procesoriaus kūną po prisegta sugeneruota C17 funkcijos antrašte.", "Užbaikite paskolintos bibliotekos narius rašydami, padedant clangd.", "Skaitykite dokumentaciją užvedę žymeklį Rust kūnuose, kai įdiegtas rust-analyzer.", "Peržiūrėkite planus su antraštiniu bloku ir eksportuokite į PDF, SVG, PNG ar Mermaid.", "Sekite objektus Kanban lentoje su būsena, atsakomybe ir vykdytojais.", "Leiskite DI agentams dirbti per vietinį MCP serverį ir jo prieigos žurnalą."], "minimumHardware": ["DirectX 11 palaikančios grafikos tvarkyklės", "Klaviatūra ir pelė"], "recommendedHardware": ["Kodo tikrinimui įdiegtas clang, clangd arba rust-analyzer", "Trijų mygtukų pelė drobei slinkti"]}, "no": {"language": "Norsk bokmål", "description": "Utform programvare som en dataflytgraf, og generer programmet fra den.\n\nWirecraft er en gratis designer med åpen kildekode for hendelsesdrevet programvare og dataflytprogramvare. Plasser prosessorer, datatyper og typede koblinger på et lerret, grupper dem i kompositter, og la 45-graders ruting holde store topologier lesbare. Hver kobling er en typet buffer, hver prosessor en funksjon, og tjenestebiblioteker lånes ut til prosessorene som bruker dem.\n\nFra det samme designet genererer Wirecraft komplette programmer i C17, Rust, Go, Kotlin, JavaScript (Node.js) og PHP. Skriv hver prosessors kropp i en redigerer som fester den genererte funksjonsheaderen over koden din, slik at du alltid ser parameterne generatoren sender. Med clang, clangd eller rust-analyzer installert får du autofullføring, dokumentasjon ved peking, semantiske farger, gå til definisjon, finn referanser og kompilatordiagnostikk knyttet til enheten og linjen du skrev.\n\nPubliser deler av et design som gjenbrukbare komponenter med typede porter, og referer til dem fra andre design, låst med en innholdshash slik at oppdateringer skjer bevisst. Start nytt arbeid fra et bibliotek med arketyper, og undersøk et design med nettverksanalyse av data-, feil- og avhengighetsflytene.\n\nRundt designet får du også prosjektstyring (Kanban-tavle og backlog med status, ansvar og revisjonshistorikk), eksport av tegninger og dokumentasjon til PDF, SVG, PNG og Mermaid for utskrift og deling, og en valgfri lokal MCP-server slik at kompatible KI-agenter kan lese og redigere designet med dokumenterte verktøy.\n\nWirecraft åpner Threadworks .orch-prosjekter og bevarer dataene deres. Ingen konto kreves, og designarbeidet fungerer uten nett. Programmets grensesnitt er på engelsk. Wirecraft er under aktiv utvikling.", "shortDescription": "Utform dataflytprogramvare visuelt, og generer programmer i C17, Rust, Go, Kotlin, JavaScript eller PHP fra den. Rediger prosessorkropper med hjelp fra språkservere, gjenbruk komponenter, eksporter tegninger og koble til KI-agenter via en lokal MCP-server.", "features": ["Visuell dataflytdesigner med prosessorer, typer, typede koblinger og kompositter", "Lesbar 45-graders ruting av koblinger i store topologier", "Generer C17-, Rust-, Go-, Kotlin-, JavaScript- og PHP-programmer fra ett design", "Kroppsredigerer med den genererte funksjonsheaderen festet over koden", "Autofullføring, peking, semantiske farger og diagnostikk med clangd eller rust-analyzer", "Gå til definisjon og finn referanser på tvers av prosessorkropper", "Gjenbrukbare komponenter med typede porter, låst med innholdshash", "Arketypebibliotek og nettverksanalyse av data-, feil- og avhengighetsflyt", "Kanban-tavle, backlog, ansvar og revisjonshistorikk", "Tegningseksport til PDF, SVG, PNG og Mermaid og lokal MCP-server for KI-agenter"], "searchTerms": ["dataflyt", "programvaredesign", "kodegenerering", "C17", "Rust", "MCP-server", "arkitektur"], "captions": ["Utform en webserver som en dataflytgraf av prosessorer, typer og typede koblinger.", "Grupper prosessorer i kompositter; rutede koblinger viser hver typet buffer.", "Publiser et design som en gjenbrukbar komponent med typede inn- og utporter.", "Referer til en komponent fra et annet design; portene kobles til koblingene dine.", "Rediger en prosessorkropp under den festede, genererte C17-funksjonsheaderen.", "Fullfør medlemmene i et utlånt bibliotek mens du skriver, med clangd.", "Les dokumentasjon ved peking i Rust-kropper når rust-analyzer er installert.", "Forhåndsvis tegninger med tittelfelt, og eksporter dem til PDF, SVG, PNG eller Mermaid.", "Følg enheter på en Kanban-tavle med status, ansvar og tildelte.", "La KI-agenter arbeide via den lokale MCP-serveren og tilgangsloggen."], "minimumHardware": ["Grafikkdrivere med støtte for DirectX 11", "Tastatur og mus"], "recommendedHardware": ["clang, clangd eller rust-analyzer installert for kodekontroller", "En mus med tre knapper for å panorere lerretet"]}, "pl": {"language": "Polski", "description": "Projektuj oprogramowanie jako graf przepływu danych, a potem generuj z niego program.\n\nWirecraft to bezpłatny projektant open source dla oprogramowania sterowanego zdarzeniami i opartego na przepływie danych. Umieszczaj procesory, typy danych i typowane połączenia na kanwie, grupuj je w kompozyty i pozwól, by trasowanie pod kątem 45 stopni utrzymywało czytelność dużych topologii. Każde połączenie to typowany bufor, każdy procesor to funkcja, a biblioteki usług są udostępniane procesorom, które z nich korzystają.\n\nZ tego samego projektu Wirecraft generuje kompletne programy w językach C17, Rust, Go, Kotlin, JavaScript (Node.js) i PHP. Pisz treść każdego procesora w edytorze, który przypina wygenerowany nagłówek funkcji nad Twoim kodem, więc zawsze widzisz parametry przekazywane przez generator. Po zainstalowaniu clang, clangd lub rust-analyzer otrzymujesz uzupełnianie kodu, dokumentację po najechaniu, kolory semantyczne, przejście do definicji, wyszukiwanie odwołań i diagnostykę kompilatora powiązaną z encją i wierszem, które napisałeś.\n\nPublikuj części projektu jako komponenty wielokrotnego użytku z typowanymi portami i odwołuj się do nich z innych projektów, z przypięciem przez skrót zawartości, aby aktualizacje były świadome. Rozpoczynaj nową pracę od biblioteki archetypów i badaj projekt dzięki analizie sieciowej przepływów danych, błędów i zależności.\n\nWokół projektu masz też zarządzanie projektem (tablica Kanban i backlog ze statusem, odpowiedzialnością i historią rewizji), eksport planów i dokumentacji do PDF, SVG, PNG i Mermaid do drukowania i udostępniania oraz opcjonalny lokalny serwer MCP, przez który zgodni agenci AI mogą czytać i edytować projekt za pomocą udokumentowanych narzędzi.\n\nWirecraft otwiera projekty .orch z Threadworks i zachowuje ich dane. Konto nie jest wymagane, a projektowanie działa offline. Interfejs aplikacji jest w języku angielskim. Wirecraft jest aktywnie rozwijany.", "shortDescription": "Projektuj wizualnie oprogramowanie oparte na przepływie danych i generuj programy w C17, Rust, Go, Kotlin, JavaScript lub PHP. Edytuj treść procesorów z pomocą serwerów językowych, używaj ponownie komponentów, eksportuj plany i łącz agentów AI przez lokalny serwer MCP.", "features": ["Wizualny projektant przepływu danych z procesorami, typami, typowanymi połączeniami i kompozytami", "Czytelne trasowanie połączeń pod kątem 45 stopni w dużych topologiach", "Generowanie programów C17, Rust, Go, Kotlin, JavaScript i PHP z jednego projektu", "Edytor treści z wygenerowanym nagłówkiem funkcji przypiętym nad kodem", "Uzupełnianie, podpowiedzi, kolory semantyczne i diagnostyka z clangd lub rust-analyzer", "Przejście do definicji i wyszukiwanie odwołań w treściach procesorów", "Komponenty wielokrotnego użytku z typowanymi portami, przypięte skrótem zawartości", "Biblioteka archetypów i analiza sieciowa przepływów danych, błędów i zależności", "Tablica Kanban, backlog, odpowiedzialność i historia rewizji", "Eksport planów do PDF, SVG, PNG i Mermaid oraz lokalny serwer MCP dla agentów AI"], "searchTerms": ["przepływ danych", "projektowanie", "generowanie kodu", "C17", "Rust", "serwer MCP", "architektura"], "captions": ["Zaprojektuj serwer WWW jako graf procesorów, typów i typowanych połączeń.", "Grupuj procesory w kompozyty; trasowane połączenia pokazują każdy typowany bufor.", "Opublikuj projekt jako komponent z typowanymi portami wejściowymi i wyjściowymi.", "Odwołaj się do komponentu z innego projektu; jego porty łączą się z Twoimi połączeniami.", "Edytuj treść procesora pod przypiętym, wygenerowanym nagłówkiem funkcji C17.", "Uzupełniaj członków udostępnionej biblioteki podczas pisania dzięki clangd.", "Czytaj dokumentację po najechaniu w treściach Rust z zainstalowanym rust-analyzer.", "Podglądaj plany z tabliczką rysunkową i eksportuj je do PDF, SVG, PNG lub Mermaid.", "Śledź encje na tablicy Kanban ze statusem, odpowiedzialnością i przypisanymi osobami.", "Pozwól agentom AI pracować przez lokalny serwer MCP i jego dziennik dostępu."], "minimumHardware": ["Sterowniki graficzne obsługujące DirectX 11", "Klawiatura i mysz"], "recommendedHardware": ["Zainstalowany clang, clangd lub rust-analyzer do sprawdzania kodu", "Mysz z trzema przyciskami do przesuwania kanwy"]}, "pt": {"language": "Português", "description": "Projete software como um grafo de fluxo de dados e gere o programa a partir dele.\n\nO Wirecraft é um projetista gratuito e de código aberto para software orientado a eventos e a fluxo de dados. Coloque processadores, tipos de dados e ligações tipadas numa tela, agrupe-os em compostos e deixe o encaminhamento a 45 graus manter legíveis as topologias grandes. Cada ligação é um buffer tipado, cada processador uma função, e as bibliotecas de serviço são emprestadas aos processadores que as usam.\n\nA partir do mesmo projeto, o Wirecraft gera programas completos em C17, Rust, Go, Kotlin, JavaScript (Node.js) e PHP. Escreva o corpo de cada processador num editor que fixa o cabeçalho de função gerado acima do seu código, para ver sempre os parâmetros que o gerador vai passar. Com clang, clangd ou rust-analyzer instalados, obtém preenchimento automático, documentação ao passar o ponteiro, cores semânticas, ir para a definição, localizar referências e diagnósticos do compilador associados à entidade e à linha que escreveu.\n\nPublique partes de um projeto como componentes reutilizáveis com portas tipadas e referencie-os a partir de outros projetos, fixados por hash de conteúdo para que as atualizações sejam deliberadas. Comece novos trabalhos a partir de uma biblioteca de arquétipos e examine um projeto com a análise de rede dos seus fluxos de dados, erros e dependências.\n\nEm torno do projeto tem também gestão de projetos (quadro Kanban e backlog com estado, responsabilidade e histórico de revisões), exportação de plantas e documentação para PDF, SVG, PNG e Mermaid para imprimir e partilhar, e um servidor MCP local opcional para que agentes de IA compatíveis leiam e editem o projeto através de ferramentas documentadas.\n\nO Wirecraft abre projetos .orch do Threadworks e preserva os seus dados. Não é necessária conta e o projeto funciona offline. A interface da aplicação está em inglês. O Wirecraft está em desenvolvimento ativo.", "shortDescription": "Projete visualmente software de fluxo de dados e gere programas em C17, Rust, Go, Kotlin, JavaScript ou PHP. Edite corpos de processadores com ajuda de servidores de linguagem, reutilize componentes, exporte plantas e ligue agentes de IA através de um servidor MCP local.", "features": ["Projetista visual de fluxo de dados com processadores, tipos, ligações tipadas e compostos", "Encaminhamento legível de ligações a 45 graus para grandes topologias", "Gere programas C17, Rust, Go, Kotlin, JavaScript e PHP a partir de um projeto", "Editor de corpos com o cabeçalho de função gerado fixado acima do código", "Preenchimento, informação ao passar, cores semânticas e diagnósticos com clangd ou rust-analyzer", "Ir para a definição e localizar referências entre corpos de processadores", "Componentes reutilizáveis com portas tipadas, fixados por hash de conteúdo", "Biblioteca de arquétipos e análise de rede de fluxos de dados, erros e dependências", "Quadro Kanban, backlog, responsabilidade e histórico de revisões", "Exportação de plantas para PDF, SVG, PNG e Mermaid e servidor MCP local para agentes de IA"], "searchTerms": ["fluxo de dados", "projeto de software", "geração de código", "C17", "Rust", "servidor MCP", "arquitetura"], "captions": ["Projete um servidor web como grafo de processadores, tipos e ligações tipadas.", "Agrupe processadores em compostos; as ligações encaminhadas mostram cada buffer tipado.", "Publique um projeto como componente reutilizável com portas tipadas de entrada e saída.", "Referencie um componente a partir de outro projeto; as suas portas juntam-se às ligações.", "Edite o corpo de um processador sob o seu cabeçalho de função C17 gerado e fixado.", "Complete os membros de uma biblioteca emprestada enquanto escreve, com o clangd.", "Leia documentação ao passar o ponteiro em corpos Rust, com o rust-analyzer instalado.", "Pré-visualize plantas com legenda e exporte-as para PDF, SVG, PNG ou Mermaid.", "Acompanhe entidades num quadro Kanban com estado, responsabilidade e responsáveis.", "Deixe agentes de IA trabalhar através do servidor MCP local e do seu registo de acessos."], "minimumHardware": ["Controladores gráficos compatíveis com DirectX 11", "Teclado e rato"], "recommendedHardware": ["clang, clangd ou rust-analyzer instalados para verificações de código", "Um rato de três botões para deslocar a tela"]}, "ro": {"language": "Română", "description": "Proiectați software ca graf de flux de date, apoi generați programul din el.\n\nWirecraft este un proiectant gratuit și open source pentru software bazat pe evenimente și pe flux de date. Așezați procesoare, tipuri de date și legături tipizate pe o planșă, grupați-le în compozite și lăsați rutarea la 45 de grade să păstreze lizibile chiar și topologiile mari. Fiecare legătură este un buffer tipizat, fiecare procesor o funcție, iar bibliotecile de servicii sunt împrumutate procesoarelor care le folosesc.\n\nDin același proiect, Wirecraft generează programe complete în C17, Rust, Go, Kotlin, JavaScript (Node.js) și PHP. Scrieți corpul fiecărui procesor într-un editor care fixează antetul de funcție generat deasupra codului, astfel încât vedeți mereu parametrii pe care îi va transmite generatorul. Cu clang, clangd sau rust-analyzer instalate, beneficiați de completare automată, documentație la trecerea cursorului, culori semantice, salt la definiție, căutarea referințelor și diagnostice de compilare legate de entitatea și linia pe care le-ați scris.\n\nPublicați părți ale unui proiect ca componente reutilizabile cu porturi tipizate și referiți-le din alte proiecte, fixate prin hash de conținut, pentru ca actualizările să fie deliberate. Porniți lucrări noi dintr-o bibliotecă de arhetipuri și examinați un proiect prin analiza de rețea a fluxurilor de date, erori și dependențe.\n\nÎn jurul proiectului aveți și management de proiect (tablă Kanban și backlog cu stare, responsabilitate și istoric de revizii), exportul planurilor și al documentației în PDF, SVG, PNG și Mermaid pentru tipărire și partajare, precum și un server MCP local opțional prin care agenții AI compatibili pot citi și modifica proiectul cu instrumente documentate.\n\nWirecraft deschide proiecte .orch din Threadworks și le păstrează datele. Nu este necesar un cont, iar proiectarea funcționează offline. Interfața aplicației este în limba engleză. Wirecraft este în dezvoltare activă.", "shortDescription": "Proiectați vizual software pe flux de date și generați programe în C17, Rust, Go, Kotlin, JavaScript sau PHP. Editați corpurile procesoarelor cu ajutorul serverelor de limbaj, reutilizați componente, exportați planuri și conectați agenți AI printr-un server MCP local.", "features": ["Proiectant vizual de flux de date cu procesoare, tipuri, legături tipizate și compozite", "Rutare lizibilă a legăturilor la 45 de grade pentru topologii mari", "Generați programe C17, Rust, Go, Kotlin, JavaScript și PHP dintr-un singur proiect", "Editor de corpuri cu antetul de funcție generat fixat deasupra codului", "Completare, informații la trecerea cursorului, culori semantice și diagnostice cu clangd sau rust-analyzer", "Salt la definiție și căutarea referințelor în corpurile procesoarelor", "Componente reutilizabile cu porturi tipizate, fixate prin hash de conținut", "Bibliotecă de arhetipuri și analiză de rețea a fluxurilor de date, erori și dependențe", "Tablă Kanban, backlog, responsabilitate și istoric de revizii", "Export de planuri în PDF, SVG, PNG și Mermaid și server MCP local pentru agenți AI"], "searchTerms": ["flux de date", "proiectare software", "generare de cod", "C17", "Rust", "server MCP", "arhitectură"], "captions": ["Proiectați un server web ca graf de procesoare, tipuri și legături tipizate.", "Grupați procesoarele în compozite; legăturile rutate arată fiecare buffer tipizat.", "Publicați un proiect ca o componentă cu porturi tipizate de intrare și ieșire.", "Referiți o componentă din alt proiect; porturile ei se unesc cu legăturile dvs.", "Editați corpul unui procesor sub antetul de funcție C17 generat și fixat.", "Completați membrii unei biblioteci împrumutate în timp ce scrieți, cu clangd.", "Citiți documentația la trecerea cursorului în corpuri Rust, cu rust-analyzer instalat.", "Previzualizați planuri cu cartuș și exportați-le în PDF, SVG, PNG sau Mermaid.", "Urmăriți entitățile pe o tablă Kanban cu stare, responsabilitate și persoane alocate.", "Lăsați agenții AI să lucreze prin serverul MCP local și jurnalul său de acces."], "minimumHardware": ["Drivere grafice compatibile cu DirectX 11", "Tastatură și mouse"], "recommendedHardware": ["clang, clangd sau rust-analyzer instalat pentru verificarea codului", "Un mouse cu trei butoane pentru deplasarea planșei"]}, "ru-ua": {"language": "Русский (Украина)", "description": "Проектируйте программное обеспечение как граф потока данных и генерируйте из него программу.\n\nWirecraft — бесплатный дизайнер с открытым исходным кодом для событийно-ориентированного программного обеспечения и программ на основе потока данных. Размещайте процессоры, типы данных и типизированные связи на холсте, группируйте их в композиты, а трассировка под углом 45 градусов сохранит читаемость даже больших топологий. Каждая связь — типизированный буфер, каждый процессор — функция, а сервисные библиотеки предоставляются процессорам, которые их используют.\n\nИз одного и того же проекта Wirecraft генерирует полноценные программы на C17, Rust, Go, Kotlin, JavaScript (Node.js) и PHP. Пишите тело каждого процессора в редакторе, который закрепляет сгенерированный заголовок функции над вашим кодом, поэтому вы всегда видите параметры, которые передаст генератор. При установленных clang, clangd или rust-analyzer доступны автодополнение, документация при наведении, семантическая подсветка, переход к определению, поиск ссылок и диагностика компилятора, привязанная к сущности и строке, которые вы написали.\n\nПубликуйте части проекта как повторно используемые компоненты с типизированными портами и ссылайтесь на них из других проектов с фиксацией по хешу содержимого, чтобы обновления были осознанными. Начинайте новую работу с библиотеки архетипов и исследуйте проект с помощью сетевого анализа потоков данных, ошибок и зависимостей.\n\nВокруг проекта вы также получаете управление проектом (Kanban-доска и бэклог со статусом, ответственностью и историей ревизий), экспорт планов и документации в PDF, SVG, PNG и Mermaid для печати и обмена, а также необязательный локальный MCP-сервер, через который совместимые ИИ-агенты могут читать и изменять проект с помощью документированных инструментов.\n\nWirecraft открывает проекты .orch из Threadworks и сохраняет их данные. Учётная запись не требуется, а проектирование работает без подключения к сети. Интерфейс приложения на английском языке. Wirecraft активно развивается.", "shortDescription": "Проектируйте ПО с потоком данных визуально и генерируйте программы на C17, Rust, Go, Kotlin, JavaScript или PHP. Редактируйте тела процессоров с помощью языковых серверов, повторно используйте компоненты, экспортируйте планы и подключайте ИИ-агентов через локальный MCP-сервер.", "features": ["Визуальный дизайнер потоков данных с процессорами, типами, типизированными связями и композитами", "Читаемая трассировка связей под углом 45 градусов для больших топологий", "Генерация программ на C17, Rust, Go, Kotlin, JavaScript и PHP из одного проекта", "Редактор тел со сгенерированным заголовком функции, закреплённым над кодом", "Автодополнение, подсказки, семантическая подсветка и диагностика с clangd или rust-analyzer", "Переход к определению и поиск ссылок в телах процессоров", "Повторно используемые компоненты с типизированными портами, зафиксированные хешем", "Библиотека архетипов и сетевой анализ потоков данных, ошибок и зависимостей", "Kanban-доска, бэклог, ответственность и история ревизий", "Экспорт планов в PDF, SVG, PNG и Mermaid и локальный MCP-сервер для ИИ-агентов"], "searchTerms": ["поток данных", "проектирование ПО", "генерация кода", "C17", "Rust", "MCP-сервер", "архитектура"], "captions": ["Спроектируйте веб-сервер как граф процессоров, типов и типизированных связей.", "Группируйте процессоры в композиты; трассированные связи показывают каждый буфер.", "Опубликуйте проект как компонент с типизированными входными и выходными портами.", "Используйте компонент в другом проекте; его порты соединяются с вашими связями.", "Редактируйте тело процессора под закреплённым сгенерированным заголовком функции C17.", "Дополняйте члены предоставленной библиотеки при вводе с помощью clangd.", "Читайте документацию при наведении в телах на Rust при установленном rust-analyzer.", "Просматривайте планы со штампом и экспортируйте их в PDF, SVG, PNG или Mermaid.", "Отслеживайте сущности на Kanban-доске со статусом, ответственностью и исполнителями.", "Позвольте ИИ-агентам работать через локальный MCP-сервер и его журнал доступа."], "minimumHardware": ["Графические драйверы с поддержкой DirectX 11", "Клавиатура и мышь"], "recommendedHardware": ["Установленный clang, clangd или rust-analyzer для проверки кода", "Мышь с тремя кнопками для перемещения холста"]}, "sr-latn": {"language": "Srpski (latinica)", "description": "Dizajnirajte softver kao graf toka podataka, a zatim iz njega generišite program.\n\nWirecraft je besplatan dizajner otvorenog koda za softver zasnovan na događajima i toku podataka. Postavite procesore, tipove podataka i tipizovane veze na platno, grupišite ih u kompozite i prepustite usmeravanju pod uglom od 45 stepeni da održi čitljivost i velikih topologija. Svaka veza je tipizovani bafer, svaki procesor funkcija, a biblioteke usluga se pozajmljuju procesorima koji ih koriste.\n\nIz istog dizajna Wirecraft generiše kompletne programe u jezicima C17, Rust, Go, Kotlin, JavaScript (Node.js) i PHP. Telo svakog procesora pišete u uređivaču koji iznad vašeg koda kači generisano zaglavlje funkcije, pa uvek vidite parametre koje će generator proslediti. Uz instalirani clang, clangd ili rust-analyzer dobijate dovršavanje koda, dokumentaciju pri prelasku mišem, semantičke boje, odlazak na definiciju, pretragu referenci i dijagnostiku kompajlera povezanu sa entitetom i redom koji ste napisali.\n\nObjavite delove dizajna kao komponente za višekratnu upotrebu sa tipizovanim portovima i referencirajte ih iz drugih dizajna, zakačene hešom sadržaja kako bi ažuriranja bila namerna. Započnite novi rad iz biblioteke arhetipova i ispitajte dizajn mrežnom analizom njegovih tokova podataka, grešaka i zavisnosti.\n\nOko dizajna dobijate i upravljanje projektom (Kanban tabla i backlog sa statusom, odgovornošću i istorijom revizija), izvoz planova i dokumentacije u PDF, SVG, PNG i Mermaid za štampu i deljenje, kao i opcioni lokalni MCP server preko kog kompatibilni AI agenti mogu da čitaju i uređuju dizajn dokumentovanim alatima.\n\nWirecraft otvara Threadworks .orch projekte i čuva njihove podatke. Nalog nije potreban, a dizajniranje radi bez mreže. Interfejs aplikacije je na engleskom jeziku. Wirecraft se aktivno razvija.", "shortDescription": "Vizuelno dizajnirajte softver sa tokom podataka i generišite programe u C17, Rust, Go, Kotlin, JavaScript ili PHP. Uređujte tela procesora uz pomoć jezičkih servera, ponovo koristite komponente, izvozite planove i povežite AI agente preko lokalnog MCP servera.", "features": ["Vizuelni dizajner toka podataka sa procesorima, tipovima, tipizovanim vezama i kompozitima", "Čitljivo usmeravanje veza pod uglom od 45 stepeni za velike topologije", "Generišite C17, Rust, Go, Kotlin, JavaScript i PHP programe iz jednog dizajna", "Uređivač tela sa generisanim zaglavljem funkcije zakačenim iznad koda", "Dovršavanje, saveti, semantičke boje i dijagnostika uz clangd ili rust-analyzer", "Odlazak na definiciju i pretraga referenci kroz tela procesora", "Komponente za višekratnu upotrebu sa tipizovanim portovima, zakačene hešom sadržaja", "Biblioteka arhetipova i mrežna analiza tokova podataka, grešaka i zavisnosti", "Kanban tabla, backlog, odgovornost i istorija revizija", "Izvoz planova u PDF, SVG, PNG i Mermaid i lokalni MCP server za AI agente"], "searchTerms": ["tok podataka", "dizajn softvera", "generisanje koda", "C17", "Rust", "MCP server", "arhitektura"], "captions": ["Dizajnirajte veb server kao graf procesora, tipova i tipizovanih veza.", "Grupišite procesore u kompozite; usmerene veze prikazuju svaki tipizovani bafer.", "Objavite dizajn kao komponentu sa tipizovanim ulaznim i izlaznim portovima.", "Referencirajte komponentu iz drugog dizajna; njeni portovi se spajaju sa vašim vezama.", "Uređujte telo procesora ispod zakačenog, generisanog zaglavlja C17 funkcije.", "Dovršavajte članove pozajmljene biblioteke dok kucate, uz clangd.", "Čitajte dokumentaciju pri prelasku mišem u Rust telima uz instalirani rust-analyzer.", "Pregledajte planove sa zaglavljem crteža i izvezite ih u PDF, SVG, PNG ili Mermaid.", "Pratite entitete na Kanban tabli sa statusom, odgovornošću i izvršiocima.", "Pustite AI agente da rade preko lokalnog MCP servera i njegovog dnevnika pristupa."], "minimumHardware": ["Grafički drajveri sa podrškom za DirectX 11", "Tastatura i miš"], "recommendedHardware": ["Instaliran clang, clangd ili rust-analyzer za proveru koda", "Miš sa tri tastera za pomeranje platna"]}, "es": {"language": "Español", "description": "Diseña software como un grafo de flujo de datos y genera el programa a partir de él.\n\nWirecraft es un diseñador gratuito y de código abierto para software orientado a eventos y a flujo de datos. Coloca procesadores, tipos de datos y enlaces tipados en un lienzo, agrúpalos en compuestos y deja que el enrutado a 45 grados mantenga legibles las topologías grandes. Cada enlace es un búfer tipado, cada procesador una función, y las bibliotecas de servicios se prestan a los procesadores que las usan.\n\nA partir del mismo diseño, Wirecraft genera programas completos en C17, Rust, Go, Kotlin, JavaScript (Node.js) y PHP. Escribe el cuerpo de cada procesador en un editor que fija el encabezado de función generado encima de tu código, para que siempre veas los parámetros que pasará el generador. Con clang, clangd o rust-analyzer instalados, obtienes autocompletado, documentación al pasar el puntero, colores semánticos, ir a la definición, buscar referencias y diagnósticos del compilador asociados a la entidad y la línea que escribiste.\n\nPublica partes de un diseño como componentes reutilizables con puertos tipados y referéncialos desde otros diseños, fijados por hash de contenido para que las actualizaciones sean deliberadas. Empieza trabajos nuevos desde una biblioteca de arquetipos e inspecciona un diseño con el análisis de red de sus flujos de datos, errores y dependencias.\n\nAlrededor del diseño también tienes gestión de proyectos (tablero Kanban y backlog con estado, responsabilidad e historial de revisiones), exportación de planos y documentación a PDF, SVG, PNG y Mermaid para imprimir y compartir, y un servidor MCP local opcional para que agentes de IA compatibles lean y editen el diseño mediante herramientas documentadas.\n\nWirecraft abre proyectos .orch de Threadworks y conserva sus datos. No se requiere cuenta y el diseño funciona sin conexión. La interfaz de la aplicación está en inglés. Wirecraft está en desarrollo activo.", "shortDescription": "Diseña software de flujo de datos de forma visual y genera programas en C17, Rust, Go, Kotlin, JavaScript o PHP. Edita los cuerpos de los procesadores con ayuda de servidores de lenguaje, reutiliza componentes, exporta planos y conecta agentes de IA mediante un servidor MCP local.", "features": ["Diseñador visual de flujo de datos con procesadores, tipos, enlaces tipados y compuestos", "Enrutado legible de enlaces a 45 grados para topologías grandes", "Genera programas en C17, Rust, Go, Kotlin, JavaScript y PHP desde un diseño", "Editor de cuerpos con el encabezado de función generado fijado sobre tu código", "Autocompletado, información al pasar, colores semánticos y diagnósticos con clangd o rust-analyzer", "Ir a la definición y buscar referencias entre cuerpos de procesadores", "Componentes reutilizables con puertos tipados, fijados por hash de contenido", "Biblioteca de arquetipos y análisis de red de flujos de datos, errores y dependencias", "Tablero Kanban, backlog, responsabilidad e historial de revisiones", "Exportación de planos a PDF, SVG, PNG y Mermaid, y servidor MCP local para agentes de IA"], "searchTerms": ["flujo de datos", "diseño de software", "generación de código", "C17", "Rust", "servidor MCP", "arquitectura"], "captions": ["Diseña un servidor web como grafo de procesadores, tipos y enlaces tipados.", "Agrupa procesadores en compuestos; los enlaces enrutados muestran cada búfer tipado.", "Publica un diseño como componente reutilizable con puertos tipados de entrada y salida.", "Referencia un componente desde otro diseño; sus puertos se unen a tus enlaces.", "Edita el cuerpo de un procesador bajo su encabezado de función C17 generado y fijado.", "Completa los miembros de una biblioteca prestada mientras escribes, gracias a clangd.", "Lee la documentación al pasar el puntero en cuerpos Rust, con rust-analyzer instalado.", "Previsualiza planos con cajetín y expórtalos a PDF, SVG, PNG o Mermaid.", "Sigue las entidades en un tablero Kanban con estado, responsabilidad y asignados.", "Deja que agentes de IA trabajen mediante el servidor MCP local y su registro de accesos."], "minimumHardware": ["Controladores gráficos compatibles con DirectX 11", "Teclado y ratón"], "recommendedHardware": ["clang, clangd o rust-analyzer instalados para comprobar el código", "Un ratón de tres botones para desplazar el lienzo"]}, "sv": {"language": "Svenska", "description": "Utforma programvara som en dataflödesgraf och generera programmet från den.\n\nWirecraft är en kostnadsfri designer med öppen källkod för händelsestyrd programvara och dataflödesprogramvara. Placera processorer, datatyper och typade länkar på en arbetsyta, gruppera dem i kompositer och låt 45-gradersdragning hålla stora topologier läsbara. Varje länk är en typad buffert, varje processor en funktion, och tjänstebibliotek lånas ut till de processorer som använder dem.\n\nFrån samma design genererar Wirecraft kompletta program i C17, Rust, Go, Kotlin, JavaScript (Node.js) och PHP. Skriv varje processors kropp i en redigerare som fäster det genererade funktionshuvudet ovanför din kod, så att du alltid ser parametrarna som generatorn skickar. Med clang, clangd eller rust-analyzer installerat får du kodkomplettering, dokumentation vid hovring, semantiska färger, gå till definition, hitta referenser och kompilatordiagnostik som kopplas till entiteten och raden du skrev.\n\nPublicera delar av en design som återanvändbara komponenter med typade portar och referera till dem från andra designer, låsta med en innehållshash så att uppdateringar sker medvetet. Börja nytt arbete från ett bibliotek med arketyper och granska en design med nätverksanalys av dess data-, fel- och beroendeflöden.\n\nRunt designen får du också projektstyrning (Kanban-tavla och backlog med status, ansvar och revisionshistorik), export av ritningar och dokumentation till PDF, SVG, PNG och Mermaid för utskrift och delning samt en valfri lokal MCP-server så att kompatibla AI-agenter kan läsa och redigera designen via dokumenterade verktyg.\n\nWirecraft öppnar Threadworks .orch-projekt och bevarar deras data. Inget konto krävs och designarbetet fungerar offline. Programmets gränssnitt är på engelska. Wirecraft utvecklas aktivt.", "shortDescription": "Utforma dataflödesprogramvara visuellt och generera program i C17, Rust, Go, Kotlin, JavaScript eller PHP. Redigera processorkroppar med hjälp av språkservrar, återanvänd komponenter, exportera ritningar och anslut AI-agenter via en lokal MCP-server.", "features": ["Visuell dataflödesdesigner med processorer, typer, typade länkar och kompositer", "Läsbar länkdragning i 45 grader för stora topologier", "Generera C17-, Rust-, Go-, Kotlin-, JavaScript- och PHP-program från en design", "Kroppsredigerare med det genererade funktionshuvudet fäst ovanför koden", "Komplettering, hovring, semantiska färger och diagnostik med clangd eller rust-analyzer", "Gå till definition och hitta referenser mellan processorkroppar", "Återanvändbara komponenter med typade portar, låsta med innehållshash", "Arketypbibliotek och nätverksanalys av data-, fel- och beroendeflöden", "Kanban-tavla, backlog, ansvar och revisionshistorik", "Ritningsexport till PDF, SVG, PNG och Mermaid samt lokal MCP-server för AI-agenter"], "searchTerms": ["dataflöde", "programvarudesign", "kodgenerering", "C17", "Rust", "MCP-server", "arkitektur"], "captions": ["Utforma en webbserver som en dataflödesgraf av processorer, typer och typade länkar.", "Gruppera processorer i kompositer; dragna länkar visar varje typad buffert.", "Publicera en design som en återanvändbar komponent med typade in- och utportar.", "Referera till en komponent från en annan design; dess portar ansluter till dina länkar.", "Redigera en processorkropp under dess fästa, genererade C17-funktionshuvud.", "Komplettera medlemmarna i ett utlånat bibliotek medan du skriver, med clangd.", "Läs hovringsdokumentation i Rust-kroppar när rust-analyzer är installerat.", "Förhandsgranska ritningar med namnruta och exportera dem till PDF, SVG, PNG eller Mermaid.", "Följ entiteter på en Kanban-tavla med status, ansvar och tilldelade.", "Låt AI-agenter arbeta via den lokala MCP-servern och dess åtkomstlogg."], "minimumHardware": ["Grafikdrivrutiner med stöd för DirectX 11", "Tangentbord och mus"], "recommendedHardware": ["clang, clangd eller rust-analyzer installerat för kodkontroller", "En mus med tre knappar för att panorera arbetsytan"]}, "tr": {"language": "Türkçe", "description": "Yazılımı bir veri akışı grafiği olarak tasarlayın, ardından programı ondan üretin.\n\nWirecraft, olay güdümlü ve veri akışı tabanlı yazılımlar için ücretsiz ve açık kaynaklı bir tasarım aracıdır. İşlemcileri, veri türlerini ve türlü bağlantıları bir tuvale yerleştirin, bunları bileşik öğelerde gruplayın ve 45 derecelik yönlendirmenin büyük topolojileri bile okunur tutmasına izin verin. Her bağlantı türlü bir arabellek, her işlemci bir işlevdir ve hizmet kitaplıkları onları kullanan işlemcilere ödünç verilir.\n\nAynı tasarımdan Wirecraft; C17, Rust, Go, Kotlin, JavaScript (Node.js) ve PHP dillerinde eksiksiz programlar üretir. Her işlemcinin gövdesini, üretilen işlev başlığını kodunuzun üstüne sabitleyen bir düzenleyicide yazın; böylece üreticinin geçireceği parametreleri her zaman görürsünüz. clang, clangd veya rust-analyzer yüklüyken kod tamamlama, üzerine gelince belgeler, anlamsal renklendirme, tanıma git, başvuruları bul ve yazdığınız varlık ile satıra bağlanan derleyici tanılamaları elde edersiniz.\n\nTasarımın bölümlerini türlü bağlantı noktalarına sahip yeniden kullanılabilir bileşenler olarak yayımlayın ve diğer tasarımlardan bunlara başvurun; başvurular içerik karmasıyla sabitlenir, böylece güncellemeler bilinçli yapılır. Yeni işlere arketip kitaplığından başlayın ve tasarımı veri, hata ve bağımlılık akışlarının ağ analiziyle inceleyin.\n\nTasarımın çevresinde ayrıca proje yönetimi (durum, sorumluluk ve revizyon geçmişi içeren Kanban panosu ve iş listesi), yazdırma ve paylaşma için planları ve belgeleri PDF, SVG, PNG ve Mermaid biçimine aktarma ve uyumlu yapay zekâ ajanlarının belgelenmiş araçlarla tasarımı okuyup düzenleyebildiği isteğe bağlı yerel bir MCP sunucusu bulunur.\n\nWirecraft, Threadworks .orch projelerini açar ve verilerini korur. Hesap gerekmez ve tasarım çevrimdışı çalışır. Uygulama arabirimi İngilizcedir. Wirecraft etkin olarak geliştirilmektedir.", "shortDescription": "Veri akışı yazılımlarını görsel olarak tasarlayın ve C17, Rust, Go, Kotlin, JavaScript veya PHP programları üretin. İşlemci gövdelerini dil sunucularının yardımıyla düzenleyin, bileşenleri yeniden kullanın, planları dışa aktarın ve yapay zekâ ajanlarını yerel bir MCP sunucusuyla bağlayın.", "features": ["İşlemciler, türler, türlü bağlantılar ve bileşik öğelerle görsel veri akışı tasarımcısı", "Büyük topolojiler için okunur 45 derecelik bağlantı yönlendirmesi", "Tek bir tasarımdan C17, Rust, Go, Kotlin, JavaScript ve PHP programları üretin", "Üretilen işlev başlığının kodun üstüne sabitlendiği gövde düzenleyicisi", "clangd veya rust-analyzer ile tamamlama, ipuçları, anlamsal renkler ve tanılamalar", "İşlemci gövdeleri arasında tanıma git ve başvuruları bul", "Türlü bağlantı noktalı, içerik karmasıyla sabitlenen yeniden kullanılabilir bileşenler", "Arketip kitaplığı ve veri, hata ve bağımlılık akışlarının ağ analizi", "Kanban panosu, iş listesi, sorumluluk ve revizyon geçmişi", "Planları PDF, SVG, PNG ve Mermaid'e aktarma ve yapay zekâ ajanları için yerel MCP sunucusu"], "searchTerms": ["veri akışı", "yazılım tasarımı", "kod üretimi", "C17", "Rust", "MCP sunucusu", "mimari"], "captions": ["Bir web sunucusunu işlemciler, türler ve bağlantılardan oluşan bir veri akışı olarak tasarlayın.", "İşlemcileri bileşiklerde gruplayın; yönlendirilen bağlantılar her arabelleği gösterir.", "Bir tasarımı türlü giriş ve çıkış bağlantı noktalarına sahip bir bileşen olarak yayımlayın.", "Başka bir tasarımdan bir bileşene başvurun; bağlantı noktaları bağlantılarınıza katılır.", "Bir işlemci gövdesini sabitlenmiş, üretilmiş C17 işlev başlığının altında düzenleyin.", "clangd ile ödünç alınan kitaplığın üyelerini yazarken tamamlayın.", "rust-analyzer yüklüyken Rust gövdelerinde üzerine gelince belgeleri okuyun.", "Antetli planları önizleyin ve PDF, SVG, PNG veya Mermaid'e aktarın.", "Varlıkları durum, sorumluluk ve atananlarla bir Kanban panosunda izleyin.", "Yapay zekâ ajanlarının yerel MCP sunucusu ve erişim günlüğü üzerinden çalışmasına izin verin."], "minimumHardware": ["DirectX 11 destekli grafik sürücüleri", "Klavye ve fare"], "recommendedHardware": ["Kod denetimleri için clang, clangd veya rust-analyzer yüklü", "Tuvali kaydırmak için üç düğmeli fare"]}, "uk": {"language": "Українська", "description": "Проєктуйте програмне забезпечення як граф потоку даних, а потім генеруйте з нього програму.\n\nWirecraft — безкоштовний дизайнер із відкритим кодом для подієво-орієнтованого програмного забезпечення та програм на основі потоку даних. Розміщуйте процесори, типи даних і типізовані зв'язки на полотні, групуйте їх у композити, а трасування під кутом 45 градусів збереже читабельність навіть великих топологій. Кожен зв'язок — типізований буфер, кожен процесор — функція, а сервісні бібліотеки надаються процесорам, які їх використовують.\n\nЗ того самого проєкту Wirecraft генерує повноцінні програми мовами C17, Rust, Go, Kotlin, JavaScript (Node.js) і PHP. Пишіть тіло кожного процесора в редакторі, що закріплює згенерований заголовок функції над вашим кодом, тож ви завжди бачите параметри, які передасть генератор. Зі встановленими clang, clangd або rust-analyzer ви отримуєте автодоповнення, документацію під час наведення, семантичне підсвічування, перехід до визначення, пошук посилань і діагностику компілятора, прив'язану до сутності та рядка, які ви написали.\n\nПублікуйте частини проєкту як повторно використовувані компоненти з типізованими портами й посилайтеся на них з інших проєктів із фіксацією за хешем вмісту, щоб оновлення були свідомими. Починайте нову роботу з бібліотеки архетипів і досліджуйте проєкт за допомогою мережевого аналізу потоків даних, помилок і залежностей.\n\nДовкола проєкту ви також отримуєте керування проєктом (Kanban-дошка та беклог зі статусом, відповідальністю й історією ревізій), експорт планів і документації в PDF, SVG, PNG і Mermaid для друку та поширення, а також необов'язковий локальний MCP-сервер, через який сумісні агенти ШІ можуть читати й редагувати проєкт за допомогою задокументованих інструментів.\n\nWirecraft відкриває проєкти .orch із Threadworks і зберігає їхні дані. Обліковий запис не потрібен, а проєктування працює без мережі. Інтерфейс застосунку англійською мовою. Wirecraft активно розвивається.", "shortDescription": "Проєктуйте ПЗ із потоком даних візуально та генеруйте програми мовами C17, Rust, Go, Kotlin, JavaScript або PHP. Редагуйте тіла процесорів за допомогою мовних серверів, повторно використовуйте компоненти, експортуйте плани й під'єднуйте агентів ШІ через локальний MCP-сервер.", "features": ["Візуальний дизайнер потоків даних із процесорами, типами, типізованими зв'язками й композитами", "Читабельне трасування зв'язків під кутом 45 градусів для великих топологій", "Генерація програм C17, Rust, Go, Kotlin, JavaScript і PHP з одного проєкту", "Редактор тіл зі згенерованим заголовком функції, закріпленим над кодом", "Автодоповнення, підказки, семантичне підсвічування й діагностика з clangd або rust-analyzer", "Перехід до визначення та пошук посилань у тілах процесорів", "Повторно використовувані компоненти з типізованими портами, зафіксовані хешем", "Бібліотека архетипів і мережевий аналіз потоків даних, помилок і залежностей", "Kanban-дошка, беклог, відповідальність та історія ревізій", "Експорт планів у PDF, SVG, PNG і Mermaid та локальний MCP-сервер для агентів ШІ"], "searchTerms": ["потік даних", "проєктування ПЗ", "генерація коду", "C17", "Rust", "MCP-сервер", "архітектура"], "captions": ["Спроєктуйте вебсервер як граф процесорів, типів і типізованих зв'язків.", "Групуйте процесори в композити; трасовані зв'язки показують кожен буфер.", "Опублікуйте проєкт як компонент із типізованими вхідними й вихідними портами.", "Використайте компонент в іншому проєкті; його порти з'єднуються з вашими зв'язками.", "Редагуйте тіло процесора під закріпленим згенерованим заголовком функції C17.", "Доповнюйте члени наданої бібліотеки під час введення за допомогою clangd.", "Читайте документацію під час наведення в тілах Rust зі встановленим rust-analyzer.", "Переглядайте плани зі штампом і експортуйте їх у PDF, SVG, PNG або Mermaid.", "Відстежуйте сутності на Kanban-дошці зі статусом, відповідальністю й виконавцями.", "Дозвольте агентам ШІ працювати через локальний MCP-сервер і його журнал доступу."], "minimumHardware": ["Графічні драйвери з підтримкою DirectX 11", "Клавіатура й миша"], "recommendedHardware": ["Встановлений clang, clangd або rust-analyzer для перевірки коду", "Миша з трьома кнопками для переміщення полотна"]}, "vi": {"language": "Tiếng Việt", "description": "Thiết kế phần mềm dưới dạng đồ thị luồng dữ liệu, rồi tạo chương trình từ đó.\n\nWirecraft là công cụ thiết kế miễn phí, mã nguồn mở dành cho phần mềm hướng sự kiện và luồng dữ liệu. Đặt bộ xử lý, kiểu dữ liệu và liên kết có kiểu lên khung vẽ, gom chúng thành các khối tổng hợp, và để định tuyến 45 độ giữ cho cả những cấu trúc lớn vẫn dễ đọc. Mỗi liên kết là một bộ đệm có kiểu, mỗi bộ xử lý là một hàm, và các thư viện dịch vụ được cho các bộ xử lý sử dụng chúng mượn.\n\nTừ cùng một bản thiết kế, Wirecraft tạo ra chương trình hoàn chỉnh bằng C17, Rust, Go, Kotlin, JavaScript (Node.js) và PHP. Viết thân của từng bộ xử lý trong trình soạn thảo ghim tiêu
