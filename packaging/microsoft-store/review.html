 de dezvoltare gratuit și open source care organizează o soluție software ca pe o linie de producție. Împărțiți problema în componente de procesare și declarați explicit legăturile prin care își transmit date unele altora. În codul obișnuit aceste canale sunt implicite: datele circulă prin apeluri de funcții și metode, uneori ascunse în construirea obiectelor, iar graful apelurilor este greu de schițat fără unelte. În Wirecraft legătura este un element de proiectare de sine stătător, astfel încât arhitectura rămâne vizibilă, ca materialul care trece de la un post de lucru la altul.\n\n1. Proiectați. Plasați procesoare, tipuri și legături pe o planșă și grupați-le în compozite. Fiecare procesor este o componentă funcțională, iar fiecare legătură un canal de date tipizat. Orientarea pe obiecte rămâne: tipurile formează ierarhii și dependențe explicite, iar bibliotecile împrumută suite de metode componentelor care le folosesc.\n2. Programați. Scrieți algoritmul fiecărei componente în propriul editor, sub antetul de funcție pe care îl va produce generatorul, ca să vedeți intrările, ieșirile și bibliotecile pe care le primește. Cu clang, clangd sau rust-analyzer instalate aveți completare, informații la survolare, salt la definiție, căutarea referințelor și diagnosticele compilatorului pe liniile pe care le-ați scris.\n3. Generați. Wirecraft asamblează componentele și legăturile lor într-un program complet în C17, Rust, Go, Kotlin, JavaScript (Node.js) sau PHP.\n\nLegăturile sunt opționale. Fără ele, compozitele funcționează ca dosare, iar entitățile terminale ca fișiere, și fiecare entitate își ține codul împreună cu specificația și datele de test, astfel încât asocierea lor este explicită, nu presupusă.\n\nReutilizați părți dintr-un proiect drept componente cu porturi tipizate, porniți de la arhetipuri și analizați fluxurile de date, erori și dependențe. Wirecraft oferă și management de proiect (tablă Kanban, backlog, istoric al reviziilor), exportul planșelor în PDF, SVG, PNG și Mermaid pentru tipărire și un server MCP local opțional pentru agenți AI.\n\nWirecraft deschide proiecte .orch din Threadworks. Nu necesită cont și funcționează offline. Interfața este în limba engleză. Wirecraft este în dezvoltare activă.", "shortDescription": "Un framework de dezvoltare vizual: împărțiți o soluție software în componente unite prin legături de date explicite și tipizate, scrieți algoritmul fiecărei componente cu ajutorul unui server de limbaj și generați programe în C17, Rust, Go, Kotlin, JavaScript sau PHP. Include componente reutilizabile, management de proiect, export de planșe și un server MCP local.", "features": ["Construcție vizuală: împărțiți o soluție în componente de procesare unite prin legături de date explicite", "Legăturile declară canalele de date dintre componente, ca posturile unei linii de asamblare", "Tipuri cu ierarhii și dependențe explicite; bibliotecile împrumută metode componentelor", "Scrieți algoritmul fiecărei componente sub antetul de funcție generat și fixat", "Completare, informații la survolare, definiție, referințe și diagnostice cu clangd sau rust-analyzer", "Generați programe C17, Rust, Go, Kotlin, JavaScript și PHP din proiect și din codul dvs.", "Fără legături, compozitele sunt dosare, iar entitățile fișiere cu cod, specificație și teste", "Componente reutilizabile cu porturi tipizate, arhetipuri și analiza fluxurilor de date și dependențe", "Tablă Kanban, backlog, responsabilitate și istoric al reviziilor", "Export de planșe în PDF, SVG, PNG și Mermaid și server MCP local pentru agenți AI"], "searchTerms": ["flux de date", "programare vizuală", "arhitectură software", "generare de cod", "C17", "Rust", "server MCP"], "captions": ["Construiți un server web din componente de procesare unite prin legături de date explicite și tipizate.", "Grupați componentele în compozite; legăturile trasate arată fiecare canal de date.", "Publicați un proiect ca o componentă cu porturi tipizate de intrare și ieșire.", "Referiți o componentă din alt proiect; porturile ei se unesc cu legăturile dvs.", "Scrieți algoritmul unei componente sub antetul de funcție C17 generat și fixat.", "Completați membrii unei biblioteci împrumutate în timp ce scrieți, cu clangd.", "Citiți documentația la trecerea cursorului în corpuri Rust, cu rust-analyzer instalat.", "Previzualizați planuri cu cartuș și exportați-le în PDF, SVG, PNG sau Mermaid.", "Urmăriți entitățile pe o tablă Kanban cu stare, responsabilitate și persoane alocate.", "Lăsați agenții AI să lucreze prin serverul MCP local și jurnalul său de acces."], "minimumHardware": ["Drivere grafice compatibile cu DirectX 11", "Tastatură și mouse"], "recommendedHardware": ["clang, clangd sau rust-analyzer instalat pentru verificarea codului", "Un mouse cu trei butoane pentru deplasarea planșei"]}, "ru-ua": {"language": "Русский (Украина)", "description": "Стройте программное обеспечение визуально, напишите алгоритм каждого компонента, а затем сгенерируйте программу.\n\nWirecraft — бесплатный фреймворк разработки с открытым исходным кодом, который выстраивает программное решение как производственную линию. Вы разбиваете задачу на компоненты обработки и явно объявляете связи, по которым они передают друг другу данные. В обычном коде эти каналы неявны: данные проходят через вызовы функций и методов, иногда скрытые в создании объектов, а граф вызовов трудно набросать без инструментов. В Wirecraft связь — отдельный элемент проекта, поэтому архитектура остаётся видимой, как материал, переходящий от одного рабочего места к другому.\n\n1. Проектируйте. Разместите процессоры, типы и связи на холсте и сгруппируйте их в композиты. Каждый процессор — функциональный компонент, а каждая связь — типизированный канал данных. Объектная ориентация сохраняется: типы образуют явные иерархии и зависимости, а библиотеки предоставляют наборы методов компонентам, которые ими пользуются.\n2. Программируйте. Пишите алгоритм каждого компонента в собственном редакторе под заголовком функции, который создаст генератор, чтобы видеть входы, выходы и библиотеки, которые он получает. С установленными clang, clangd или rust-analyzer доступны автодополнение, подсказки, переход к определению, поиск ссылок и диагностика компилятора для написанных вами строк.\n3. Генерируйте. Wirecraft собирает компоненты и их связи в полную программу на C17, Rust, Go, Kotlin, JavaScript (Node.js) или PHP.\n\nСвязи необязательны. Без них композиты работают как папки, а конечные сущности — как файлы, и каждая сущность хранит свой код вместе со спецификацией и тестовыми данными, так что их связь явная, а не подразумеваемая.\n\nПовторно используйте части проекта как компоненты с типизированными портами, начинайте с архетипов и анализируйте потоки данных, ошибок и зависимостей. Wirecraft также предлагает управление проектом (доска Kanban, бэклог, история ревизий), экспорт чертежей в PDF, SVG, PNG и Mermaid для печати и необязательный локальный MCP-сервер для ИИ-агентов.\n\nWirecraft открывает проекты .orch из Threadworks. Учётная запись не нужна, программа работает офлайн. Интерфейс на английском языке. Wirecraft активно развивается.", "shortDescription": "Визуальный фреймворк разработки: разбейте программное решение на компоненты, соединённые явными типизированными связями данных, напишите алгоритм каждого компонента с помощью языкового сервера и генерируйте программы на C17, Rust, Go, Kotlin, JavaScript или PHP. Включает повторно используемые компоненты, управление проектом, экспорт чертежей и локальный MCP-сервер.", "features": ["Визуальное построение: разбейте решение на компоненты обработки, соединённые явными связями данных", "Связи объявляют каналы данных между компонентами, как станции сборочной линии", "Типы с явными иерархиями и зависимостями; библиотеки предоставляют методы компонентам", "Пишите алгоритм каждого компонента под закреплённым сгенерированным заголовком функции", "Автодополнение, подсказки, определения, ссылки и диагностика с clangd или rust-analyzer", "Генерируйте программы на C17, Rust, Go, Kotlin, JavaScript и PHP из проекта и вашего кода", "Без связей композиты — это папки, а сущности — файлы с кодом, спецификацией и тестами", "Повторно используемые компоненты с типизированными портами, архетипы и анализ потоков данных и зависимостей", "Доска Kanban, бэклог, ответственность и история ревизий", "Экспорт чертежей в PDF, SVG, PNG и Mermaid и локальный MCP-сервер для ИИ-агентов"], "searchTerms": ["поток данных", "визуальное программирование", "архитектура ПО", "генерация кода", "C17", "Rust", "MCP-сервер"], "captions": ["Постройте веб-сервер из компонентов обработки, соединённых явными типизированными связями данных.", "Группируйте компоненты в композиты; проложенные связи показывают каждый канал данных.", "Опубликуйте проект как компонент с типизированными входными и выходными портами.", "Используйте компонент в другом проекте; его порты соединяются с вашими связями.", "Пишите алгоритм компонента под закреплённым сгенерированным заголовком функции C17.", "Дополняйте члены предоставленной библиотеки при вводе с помощью clangd.", "Читайте документацию при наведении в телах на Rust при установленном rust-analyzer.", "Просматривайте планы со штампом и экспортируйте их в PDF, SVG, PNG или Mermaid.", "Отслеживайте сущности на Kanban-доске со статусом, ответственностью и исполнителями.", "Позвольте ИИ-агентам работать через локальный MCP-сервер и его журнал доступа."], "minimumHardware": ["Графические драйверы с поддержкой DirectX 11", "Клавиатура и мышь"], "recommendedHardware": ["Установленный clang, clangd или rust-analyzer для проверки кода", "Мышь с тремя кнопками для перемещения холста"]}, "sr-latn": {"language": "Srpski (latinica)", "description": "Izgradite softver vizuelno, napišite algoritam svake komponente, a zatim generišite program.\n\nWirecraft je besplatan razvojni okvir otvorenog koda koji softversko rešenje uređuje kao proizvodnu liniju. Problem delite na komponente za obradu i izričito deklarišete veze preko kojih jedna drugoj prosleđuju podatke. U uobičajenom kodu ti kanali su implicitni: podaci putuju kroz pozive funkcija i metoda, ponekad skrivene u pravljenju objekata, a graf poziva je teško skicirati bez alata. U Wirecraftu je veza zaseban element dizajna, pa arhitektura ostaje vidljiva kao materijal koji prelazi sa jednog radnog mesta na drugo.\n\n1. Projektujte. Postavite procesore, tipove i veze na platno i grupišite ih u kompozite. Svaki procesor je funkcionalna komponenta, a svaka veza tipizirani kanal podataka. Objektna orijentacija ostaje: tipovi čine izričite hijerarhije i zavisnosti, a biblioteke pozajmljuju skupove metoda komponentama koje ih koriste.\n2. Programirajte. Pišite algoritam svake komponente u sopstvenom uređivaču, ispod zaglavlja funkcije koje će generator napraviti, tako da vidite ulaze, izlaze i biblioteke koje dobija. Uz instalirani clang, clangd ili rust-analyzer dobijate dovršavanje, opise pri prelasku mišem, prelazak na definiciju, pretragu referenci i dijagnostiku kompajlera za redove koje ste napisali.\n3. Generišite. Wirecraft sklapa komponente i njihove veze u potpun program na jeziku C17, Rust, Go, Kotlin, JavaScript (Node.js) ili PHP.\n\nVeze nisu obavezne. Bez njih kompoziti rade kao fascikle, a krajnji entiteti kao datoteke, i svaki entitet drži svoj kod zajedno sa specifikacijom i test podacima, pa je njihova povezanost izričita, a ne podrazumevana.\n\nPonovo koristite delove dizajna kao komponente sa tipiziranim portovima, počnite od arhetipova i analizirajte tokove podataka, grešaka i zavisnosti. Wirecraft nudi i upravljanje projektom (Kanban tabla, zaostaci, istorija revizija), izvoz crteža u PDF, SVG, PNG i Mermaid za štampu i opcioni lokalni MCP server za AI agente.\n\nWirecraft otvara Threadworks .orch projekte. Nalog nije potreban i radi bez veze sa internetom. Interfejs je na engleskom. Wirecraft se aktivno razvija.", "shortDescription": "Vizuelni razvojni okvir: podelite softversko rešenje na komponente povezane izričitim tipiziranim vezama podataka, napišite algoritam svake komponente uz pomoć jezičkog servera i generišite programe na C17, Rust, Go, Kotlin, JavaScript ili PHP. Uključuje komponente za višekratnu upotrebu, upravljanje projektom, izvoz crteža i lokalni MCP server.", "features": ["Vizuelna izgradnja: podelite rešenje na komponente za obradu povezane izričitim vezama podataka", "Veze deklarišu kanale podataka između komponenti, kao stanice montažne linije", "Tipovi sa izričitim hijerarhijama i zavisnostima; biblioteke pozajmljuju metode komponentama", "Pišite algoritam svake komponente ispod zakačenog generisanog zaglavlja funkcije", "Dovršavanje, opisi, definicije, reference i dijagnostika uz clangd ili rust-analyzer", "Generišite C17, Rust, Go, Kotlin, JavaScript i PHP programe iz dizajna i svog koda", "Bez veza kompoziti su fascikle, a entiteti datoteke sa kodom, specifikacijom i testovima", "Komponente za višekratnu upotrebu sa tipiziranim portovima, arhetipovi i analiza tokova podataka i zavisnosti", "Kanban tabla, zaostaci, odgovornost i istorija revizija", "Izvoz crteža u PDF, SVG, PNG i Mermaid i lokalni MCP server za AI agente"], "searchTerms": ["tok podataka", "vizuelno programiranje", "softverska arhitektura", "generisanje koda", "C17", "Rust", "MCP server"], "captions": ["Izgradite veb server od komponenti za obradu povezanih izričitim tipiziranim vezama podataka.", "Grupišite komponente u kompozite; provučene veze prikazuju svaki kanal podataka.", "Objavite dizajn kao komponentu sa tipizovanim ulaznim i izlaznim portovima.", "Referencirajte komponentu iz drugog dizajna; njeni portovi se spajaju sa vašim vezama.", "Pišite algoritam komponente ispod zakačenog generisanog zaglavlja C17 funkcije.", "Dovršavajte članove pozajmljene biblioteke dok kucate, uz clangd.", "Čitajte dokumentaciju pri prelasku mišem u Rust telima uz instalirani rust-analyzer.", "Pregledajte planove sa zaglavljem crteža i izvezite ih u PDF, SVG, PNG ili Mermaid.", "Pratite entitete na Kanban tabli sa statusom, odgovornošću i izvršiocima.", "Pustite AI agente da rade preko lokalnog MCP servera i njegovog dnevnika pristupa."], "minimumHardware": ["Grafički drajveri sa podrškom za DirectX 11", "Tastatura i miš"], "recommendedHardware": ["Instaliran clang, clangd ili rust-analyzer za proveru koda", "Miš sa tri tastera za pomeranje platna"]}, "es": {"language": "Español", "description": "Construye software de forma visual, escribe el algoritmo de cada componente y genera el programa.\n\nWirecraft es un framework de desarrollo gratuito y de código abierto que organiza una solución de software como una línea de producción. Divides el problema en componentes de procesamiento y declaras explícitamente los enlaces por los que se pasan datos entre sí. En el código convencional esos canales son implícitos: los datos viajan mediante llamadas a funciones y métodos, a veces ocultas en la construcción de objetos, y el grafo de llamadas es difícil de esbozar sin herramientas. En Wirecraft el enlace es un elemento de diseño propio, así que la arquitectura sigue a la vista, como material que pasa de una estación de trabajo a otra.\n\n1. Diseñar. Coloca procesadores, tipos y enlaces en un lienzo y agrúpalos en compuestos. Cada procesador es un componente funcional y cada enlace un canal de datos tipado. La orientación a objetos se mantiene: los tipos forman jerarquías y dependencias explícitas, y las bibliotecas prestan conjuntos de métodos a los componentes que las usan.\n2. Programar. Escribe el algoritmo de cada componente en su propio editor, bajo la cabecera de función que producirá el generador, para ver las entradas, salidas y bibliotecas que recibe. Con clang, clangd o rust-analyzer instalados obtienes autocompletado, información al pasar el cursor, ir a la definición, buscar referencias y diagnósticos del compilador en las líneas que escribiste.\n3. Generar. Wirecraft ensambla los componentes y sus enlaces en un programa completo en C17, Rust, Go, Kotlin, JavaScript (Node.js) o PHP.\n\nLos enlaces son opcionales. Sin ellos, los compuestos actúan como carpetas y las entidades finales como archivos, y cada entidad mantiene su código junto con su especificación y sus datos de prueba, de modo que su asociación es explícita y no supuesta.\n\nReutiliza partes de un diseño como componentes con puertos tipados, parte de arquetipos y analiza los flujos de datos, errores y dependencias. Wirecraft también ofrece gestión de proyectos (tablero Kanban, backlog, historial de revisiones), exportación de planos a PDF, SVG, PNG y Mermaid para imprimir y un servidor MCP local opcional para agentes de IA.\n\nWirecraft abre proyectos .orch de Threadworks. No requiere cuenta y funciona sin conexión. La interfaz está en inglés. Wirecraft está en desarrollo activo.", "shortDescription": "Un framework de desarrollo visual: divide una solución de software en componentes unidos por enlaces de datos explícitos y tipados, escribe el algoritmo de cada componente con ayuda de un servidor de lenguaje y genera programas en C17, Rust, Go, Kotlin, JavaScript o PHP. Incluye componentes reutilizables, gestión de proyectos, exportación de planos y un servidor MCP local.", "features": ["Construcción visual: divide una solución en componentes de procesamiento unidos por enlaces de datos explícitos", "Los enlaces declaran los canales de datos entre componentes, como estaciones de una línea de montaje", "Tipos con jerarquías y dependencias explícitas; las bibliotecas prestan métodos a los componentes", "Escribe el algoritmo de cada componente bajo su cabecera de función generada y fijada", "Autocompletado, información emergente, definición, referencias y diagnósticos con clangd o rust-analyzer", "Genera programas en C17, Rust, Go, Kotlin, JavaScript y PHP a partir del diseño y tu código", "Sin enlaces, los compuestos son carpetas y las entidades archivos con código, especificación y pruebas", "Componentes reutilizables con puertos tipados, arquetipos y análisis de flujos de datos y dependencias", "Tablero Kanban, backlog, responsabilidad e historial de revisiones", "Exportación de planos a PDF, SVG, PNG y Mermaid, y servidor MCP local para agentes de IA"], "searchTerms": ["flujo de datos", "programación visual", "arquitectura de software", "generación de código", "C17", "Rust", "servidor MCP"], "captions": ["Construye un servidor web con componentes de procesamiento unidos por enlaces de datos explícitos y tipados.", "Agrupa componentes en compuestos; los enlaces trazados muestran cada canal de datos.", "Publica un diseño como componente reutilizable con puertos tipados de entrada y salida.", "Referencia un componente desde otro diseño; sus puertos se unen a tus enlaces.", "Escribe el algoritmo de un componente bajo su cabecera de función C17 generada y fijada.", "Completa los miembros de una biblioteca prestada mientras escribes, gracias a clangd.", "Lee la documentación al pasar el puntero en cuerpos Rust, con rust-analyzer instalado.", "Previsualiza planos con cajetín y expórtalos a PDF, SVG, PNG o Mermaid.", "Sigue las entidades en un tablero Kanban con estado, responsabilidad y asignados.", "Deja que agentes de IA trabajen mediante el servidor MCP local y su registro de accesos."], "minimumHardware": ["Controladores gráficos compatibles con DirectX 11", "Teclado y ratón"], "recommendedHardware": ["clang, clangd o rust-analyzer instalados para comprobar el código", "Un ratón de tres botones para desplazar el lienzo"]}, "sv": {"language": "Svenska", "description": "Bygg upp programvara visuellt, skriv varje komponents algoritm och generera sedan programmet.\n\nWirecraft är ett kostnadsfritt utvecklingsramverk med öppen källkod som lägger upp en programvarulösning som en produktionslinje. Du delar upp problemet i bearbetande komponenter och deklarerar uttryckligen de länkar som de skickar data till varandra genom. I vanlig kod är kanalerna implicita: data färdas genom funktions- och metodanrop, ibland dolda i skapandet av objekt, och anropsgrafen är svår att skissa utan verktyg. I Wirecraft är länken ett eget designelement, så att arkitekturen förblir synlig som material som flyttas mellan arbetsstationer.\n\n1. Designa. Placera processorer, typer och länkar på en arbetsyta och gruppera dem i kompositer. Varje processor är en funktionell komponent och varje länk en typad datakanal. Objektorienteringen finns kvar: typer bildar uttryckliga hierarkier och beroenden, och bibliotek lånar ut uppsättningar av metoder till de komponenter som använder dem.\n2. Programmera. Skriv algoritmen för varje komponent i en egen redigerare, under det funktionshuvud som generatorn kommer att skapa, så att du ser vilka indata, utdata och bibliotek den får. Med clang, clangd eller rust-analyzer installerat får du komplettering, hovringsinformation, gå till definition, sök referenser och kompilatordiagnostik på raderna du skrev.\n3. Generera. Wirecraft sätter ihop komponenterna och deras länkar till ett komplett program i C17, Rust, Go, Kotlin, JavaScript (Node.js) eller PHP.\n\nLänkar är valfria. Utan dem fungerar kompositer som mappar och lövenheter som filer, och varje enhet håller ihop sin kod med sin specifikation och sina testdata, så att sambandet är uttryckligt i stället för underförstått.\n\nÅteranvänd delar av en design som komponenter med typade portar, börja från arketyper och analysera data-, fel- och beroendeflöden. Wirecraft erbjuder även projekthantering (Kanban-tavla, backlog, revisionshistorik), export av ritningar till PDF, SVG, PNG och Mermaid för utskrift och en valfri lokal MCP-server för AI-agenter.\n\nWirecraft öppnar Threadworks-.orch-projekt. Inget konto krävs och det fungerar offline. Gränssnittet är på engelska. Wirecraft utvecklas aktivt.", "shortDescription": "Ett visuellt utvecklingsramverk: dela upp en programvarulösning i komponenter förbundna med uttryckliga, typade datalänkar, skriv varje komponents algoritm med hjälp av en språkserver och generera program i C17, Rust, Go, Kotlin, JavaScript eller PHP. Med återanvändbara komponenter, projekthantering, export av ritningar och en lokal MCP-server.", "features": ["Visuell uppbyggnad: dela upp en lösning i bearbetande komponenter med uttryckliga datalänkar", "Länkar deklarerar datakanalerna mellan komponenter, som stationer på ett löpande band", "Typer med uttryckliga hierarkier och beroenden; bibliotek lånar ut metoder till komponenter", "Skriv varje komponents algoritm under dess fästa, genererade funktionshuvud", "Komplettering, hovring, definition, referenser och diagnostik med clangd eller rust-analyzer", "Generera program i C17, Rust, Go, Kotlin, JavaScript och PHP från designen och din kod", "Utan länkar är kompositer mappar och enheter filer med kod, specifikation och tester", "Återanvändbara komponenter med typade portar, arketyper och analys av data- och beroendeflöden", "Kanban-tavla, backlog, ansvar och revisionshistorik", "Export av ritningar till PDF, SVG, PNG och Mermaid samt en lokal MCP-server för AI-agenter"], "searchTerms": ["dataflöde", "visuell programmering", "programvaruarkitektur", "kodgenerering", "C17", "Rust", "MCP-server"], "captions": ["Bygg upp en webbserver av bearbetande komponenter förbundna med uttryckliga, typade datalänkar.", "Gruppera komponenter i kompositer; dragna länkar visar varje datakanal.", "Publicera en design som en återanvändbar komponent med typade in- och utportar.", "Referera till en komponent från en annan design; dess portar ansluter till dina länkar.", "Skriv en komponents algoritm under dess fästa, genererade C17-funktionshuvud.", "Komplettera medlemmarna i ett utlånat bibliotek medan du skriver, med clangd.", "Läs hovringsdokumentation i Rust-kroppar när rust-analyzer är installerat.", "Förhandsgranska ritningar med namnruta och exportera dem till PDF, SVG, PNG eller Mermaid.", "Följ entiteter på en Kanban-tavla med status, ansvar och tilldelade.", "Låt AI-agenter arbeta via den lokala MCP-servern och dess åtkomstlogg."], "minimumHardware": ["Grafikdrivrutiner med stöd för DirectX 11", "Tangentbord och mus"], "recommendedHardware": ["clang, clangd eller rust-analyzer installerat för kodkontroller", "En mus med tre knappar för att panorera arbetsytan"]}, "tr": {"language": "Türkçe", "description": "Yazılımı görsel olarak kurun, her bileşenin algoritmasını yazın ve ardından programı üretin.\n\nWirecraft, bir yazılım çözümünü üretim hattı gibi düzenleyen ücretsiz ve açık kaynaklı bir geliştirme çerçevesidir. Problemi işleme bileşenlerine ayırır ve bunların birbirine veri aktardığı bağlantıları açıkça bildirirsiniz. Geleneksel kodda bu kanallar örtüktür: veriler fonksiyon ve metot çağrılarıyla, bazen nesne oluşturmanın içine gizlenmiş olarak dolaşır ve çağrı grafiğini araçlar olmadan çizmek zordur. Wirecraft'ta bağlantı kendi başına bir tasarım öğesidir; böylece mimari, bir iş istasyonundan diğerine geçen malzeme gibi görünür kalır.\n\n1. Tasarlayın. İşlemcileri, türleri ve bağlantıları bir tuvale yerleştirip bileşiklerde gruplayın. Her işlemci işlevsel bir bileşen, her bağlantı türü belirli bir veri kanalıdır. Nesne yönelimi korunur: türler açık hiyerarşiler ve bağımlılıklar oluşturur, kütüphaneler de onları kullanan bileşenlere metot takımları ödünç verir.\n2. Programlayın. Her bileşenin algoritmasını, üretecin oluşturacağı fonksiyon başlığının altında kendi düzenleyicisinde yazın; böylece aldığı girdileri, çıktıları ve kütüphaneleri görürsünüz. clang, clangd veya rust-analyzer kuruluysa tamamlama, üzerine gelince bilgi, tanıma gitme, başvuruları bulma ve yazdığınız satırlarda derleyici tanılamaları elde edersiniz.\n3. Üretin. Wirecraft bileşenleri ve bağlantılarını C17, Rust, Go, Kotlin, JavaScript (Node.js) veya PHP dilinde eksiksiz bir programda birleştirir.\n\nBağlantılar isteğe bağlıdır. Bağlantı olmadan bileşikler klasör, uç varlıklar dosya gibi çalışır ve her varlık kodunu belirtimi ve test verileriyle birlikte tutar; böylece aralarındaki ilişki varsayılan değil, açıktır.\n\nTasarımın parçalarını türlendirilmiş bağlantı noktalarına sahip bileşenler olarak yeniden kullanın, arketiplerden başlayın ve veri, hata ve bağımlılık akışlarını analiz edin. Wirecraft ayrıca proje yönetimi (Kanban panosu, iş listesi, revizyon geçmişi), yazdırma için PDF, SVG, PNG ve Mermaid biçiminde çizim dışa aktarma ve yapay zekâ ajanları için isteğe bağlı yerel bir MCP sunucusu sunar.\n\nWirecraft, Threadworks .orch projelerini açar. Hesap gerekmez ve çevrimdışı çalışır. Arayüz İngilizcedir. Wirecraft etkin olarak geliştirilmektedir.", "shortDescription": "Görsel bir geliştirme çerçevesi: bir yazılım çözümünü açık ve türlendirilmiş veri bağlantılarıyla birleşen bileşenlere ayırın, her bileşenin algoritmasını dil sunucusu desteğiyle yazın ve C17, Rust, Go, Kotlin, JavaScript veya PHP programları üretin. Yeniden kullanılabilir bileşenler, proje yönetimi, çizim dışa aktarma ve yerel MCP sunucusu içerir.", "features": ["Görsel kurulum: bir çözümü açık veri bağlantılarıyla birleşen işleme bileşenlerine ayırın", "Bağlantılar, bileşenler arasındaki veri kanallarını montaj hattının istasyonları gibi bildirir", "Açık hiyerarşi ve bağımlılıklara sahip türler; kütüphaneler bileşenlere metot ödünç verir", "Her bileşenin algoritmasını sabitlenmiş, üretilmiş fonksiyon başlığının altına yazın", "clangd veya rust-analyzer ile tamamlama, bilgi, tanım, başvurular ve tanılamalar", "Tasarımdan ve kodunuzdan C17, Rust, Go, Kotlin, JavaScript ve PHP programları üretin", "Bağlantı olmadan bileşikler klasör, varlıklar ise kod, belirtim ve test içeren dosyalardır", "Türlendirilmiş bağlantı noktalı yeniden kullanılabilir bileşenler, arketipler ve veri ile bağımlılık akışı analizi", "Kanban panosu, iş listesi, sorumluluk ve revizyon geçmişi", "PDF, SVG, PNG ve Mermaid çizim dışa aktarma ile yapay zekâ ajanları için yerel MCP sunucusu"], "searchTerms": ["veri akışı", "görsel programlama", "yazılım mimarisi", "kod üretimi", "C17", "Rust", "MCP sunucusu"], "captions": ["Açık ve türlendirilmiş veri bağlantılarıyla birleşen işleme bileşenlerinden bir web sunucusu kurun.", "Bileşenleri bileşiklerde gruplayın; yönlendirilmiş bağlantılar her veri kanalını gösterir.", "Bir tasarımı türlü giriş ve çıkış bağlantı noktalarına sahip bir bileşen olarak yayımlayın.", "Başka bir tasarımdan bir bileşene başvurun; bağlantı noktaları bağlantılarınıza katılır.", "Bir bileşenin algoritmasını sabitlenmiş, üretilmiş C17 fonksiyon başlığının altına yazın.", "clangd ile ödünç alınan kitaplığın üyelerini yazarken tamamlayın.", "rust-analyzer yüklüyken Rust gövdelerinde üzerine gelince belgeleri okuyun.", "Antetli planları önizleyin ve PDF, SVG, PNG veya Mermaid'e aktarın.", "Varlıkları durum, sorumluluk ve atananlarla bir Kanban panosunda izleyin.", "Yapay zekâ ajanlarının yerel MCP sunucusu ve erişim günlüğü üzerinden çalışmasına izin verin."], "minimumHardware": ["DirectX 11 destekli grafik sürücüleri", "Klavye ve fare"], "recommendedHardware": ["Kod denetimleri için clang, clangd veya rust-analyzer yüklü", "Tuvali kaydırmak için üç düğmeli fare"]}, "uk": {"language": "Українська", "description": "Будуйте програмне забезпечення візуально, напишіть алгоритм кожного компонента, а потім згенеруйте програму.\n\nWirecraft — безкоштовний фреймворк розробки з відкритим кодом, який вибудовує програмне рішення як виробничу лінію. Ви розбиваєте задачу на компоненти обробки та явно оголошуєте зв'язки, якими вони передають дані одне одному. У звичайному коді ці канали неявні: дані проходять через виклики функцій і методів, іноді приховані у створенні об'єктів, а граф викликів важко накреслити без інструментів. У Wirecraft зв'язок — окремий елемент проєкту, тож архітектура лишається видимою, як матеріал, що переходить між робочими місцями.\n\n1. Проєктуйте. Розмістіть процесори, типи та зв'язки на полотні й згрупуйте їх у композити. Кожен процесор — це функціональний компонент, а кожен зв'язок — типізований канал даних. Об'єктна орієнтація зберігається: типи утворюють явні ієрархії та залежності, а бібліотеки надають набори методів компонентам, які ними користуються.\n2. Програмуйте. Пишіть алгоритм кожного компонента у власному редакторі під заголовком функції, який створить генератор, щоб бачити входи, виходи та бібліотеки, які він отримує. Зі встановленими clang, clangd або rust-analyzer ви маєте автодоповнення, підказки, перехід до визначення, пошук посилань і діагностику компілятора для написаних вами рядків.\n3. Генеруйте. Wirecraft збирає компоненти та їхні зв'язки в повну програму мовою C17, Rust, Go, Kotlin, JavaScript (Node.js) або PHP.\n\nЗв'язки необов'язкові. Без них композити працюють як теки, а кінцеві сутності як файли, і кожна сутність тримає свій код разом зі специфікацією та тестовими даними, тож їхній зв'язок явний, а не уявний.\n\nПовторно використовуйте частини проєкту як компоненти з типізованими портами, починайте з архетипів і аналізуйте потоки даних, помилок і залежностей. Wirecraft також пропонує керування проєктом (дошка Kanban, беклог, історія ревізій), експорт креслень у PDF, SVG, PNG і Mermaid для друку та необов'язковий локальний MCP-сервер для агентів ШІ.\n\nWirecraft відкриває проєкти .orch з Threadworks. Обліковий запис не потрібен, програма працює офлайн. Інтерфейс англійською мовою. Wirecraft активно розвивається.", "shortDescription": "Візуальний фреймворк розробки: розбийте програмне рішення на компоненти, з'єднані явними типізованими зв'язками даних, напишіть алгоритм кожного компонента з допомогою мовного сервера та генеруйте програми мовами C17, Rust, Go, Kotlin, JavaScript або PHP. Містить багаторазові компоненти, керування проєктом, експорт креслень і локальний MCP-сервер.", "features": ["Візуальна побудова: розбийте рішення на компоненти обробки, з'єднані явними зв'язками даних", "Зв'язки оголошують канали даних між компонентами, як станції складальної лінії", "Типи з явними ієрархіями та залежностями; бібліотеки надають методи компонентам", "Пишіть алгоритм кожного компонента під закріпленим згенерованим заголовком функції", "Автодоповнення, підказки, визначення, посилання та діагностика з clangd або rust-analyzer", "Генеруйте програми C17, Rust, Go, Kotlin, JavaScript і PHP з проєкту та вашого коду", "Без зв'язків композити — це теки, а сутності — файли з кодом, специфікацією й тестами", "Багаторазові компоненти з типізованими портами, архетипи та аналіз потоків даних і залежностей", "Дошка Kanban, беклог, відповідальність та історія ревізій", "Експорт креслень у PDF, SVG, PNG і Mermaid та локальний MCP-сервер для агентів ШІ"], "searchTerms": ["потік даних", "візуальне програмування", "архітектура ПЗ", "генерація коду", "C17", "Rust", "MCP-сервер"], "captions": ["Побудуйте вебсервер з компонентів обробки, з'єднаних явними типізованими зв'язками даних.", "Групуйте компоненти в композити; прокладені зв'язки показують кожен канал даних.", "Опублікуйте проєкт як компонент із типізованими вхідними й вихідними портами.", "Використайте компонент в іншому проєкті; його порти з'єднуються з вашими зв'язками.", "Пишіть алгоритм компонента під закріпленим згенерованим заголовком функції C17.", "Доповнюйте члени наданої бібліотеки під час введення за допомогою clangd.", "Читайте документацію під час наведення в тілах Rust зі встановленим rust-analyzer.", "Переглядайте плани зі штампом і експортуйте їх у PDF, SVG, PNG або Mermaid.", "Відстежуйте сутності на Kanban-дошці зі статусом, відповідальністю й виконавцями.", "Дозвольте агентам ШІ працювати через локальний MCP-сервер і його журнал доступу."], "minimumHardware": ["Графічні драйвери з підтримкою DirectX 11", "Клавіатура й миша"], "recommendedHardware": ["Встановлений clang, clangd або rust-analyzer для перевірки коду", "Миша з трьома кнопками для переміщення полотна"]}, "vi": {"language": "Tiếng Việt", "description": "Dựng phần mềm một cách trực quan, viết thuật toán cho từng thành phần, rồi tạo chương trình.\n\nWirecraft là một framework phát triển miễn phí, mã nguồn mở, tổ chức giải pháp phần mềm giống như một dây chuyền sản xuất. Bạn chia bài toán thành các thành phần xử lý và khai báo tường minh các liên kết mà qua đó chúng truyền dữ liệu cho nhau. Trong mã truyền thống, các kênh này là ngầm định: dữ liệu đi qua các lời gọi hàm và phương thức, đôi khi ẩn trong việc khởi tạo đối tượng, và đồ thị lời gọi rất khó phác họa nếu không có công cụ. Trong Wirecraft, liên kết là một yếu tố thiết kế riêng, nên kiến trúc luôn hiện rõ như vật liệu di chuyển giữa các trạm làm việc.\n\n1. Thiết kế. Đặt bộ xử lý, kiểu và liên kết lên khung vẽ và nhóm chúng thành các khối tổng hợp. Mỗi bộ xử lý là một thành phần chức năng và mỗi liên kết là một kênh dữ liệu có kiểu. Hướng đối tượng vẫn được giữ: các kiểu tạo thành phân cấp và phụ thuộc tường minh, còn thư viện cho các thành phần sử dụng chúng mượn những bộ phương thức.\n2. Lập trình. Viết thuật toán của từng thành phần trong trình soạn thảo riêng, bên dưới tiêu đề hàm mà trình tạo mã sẽ sinh ra, để bạn thấy đầu vào, đầu ra và thư viện mà nó nhận. Khi cài clang, clangd hoặc rust-analyzer, bạn có gợi ý hoàn thành, thông tin khi di chuột, đi tới định nghĩa, tìm tham chiếu và chẩn đoán của trình biên dịch trên chính các dòng bạn viết.\n3. Tạo mã. Wirecraft lắp ráp các thành phần và liên kết của chúng thành một chương trình hoàn chỉnh bằng C17, Rust, Go, Kotlin, JavaScript (Node.js) hoặc PHP.\n\nLiên kết là tùy chọn. Khi không có liên kết, khối tổng hợp đóng vai trò thư mục và các thực thể lá đóng vai trò tệp, và mỗi thực thể giữ mã của mình cùng đặc tả và dữ liệu kiểm thử, nên mối liên hệ giữa chúng là tường minh thay vì ngầm hiểu.\n\nTái sử dụng các phần của thiết kế thành thành phần có cổng định kiểu, bắt đầu từ các nguyên mẫu và phân tích luồng dữ liệu, lỗi và phụ thuộc. Wirecraft còn có quản lý dự án (bảng Kanban, backlog, lịch sử sửa đổi), xuất bản vẽ sang PDF, SVG, PNG và Mermaid để in, và một máy chủ MCP cục bộ tùy chọn cho các tác tử AI.\n\nWirecraft mở được dự án .orch của Threadworks. Không cần tài khoản và hoạt động ngoại
