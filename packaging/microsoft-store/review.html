<script id="data" type="application/json">{"af": {"language": "Afrikaans", "description": "Ontwerp sagteware as 'n datavloeigrafiek en genereer die program daaruit.\n\nWirecraft is 'n gratis oopbron-ontwerper vir gebeurtenisgedrewe en datavloeisagteware. Plaas verwerkers, datatipes en getipeerde skakels op 'n doek, groepeer hulle in samestellings en laat 45-grade-roetering groot topologieë leesbaar hou. Elke skakel is 'n getipeerde buffer, elke verwerker 'n funksie, en diensbiblioteke word uitgeleen aan die verwerkers wat hulle gebruik.\n\nUit dieselfde ontwerp genereer Wirecraft volledige programme in C17, Rust, Go, Kotlin, JavaScript (Node.js) en PHP. Skryf elke verwerker se liggaam in 'n redigeerder wat die gegenereerde funksieopskrif bo jou kode vaspen, sodat jy altyd die parameters sien wat die generator sal deurgee. Met clang, clangd of rust-analyzer geïnstalleer kry jy kodevoltooiing, dokumentasie wanneer jy daaroor beweeg, semantiese kleure, gaan na definisie, soek verwysings en samestellerdiagnose wat teruggekoppel word na die entiteit en reël wat jy geskryf het.\n\nPubliseer dele van 'n ontwerp as herbruikbare komponente met getipeerde poorte en verwys daarna vanuit ander ontwerpe, vasgepen met 'n inhoudshash sodat bywerkings doelbewus is. Begin nuwe werk uit 'n biblioteek van argetipes en ondersoek 'n ontwerp met netwerkontleding van sy data-, fout- en afhanklikheidsvloei.\n\nRondom die ontwerp kry jy ook projekbestuur ('n Kanban-bord en agterstandslys met status, verantwoordelikheid en hersieningsgeskiedenis), uitvoer van planne en dokumentasie na PDF, SVG, PNG en Mermaid om te druk en te deel, en 'n opsionele plaaslike MCP-bediener waardeur versoenbare KI-agente die ontwerp met gedokumenteerde gereedskap kan lees en wysig.\n\nWirecraft maak Threadworks .orch-projekte oop en bewaar hul data. Geen rekening is nodig nie en ontwerpwerk werk vanlyn. Die toepassing se koppelvlak is in Engels. Wirecraft word aktief ontwikkel.", "shortDescription": "Ontwerp dat gađajima i toku podataka. Postavite procesore, tipove podataka i tipizirane veze na platno, grupirajte ih u kompozite i pustite da usmjeravanje pod uglom od 45 stepeni održi čitljivost i velikih topologija. Svaka veza je tipizirani bafer, svaki procesor funkcija, a biblioteke usluga se posuđuju procesorima koji ih koriste.\n\nIz istog dizajna Wirecraft generira kompletne programe u jezicima C17, Rust, Go, Kotlin, JavaScript (Node.js) i PHP. Tijelo svakog procesora pišete u uređivaču koji iznad vašeg koda prikačuje generirano zaglavlje funkcije, pa uvijek vidite parametre koje će generator proslijediti. Uz instalirani clang, clangd ili rust-analyzer dobijate dovršavanje koda, dokumentaciju pri prelasku mišem, semantičke boje, odlazak na definiciju, pretragu referenci i dijagnostiku kompajlera povezanu s entitetom i redom koji ste napisali.\n\nObjavite dijelove dizajna kao komponente za višekratnu upotrebu s tipiziranim portovima i referencirajte ih iz drugih dizajna, prikačene hešom sadržaja kako bi ažuriranja bila namjerna. Započnite novi rad iz biblioteke arhetipova i ispitajte dizajn mrežnom analizom njegovih tokova podataka, grešaka i zavisnosti.\n\nOko dizajna dobijate i upravljanje projektom (Kanban ploča i backlog sa statusom, odgovornošću i historijom revizija), izvoz planova i dokumentacije u PDF, SVG, PNG i Mermaid za štampanje i dijeljenje, te opcionalni lokalni MCP server preko kojeg kompatibilni AI agenti mogu čitati i uređivati dizajn dokumentiranim alatima.\n\nWirecraft otvara Threadworks .orch projekte i čuva njihove podatke. Račun nije potreban, a dizajniranje radi bez mreže. Interfejs aplikacije je na engleskom jeziku. Wirecraft se aktivno razvija.", "shortDescription": "Vizuelno dizajnirajte softver s tokom podataka i generirajte programe u C17, Rust, Go, Kotlin, JavaScript ili PHP. Uređujte tijela procesora uz pomoć jezičkih servera, ponovo koristite komponente, izvozite planove i povežite AI agente preko lokalnog MCP servera.", "features": ["Vizuelni dizajner toka podataka s procesorima, tipovima, tipiziranim vezama i kompozitima", "Čitljivo usmjeravanje veza pod uglom od 45 stepeni za velike topologije", "Generirajte C17, Rust, Go, Kotlin, JavaScript i PHP programe iz jednog dizajna", "Uređivač tijela s generiranim zaglavljem funkcije prikačenim iznad koda", "Dovršavanje, savjeti, semantičke boje i dijagnostika uz clangd ili rust-analyzer", "Odlazak na definiciju i pretraga referenci kroz tijela procesora", "Komponente za višekratnu upotrebu s tipiziranim portovima, prikačene hešom sadržaja", "Biblioteka arhetipova i mrežna analiza tokova podataka, grešaka i zavisnosti", "Kanban ploča, backlog, odgovornost i historija revizija", "Izvoz planova u PDF, SVG, PNG i Mermaid te lokalni MCP server za AI agente"], "searchTerms": ["tok podataka", "dizajn softvera", "generiranje koda", "C17", "Rust", "MCP server", "arhitektura"], "captions": ["Dizajnirajte web server kao graf procesora, tipova i tipiziranih veza.", "Grupirajte procesore u kompozite; usmjerene veze prikazuju svaki tipizirani bafer.", "Objavite dizajn kao komponentu s tipiziranim ulaznim i izlaznim portovima.", "Referencirajte komponentu iz drugog dizajna; njeni portovi se spajaju s vašim vezama.", "Uređujte tijelo procesora ispod prikačenog, generiranog zaglavlja C17 funkcije.", "Dovršavajte članove posuđene biblioteke dok kucate, uz clangd.", "Čitajte dokumentaciju pri prelasku mišem u Rust tijelima uz instalirani rust-analyzer.", "Pregledajte planove sa zaglavljem crteža i izvezite ih u PDF, SVG, PNG ili Mermaid.", "Pratite entitete na Kanban ploči sa statusom, odgovornošću i izvršiocima.", "Pustite AI agente da rade preko lokalnog MCP servera i njegovog dnevnika pristupa."], "minimumHardware": ["Grafički drajveri s podrškom za DirectX 11", "Tastatura i miš"], "recommendedHardware": ["Instaliran clang, clangd ili rust-analyzer za provjeru koda", "Miš s tri tipke za pomjeranje platna"]}, "bg": {"language": "Български", "description": "Проектирайте софтуер като граф на потока от данни и генерирайте програмата от него.\n\nWirecraft е безплатен дизайнер с отворен код за софтуер, управляван от събития и поток от данни. Поставяйте процесори, типове данни и типизирани връзки върху платно, групирайте ги в композити и оставете маршрутизирането под 45 градуса да поддържа големите топологии четими. Всяка връзка е типизиран буфер, всеки процесор е функция, а библиотеките с услуги се предоставят на процесорите, които ги използват.\n\nОт същия проект Wirecraft генерира пълни програми на C17, Rust, Go, Kotlin, JavaScript (Node.js) и PHP. Пишете тялото на всеки процесор в редактор, който закача генерирания заглавен ред на функцията над вашия код, така че винаги виждате параметрите, които генераторът подава. С инсталирани clang, clangd или rust-analyzer получавате автоматично довършване, документация при посочване, семантични цветове, преход към дефиниция, търсене на препратки и диагностика от компилатора, свързана с обекта и реда, които сте написали.\n\nПубликувайте части от проект като компоненти за многократна употреба с типизирани портове и ги използвайте в други проекти, фиксирани чрез хеш на съдържанието, за да са обновяванията съзнателни. Започвайте нова работа от библиотека с архетипи и изследвайте проекта чрез мрежов анализ на потоците от данни, грешки и зависимости.\n\nОколо проекта получавате и управление на проекти (Kanban табло и беклог със статус, отговорност и история на ревизиите), експорт на планове и документация в PDF, SVG, PNG и Mermaid за печат и споделяне, както и незадължителен локален MCP сървър, чрез който съвместими ИИ агенти могат да четат и редактират проекта с документирани инструменти.\n\nWirecraft отваря проекти .orch на Threadworks и запазва данните им. Не е нужен акаунт, а проектирането работи офлайн. Интерфейсът на приложението е на английски език. Wirecraft е в процес на активна разработка.", "shortDescription": "Проектирайте визуално софтуер с поток от данни и генерирайте програми на C17, Rust, Go, Kotlin, JavaScript или PHP. Редактирайте телата на процесорите с помощта на езикови сървъри, използвайте повторно компоненти, експортирайте планове и свързвайте ИИ агенти чрез локален MCP сървър.", "features": ["Визуален дизайнер на потоци от данни с процесори, типове, типизирани връзки и композити", "Четимо маршрутизиране на връзките под 45 градуса за големи топологии", "Генериране на програми на C17, Rust, Go, Kotlin, JavaScript и PHP от един проект", "Редактор на тела с генерирания заглавен ред на функцията, закачен над кода", "Довършване, подсказки, семантични цветове и диагностика с clangd или rust-analyzer", "Преход към дефиниция и търсене на препратки в телата на процесорите", "Компоненти за многократна употреба с типизирани портове, фиксирани с хеш", "Библиотека с архетипи и мрежов анализ на потоците от данни, грешки и зависимости", "Kanban табло, беклог, отговорност и история на ревизиите", "Експорт на планове в PDF, SVG, PNG и Mermaid и локален MCP сървър за ИИ агенти"], "searchTerms": ["поток от данни", "софтуерен дизайн", "генериране на код", "C17", "Rust", "MCP сървър", "архитектура"], "captions": ["Проектирайте уеб сървър като граф от процесори, типове и типизирани връзки.", "Групирайте процесори в композити; маршрутизираните връзки показват всеки буфер.", "Публикувайте проект като компонент с типизирани входни и изходни портове.", "Използвайте компонент в друг проект; портовете му се свързват с вашите връзки.", "Редактирайте тялото на процесор под закачения генериран заглавен ред на C17 функцията.", "Довършвайте членовете на предоставена библиотека, докато пишете, с clangd.", "Четете документация при посочване в Rust тела с инсталиран rust-analyzer.", "Преглеждайте планове с щампа и ги експортирайте в PDF, SVG, PNG или Mermaid.", "Следете обектите на Kanban табло със статус, отговорност и изпълнители.", "Оставете ИИ агенти да работят чрез локалния MCP сървър и неговия журнал за достъп."], "minimumHardware": ["Графични драйвери с поддръжка на DirectX 11", "Клавиатура и мишка"], "recommendedHardware": ["Инсталиран clang, clangd или rust-analyzer за проверка на кода", "Мишка с три бутона за местене на платното"]}, "zh": {"language": "中文（简体）", "description": "将软件设计为数据流图，再从中生成程序。\n\nWirecraft 是一款免费、开源的设计工具，适用于事件驱动和数据流软件。在画布上放置处理器、数据类型和类型化连接，把它们组合成复合节点，并让 45 度布线保持大型拓扑的清晰可读。每条连接都是一个类型化缓冲区，每个处理器都是一个函数，服务库会借给使用它们的处理器。\n\nWirecraft 可以从同一份设计生成完整的 C17、Rust、Go、Kotlin、JavaScript (Node.js) 和 PHP 程序。在编辑器中编写每个处理器的主体，编辑器会把生成的函数头固定在代码上方，让你始终看到生成器将传入的参数。安装 clang、clangd 或 rust-analyzer 后，你可以获得代码补全、悬停文档、语义着色、转到定义、查找引用，以及映射回你所编写的实体和行的编译器诊断。\n\n将设计的一部分发布为带类型化端口的可重用组件，并在其他设计中引用它们；引用通过内容哈希固定，使更新成为有意识的操作。从原型库开始新的工作，并通过对数据流、错误流和依赖流的网络分析来检查设计。\n\n围绕设计，你还可以使用项目管理（带状态、负责人和修订历史的看板与待办列表），将图纸和文档导出为 PDF、SVG、PNG 和 Mermaid 以便打印和分享，以及一个可选的本地 MCP 服务器，让兼容的 AI 代理通过文档化的工具读取和编辑设计。\n\nWirecraft 可以打开 Threadworks 的 .orch 项目并保留其数据。无需帐户，设计功能可离线使用。应用界面为英文。Wirecraft 正在积极开发中。", "shortDescription": "以可视化方式设计数据流软件，并从中生成 C17、Rust、Go、Kotlin、JavaScript 或 PHP 程序。借助语言服务器编辑处理器主体，重用组件，导出图纸，并通过本地 MCP 服务器连接 AI 代理。", "features": ["包含处理器、类型、类型化连接和复合节点的可视化数据流设计器", "适用于大型拓扑的清晰 45 度连接布线", "从一份设计生成 C17、Rust、Go、Kotlin、JavaScript 和 PHP 程序", "主体编辑器，生成的函数头固定在代码上方", "借助 clangd 或 rust-analyzer 提供补全、悬停、语义着色和诊断", "在处理器主体之间转到定义和查找引用", "带类型化端口、以内容哈希固定的可重用组件", "原型库，以及对数据流、错误流和依赖流的网络分析", "看板、待办列表、负责人和修订历史", "将图纸导出为 PDF、SVG、PNG 和 Mermaid，并为 AI 代理提供本地 MCP 服务器"], "searchTerms": ["数据流", "软件设计", "代码生成", "C17", "Rust", "MCP 服务器", "软件架构"], "captions": ["将 Web 服务器设计为由处理器、类型和类型化连接组成的数据流图。", "把处理器组合成复合节点；布线后的连接显示每个类型化缓冲区。", "将设计发布为带类型化输入和输出端口的可重用组件。", "在另一份设计中引用组件；它的端口会接入你的连接。", "在固定显示的、生成的 C17 函数头下编辑处理器主体。", "输入时借助 clangd 补全所借用库的成员。", "安装 rust-analyzer 后，在 Rust 主体中阅读悬停文档。", "预览带标题栏的图纸，并导出为 PDF、SVG、PNG 或 Mermaid。", "在看板上跟踪实体的状态、负责人和执行人。", "让 AI 代理通过本地 MCP 服务器及其访问日志处理设计。"], "minimumHardware": ["支持 DirectX 11 的图形驱动程序", "键盘和鼠标"], "recommendedHardware": ["安装 clang、clangd 或 rust-analyzer 以进行代码检查", "用于平移画布的三键鼠标"]}, "cs": {"language": "Čeština", "description": "Navrhujte software jako graf datového toku a generujte z něj program.\n\nWirecraft je bezplatný návrhář s otevřeným zdrojovým kódem pro software řízený událostmi a datovým tokem. Umísťujte procesory, datové typy a typovaná propojení na plátno, seskupujte je do kompozitů a nechte směrování pod úhlem 45 stupňů udržet čitelnost i velkých topologií. Každé propojení je typovaná vyrovnávací paměť, každý procesor funkce a knihovny služeb se půjčují procesorům, které je používají.\n\nZe stejného návrhu Wirecraft generuje úplné programy v jazycích C17, Rust, Go, Kotlin, JavaScript (Node.js) a PHP. Tělo každého procesoru pište v editoru, který nad váš kód připíná vygenerovanou hlavičku funkce, takže vždy vidíte parametry, které generátor předá. S nainstalovaným clang, clangd nebo rust-analyzer získáte doplňování kódu, dokumentaci při najetí myší, sémantické barvy, přechod na definici, hledání odkazů a diagnostiku kompilátoru přiřazenou k entitě a řádku, který jste napsali.\n\nPublikujte části návrhu jako opakovaně použitelné komponenty s typovanými porty a odkazujte na ně z jiných návrhů, připnuté hashem obsahu, aby aktualizace probíhaly vědomě. Začněte novou práci z knihovny archetypů a zkoumejte návrh síťovou analýzou jeho datových, chybových a závislostních toků.\n\nKolem návrhu máte také řízení projektu (tabule Kanban a backlog se stavem, odpovědností a historií revizí), export plánů a dokumentace do PDF, SVG, PNG a Mermaid pro tisk a sdílení a volitelný místní server MCP, přes který mohou kompatibilní agenti AI číst a upravovat návrh pomocí zdokumentovaných nástrojů.\n\nWirecraft otevírá projekty .orch z Threadworks a zachovává jejich data. Účet není potřeba a navrhování funguje offline. Rozhraní aplikace je v angličtině. Wirecraft se aktivně vyvíjí.", "shortDescription": "Navrhujte vizuálně software s datovým tokem a generujte z něj programy v C17, Rust, Go, Kotlin, JavaScript nebo PHP. Upravujte těla procesorů s pomocí jazykových serverů, používejte komponenty opakovaně, exportujte plány a připojte agenty AI přes místní server MCP.", "features": ["Vizuální návrhář datového toku s procesory, typy, typovanými propojeními a kompozity", "Čitelné směrování propojení pod úhlem 45 stupňů pro velké topologie", "Generování programů C17, Rust, Go, Kotlin, JavaScript a PHP z jednoho návrhu", "Editor těl s vygenerovanou hlavičkou funkce připnutou nad kódem", "Doplňování, nápověda při najetí, sémantické barvy a diagnostika s clangd nebo rust-analyzer", "Přechod na definici a hledání odkazů napříč těly procesorů", "Opakovaně použitelné komponenty s typovanými porty, připnuté hashem obsahu", "Knihovna archetypů a síťová analýza datových, chybových a závislostních toků", "Tabule Kanban, backlog, odpovědnost a historie revizí", "Export plánů do PDF, SVG, PNG a Mermaid a místní server MCP pro agenty AI"], "searchTerms": ["datový tok", "návrh softwaru", "generování kódu", "C17", "Rust", "server MCP", "architektura"], "captions": ["Navrhněte webový server jako graf procesorů, typů a typovaných propojení.", "Seskupte procesory do kompozitů; směrovaná propojení ukazují každou vyrovnávací paměť.", "Publikujte návrh jako komponentu s typovanými vstupními a výstupními porty.", "Odkažte na komponentu z jiného návrhu; její porty se napojí na vaše propojení.", "Upravujte tělo procesoru pod jeho připnutou, vygenerovanou hlavičkou funkce C17.", "Doplňujte členy zapůjčené knihovny při psaní díky clangd.", "Čtěte dokumentaci při najetí myší v tělech Rust s nainstalovaným rust-analyzer.", "Prohlížejte plány s rohovým razítkem a exportujte je do PDF, SVG, PNG nebo Mermaid.", "Sledujte entity na tabuli Kanban se stavem, odpovědností a řešiteli.", "Nechte agenty AI pracovat přes místní server MCP a jeho protokol přístupů."], "minimumHardware": ["Grafické ovladače s podporou DirectX 11", "Klávesnice a myš"], "recommendedHardware": ["Nainstalovaný clang, clangd nebo rust-analyzer pro kontrolu kódu", "Myš se třemi tlačítky pro posouvání plátna"]}, "da": {"language": "Dansk", "description": "Design software som en dataflowgraf, og generér programmet ud fra den.\n\nWirecraft er en gratis open source-designer til hændelsesdrevet software og dataflowsoftware. Placér processorer, datatyper og typede forbindelser på et lærred, saml dem i kompositter, og lad 45-graders ruteføring holde store topologier læsbare. Hver forbindelse er en typet buffer, hver processor en funktion, og servicebiblioteker udlånes til de processorer, der bruger dem.\n\nUd fra det samme design genererer Wirecraft komplette programmer i C17, Rust, Go, Kotlin, JavaScript (Node.js) og PHP. Skriv hver processors krop i en editor, der fastgør den genererede funktionsheader over din kode, så du altid ser de parametre, generatoren sender med. Med clang, clangd eller rust-analyzer installeret får du autofuldførelse, dokumentation ved hover, semantiske farver, gå til definition, find referencer og compilerdiagnoser knyttet til den enhed og linje, du skrev.\n\nUdgiv dele af et design som genbrugelige komponenter med typede porte, og henvis til dem fra andre designs, fastlåst med en indholdshash, så opdateringer sker bevidst. Start nyt arbejde fra et bibliotek af arketyper, og undersøg et design med netværksanalyse af dets data-, fejl- og afhængighedsstrømme.\n\nOmkring designet får du også projektstyring (Kanban-tavle og backlog med status, ansvar og revisionshistorik), eksport af tegninger og dokumentation til PDF, SVG, PNG og Mermaid til udskrivning og deling samt en valgfri lokal MCP-server, så kompatible AI-agenter kan læse og redigere designet via dokumenterede værktøjer.\n\nWirecraft åbner Threadworks .orch-projekter og bevarer deres data. Der kræves ingen konto, og design fungerer offline. Programmets brugerflade er på engelsk. Wirecraft er under aktiv udvikling.", "shortDescription": "Design dataflowsoftware visuelt, og generér programmer i C17, Rust, Go, Kotlin, JavaScript eller PHP ud fra det. Redigér processorkroppe med hjælp fra sprogservere, genbrug komponenter, eksportér tegninger og forbind AI-agenter via en lokal MCP-server.", "features": ["Visuel dataflowdesigner med processorer, typer, typede forbindelser og kompositter", "Læsbar 45-graders ruteføring af forbindelser i store topologier", "Generér C17-, Rust-, Go-, Kotlin-, JavaScript- og PHP-programmer ud fra ét design", "Kropseditor med den genererede funktionsheader fastgjort over koden", "Autofuldførelse, hover, semantiske farver og diagnoser med clangd eller rust-analyzer", "Gå til definition og find referencer på tværs af processorkroppe", "Genbrugelige komponenter med typede porte, fastlåst med indholdshash", "Arketypebibliotek og netværksanalyse af data-, fejl- og afhængighedsstrømme", "Kanban-tavle, backlog, ansvar og revisionshistorik", "Eksport af tegninger til PDF, SVG, PNG og Mermaid samt lokal MCP-server til AI-agenter"], "searchTerms": ["dataflow", "softwaredesign", "kodegenerering", "C17", "Rust", "MCP-server", "arkitektur"], "captions": ["Design en webserver som en dataflowgraf af processorer, typer og typede forbindelser.", "Saml processorer i kompositter; rutede forbindelser viser hver typet buffer.", "Udgiv et design som en genbrugelig komponent med typede ind- og udgangsporte.", "Henvis til en komponent fra et andet design; dens porte forbindes med dine forbindelser.", "Redigér en processorkrop under dens fastgjorte, genererede C17-funktionsheader.", "Fuldfør medlemmerne af et udlånt bibliotek, mens du skriver, med clangd.", "Læs hover-dokumentation i Rust-kroppe, når rust-analyzer er installeret.", "Se tegninger med titelfelt, og eksportér dem til PDF, SVG, PNG eller Mermaid.", "Følg enheder på en Kanban-tavle med status, ansvar og tildelte.", "Lad AI-agenter arbejde via den lokale MCP-server og dens adgangslog."], "minimumHardware": ["Grafikdrivere med understøttelse af DirectX 11", "Tastatur og mus"], "recommendedHardware": ["clang, clangd eller rust-analyzer installeret til kodekontrol", "En mus med tre knapper til at panorere lærredet"]}, "nl": {"language": "Nederlands", "description": "Ontwerp software als een dataflowgraaf en genereer het programma daaruit.\n\nWirecraft is een gratis opensource-ontwerper voor gebeurtenisgestuurde en dataflowsoftware. Plaats processors, datatypen en getypeerde koppelingen op een canvas, groepeer ze in composieten en laat routering onder 45 graden grote topologieën leesbaar houden. Elke koppeling is een getypeerde buffer, elke processor een functie, en servicebibliotheken worden uitgeleend aan de processors die ze gebruiken.\n\nUit hetzelfde ontwerp genereert Wirecraft complete programma's in C17, Rust, Go, Kotlin, JavaScript (Node.js) en PHP. Schrijf de body van elke processor in een editor die de gegenereerde functiekop boven je code vastzet, zodat je altijd de parameters ziet die de generator doorgeeft. Met clang, clangd of rust-analyzer geïnstalleerd krijg je aanvulling, documentatie bij aanwijzen, semantische kleuren, ga naar definitie, verwijzingen zoeken en compilerdiagnoses die verwijzen naar de entiteit en regel die je schreef.\n\nPubliceer delen van een ontwerp als herbruikbare componenten met getypeerde poorten en verwijs ernaar vanuit andere ontwerpen, vastgezet met een inhoudshash zodat updates bewust gebeuren. Begin nieuw werk vanuit een bibliotheek met archetypen en onderzoek een ontwerp met netwerkanalyse van zijn data-, fout- en afhankelijkheidsstromen.\n\nRond het ontwerp krijg je ook projectbeheer (Kanban-bord en backlog met status, verantwoordelijkheid en revisiegeschiedenis), export van plannen en documentatie naar PDF, SVG, PNG en Mermaid om af te drukken en te delen, en een optionele lokale MCP-server waarmee compatibele AI-agents het ontwerp kunnen lezen en bewerken via gedocumenteerde tools.\n\nWirecraft opent Threadworks .orch-projecten en bewaart hun gegevens. Er is geen account nodig en ontwerpen werkt offline. De interface van de app is in het Engels. Wirecraft wordt actief ontwikkeld.", "shortDescription": "Ontwerp dataflowsoftware visueel en genereer er programma's in C17, Rust, Go, Kotlin, JavaScript of PHP uit. Bewerk processorbodies met hulp van taalservers, hergebruik componenten, exporteer plannen en verbind AI-agents via een lokale MCP-server.", "features": ["Visuele dataflowontwerper met processors, typen, getypeerde koppelingen en composieten", "Leesbare koppelingsroutering onder 45 graden voor grote topologieën", "Genereer C17-, Rust-, Go-, Kotlin-, JavaScript- en PHP-programma's uit één ontwerp", "Body-editor met de gegenereerde functiekop vastgezet boven je code", "Aanvulling, hover, semantische kleuren en diagnoses met clangd of rust-analyzer", "Ga naar definitie en zoek verwijzingen over processorbodies heen", "Herbruikbare componenten met getypeerde poorten, vastgezet met een inhoudshash", "Archetypenbibliotheek en netwerkanalyse van data-, fout- en afhankelijkheidsstromen", "Kanban-bord, backlog, verantwoordelijkheid en revisiegeschiedenis", "Planexport naar PDF, SVG, PNG en Mermaid en een lokale MCP-server voor AI-agents"], "searchTerms": ["dataflow", "softwareontwerp", "codegeneratie", "C17", "Rust", "MCP-server", "architectuur"], "captions": ["Ontwerp een webserver als dataflowgraaf van processors, typen en getypeerde koppelingen.", "Groepeer processors in composieten; gerouteerde koppelingen tonen elke getypeerde buffer.", "Publiceer een ontwerp als herbruikbare component met getypeerde in- en uitvoerpoorten.", "Verwijs naar een component vanuit een ander ontwerp; de poorten sluiten aan op je koppelingen.", "Bewerk een processorbody onder de vastgezette, gegenereerde C17-functiekop.", "Vul tijdens het typen de leden van een uitgeleende bibliotheek aan met clangd.", "Lees hoverdocumentatie in Rust-bodies wanneer rust-analyzer is geïnstalleerd.", "Bekijk plannen met titelblok en exporteer ze naar PDF, SVG, PNG of Mermaid.", "Volg entiteiten op een Kanban-bord met status, verantwoordelijkheid en toegewezenen.", "Laat AI-agents werken via de lokale MCP-server en zijn toegangslogboek."], "minimumHardware": ["Grafische stuurprogramma's met DirectX 11-ondersteuning", "Toetsenbord en muis"], "recommendedHardware": ["clang, clangd of rust-analyzer geïnstalleerd voor codecontroles", "Een muis met drie knoppen om het canvas te verschuiven"]}, "en": {"language": "English", "description": "Design software as a dataflow graph, then generate the program from it.\n\nWirecraft is a free, open-source designer for event-driven and dataflow software. Place processors, data types and typed links on a canvas, group them into composites, and let 45-degree routing keep large topologies readable. Every link is a typed buffer, every processor a function, and service libraries are lent to the processors that use them.\n\nFrom the same design Wirecraft generates complete programs in C17, Rust, Go, Kotlin, JavaScript (Node.js) and PHP. Write each processor's body in an editor that pins the generated function header above your code, so you always see the parameters the generator will pass. With clang, clangd or rust-analyzer installed, you get completion, hover documentation, semantic colors, go-to-definition, find references and compiler diagnostics mapped back to the entity and line you wrote.\n\nPublish parts of a design as reusable components with typed ports, and reference them from other designs, pinned by content hash so updates are deliberate. Start new work from a library of archetypes, and inspect a design with network analysis of its data, error and dependency flows.\n\nAround the design you also get project management (a Kanban board and backlog with status, responsibility and revision history), plan and documentation export to PDF, SVG, PNG and Mermaid for printing and sharing, and an optional local MCP server so compatible AI agents can read and edit the design through documented tools.\n\nWirecraft opens Threadworks .orch projects and preserves their data. No account is required and core design works offline. The application interface is in English. Wirecraft is under active development.", "shortDescription": "Design dataflow software visually and generate C17, Rust, Go, Kotlin, JavaScript or PHP programs from it. Edit processor bodies with language-server help, reuse components, export plans and connect AI agents through a local MCP server.", "features": ["Visual dataflow designer with processors, types, typed links and composites", "Readable 45-degree link routing for large topologies", "Generate C17, Rust, Go, Kotlin, JavaScript and PHP programs from one design", "Body editor with the generated function header pinned above your code", "Completion, hover, semantic colors and diagnostics with clangd or rust-analyzer", "Go-to-definition and find references across processor bodies", "Reusable components with typed ports, pinned by content hash", "Archetype library and network analysis of data, error and dependency flows", "Kanban board, backlog, responsibility and revision history", "Plan export to PDF, SVG, PNG and Mermaid, and a local MCP server for AI agents"], "searchTerms": ["dataflow", "software design", "code generation", "C17", "Rust", "MCP server", "architecture"], "captions": ["Design a web server as a dataflow graph of processors, types and typed links.", "Group processors into composites; routed links show every typed buffer.", "Publish a design as a reusable component with typed input and output ports.", "Reference a component from another design; its ports join your links.", "Edit a processor body under its pinned, generated C17 function header.", "Complete the members of a lent library while you type, powered by clangd.", "Read hover documentation in Rust bodies, with rust-analyzer installed.", "Preview plans with a title block and export them to PDF, SVG, PNG or Mermaid.", "Track entities on a Kanban board with status, responsibility and assignees.", "Let AI agents work on the design through the local MCP server and its access log."], "minimumHardware": ["Graphics drivers supporting DirectX 11", "Keyboard and mouse"], "recommendedHardware": ["clang, clangd or rust-analyzer installed for code checks", "A three-button mouse for canvas panning"]}, "et": {"language": "Eesti", "description": "Kujundage tarkvara andmevoo graafina ja looge sellest programm.\n\nWirecraft on tasuta avatud lähtekoodiga kujundaja sündmuspõhise ja andmevoopõhise tarkvara jaoks. Paigutage lõuendile protsessorid, andmetüübid ja tüübitud ühendused, rühmitage need liitüksusteks ning laske 45-kraadisel marsruutimisel hoida ka suured topoloogiad loetavana. Iga ühendus on tüübitud puhver, iga protsessor funktsioon ning teenusteekid laenatakse neid kasutavatele protsessoritele.\n\nSamast kujundusest loob Wirecraft terviklikud programmid keeltes C17, Rust, Go, Kotlin, JavaScript (Node.js) ja PHP. Kirjutage iga protsessori keha redaktoris, mis kinnitab loodud funktsiooni päise teie koodi kohale, nii et näete alati parameetreid, mille generaator edastab. Kui clang, clangd või rust-analyzer on paigaldatud, saate koodi lõpetamise, dokumentatsiooni kursori all, semantilised värvid, definitsioonile liikumise, viidete otsingu ja kompilaatori diagnostika, mis seotakse teie kirjutatud olemi ja reaga.\n\nAvaldage kujunduse osi korduvkasutatavate tüübitud portidega komponentidena ja viidake neile teistest kujundustest, sisuräsiga lukustatult, et uuendused oleksid teadlikud. Alustage uut tööd arhetüüpide teegist ja uurige kujundust selle andme-, vea- ja sõltuvusvoogude võrguanalüüsiga.\n\nKujunduse ümber saate ka projektijuhtimise (Kanbani tahvel ja ootejärjekord oleku, vastutuse ja redaktsiooniajalooga), plaanide ja dokumentatsiooni ekspordi PDF-, SVG-, PNG- ja Mermaid-vormingusse printimiseks ja jagamiseks ning valikulise kohaliku MCP-serveri, mille kaudu ühilduvad tehisintellekti agendid saavad dokumenteeritud tööriistadega kujundust lugeda ja muuta.\n\nWirecraft avab Threadworksi .orch-projekte ja säilitab nende andmed. Kontot pole vaja ning kujundamine töötab võrguühenduseta. Rakenduse liides on inglise keeles. Wirecrafti arendatakse aktiivselt.", "shortDescription": "Kujundage andmevootarkvara visuaalselt ja looge sellest programme keeltes C17, Rust, Go, Kotlin, JavaScript või PHP. Muutke protsessorite kehasid keeleserverite abiga, taaskasutage komponente, eksportige plaane ja ühendage tehisintellekti agente kohaliku MCP-serveri kaudu.", "features": ["Visuaalne andmevoo kujundaja protsessorite, tüüpide, tüübitud ühenduste ja liitüksustega", "Loetav 45-kraadine ühenduste marsruutimine suurtes topoloogiates", "Looge ühest kujundusest C17-, Rust-, Go-, Kotlin-, JavaScript- ja PHP-programme", "Keharedaktor, kus loodud funktsiooni päis on koodi kohale kinnitatud", "Lõpetamine, kursorivihjed, semantilised värvid ja diagnostika clangdi või rust-analyzeriga", "Definitsioonile liikumine ja viidete otsing protsessorite kehades", "Korduvkasutatavad komponendid tüübitud portidega, sisuräsiga lukustatud", "Arhetüüpide teek ning andme-, vea- ja sõltuvusvoogude võrguanalüüs", "Kanbani tahvel, ootejärjekord, vastutus ja redaktsiooniajalugu", "Plaanide eksport PDF-, SVG-, PNG- ja Mermaid-vormingusse ning kohalik MCP-server"], "searchTerms": ["andmevoog", "tarkvara disain", "koodi genereerimine", "C17", "Rust", "MCP-server", "arhitektuur"], "captions": ["Kujundage veebiserver andmevoo graafina protsessoritest, tüüpidest ja ühendustest.", "Rühmitage protsessorid liitüksusteks; marsruuditud ühendused näitavad iga puhvrit.", "Avaldage kujundus korduvkasutatava komponendina tüübitud sisend- ja väljundportidega.", "Viidake komponendile teisest kujundusest; selle pordid liituvad teie ühendustega.", "Muutke protsessori keha selle kinnitatud, loodud C17-funktsioonipäise all.", "Lõpetage laenatud teegi liikmed trükkimise ajal clangdi abil.", "Lugege Rusti kehades kursori all dokumentatsiooni, kui rust-analyzer on paigaldatud.", "Vaadake plaane koos nurgatempliga ja eksportige need PDF-, SVG-, PNG- või Mermaid-vormingusse.", "Jälgige olemeid Kanbani tahvlil oleku, vastutuse ja täitjatega.", "Laske tehisintellekti agentidel töötada kohaliku MCP-serveri ja selle pääsulogi kaudu."], "minimumHardware": ["DirectX 11 toega graafikadraiverid", "Klaviatuur ja hiir"], "recommendedHardware": ["Koodikontrolliks paigaldatud clang, clangd või rust-analyzer", "Kolme nupuga hiir lõuendi liigutamiseks"]}, "fil": {"language": "Filipino", "description": "Idisenyo ang software bilang isang dataflow graph, at saka buuin ang programa mula rito.\n\nAng Wirecraft ay isang libre at open-source na designer para sa event-driven at dataflow na software. Maglagay ng mga processor, uri ng data at typed na link sa isang canvas, ipangkat ang mga ito sa mga composite, at hayaang panatilihing nababasa ng 45-degree na routing kahit ang malalaking topology. Ang bawat link ay isang typed na buffer, ang bawat processor ay isang function, at ipinahihiram ang mga service library sa mga processor na gumagamit nito.\n\nMula sa iisang disenyo, bumubuo ang Wirecraft ng kumpletong mga programa sa C17, Rust, Go, Kotlin, JavaScript (Node.js) at PHP. Isulat ang body ng bawat processor sa isang editor na nag-pi-pin ng nabuong function header sa itaas ng iyong code, kaya lagi mong nakikita ang mga parameter na ipapasa ng generator. Kapag naka-install ang clang, clangd o rust-analyzer, makakakuha ka ng code completion, dokumentasyon sa pag-hover, semantic na kulay, go-to-definition, paghahanap ng reference at mga diagnostic ng compiler na nakaugnay sa entity at linyang isinulat mo.\n\nI-publish ang mga bahagi ng disenyo bilang mga reusable na component na may typed na port at i-reference ang mga ito mula sa ibang disenyo, naka-pin sa pamamagitan ng content hash para sinasadya ang mga update. Magsimula ng bagong gawain mula sa isang library ng mga archetype, at suriin ang disenyo gamit ang network analysis ng daloy ng data, error at dependency nito.\n\nBukod sa disenyo, mayroon ka ring project management (Kanban board at backlog na may status, responsibilidad at kasaysayan ng rebisyon), pag-export ng mga plano at dokumentasyon sa PDF, SVG, PNG at Mermaid para sa pag-print at pagbabahagi, at isang opsyonal na lokal na MCP server para mabasa at ma-edit ng mga compatible na AI agent ang disenyo gamit ang mga dokumentadong tool.\n\nBinubuksan ng Wirecraft ang mga .orch project ng Threadworks at pinapanatili ang kanilang data. Hindi kailangan ng account at gumagana offline ang pagdidisenyo. Nasa English ang interface ng app. Aktibong dinedebelop ang Wirecraft.", "shortDescription": "Idisenyo nang biswal ang dataflow na software at bumuo ng mga programa sa C17, Rust, Go, Kotlin, JavaScript o PHP. I-edit ang mga processor body sa tulong ng mga language server, gamitin muli ang mga component, mag-export ng mga plano at ikonekta ang mga AI agent sa lokal na MCP server.", "features": ["Biswal na dataflow designer na may mga processor, uri, typed na link at composite", "Nababasang 45-degree na routing ng link para sa malalaking topology", "Bumuo ng mga programang C17, Rust, Go, Kotlin, JavaScript at PHP mula sa isang disenyo", "Body editor na may nabuong function header na naka-pin sa itaas ng code", "Completion, hover, semantic na kulay at diagnostic gamit ang clangd o rust-analyzer", "Go-to-definition at paghahanap ng reference sa mga processor body", "Reusable na component na may typed na port, naka-pin sa content hash", "Library ng archetype at network analysis ng daloy ng data, error at dependency", "Kanban board, backlog, responsibilidad at kasaysayan ng rebisyon", "Pag-export ng plano sa PDF, SVG, PNG at Mermaid at lokal na MCP server para sa AI agent"], "searchTerms": ["dataflow", "disenyo ng software", "code generation", "C17", "Rust", "MCP server", "arkitektura"], "captions": ["Idisenyo ang isang web server bilang dataflow graph ng mga processor, uri at link.", "Ipangkat ang mga processor sa composite; ipinapakita ng mga link ang bawat buffer.", "I-publish ang disenyo bilang reusable na component na may typed na input at output port.", "I-reference ang component mula sa ibang disenyo; kumokonekta ang mga port nito sa iyong link.", "I-edit ang processor body sa ilalim ng naka-pin na nabuong C17 function header.", "Kumpletuhin ang mga member ng hiniram na library habang nagta-type, gamit ang clangd.", "Basahin ang dokumentasyon sa pag-hover sa mga Rust body kapag may rust-analyzer.", "I-preview ang mga plano na may title block at i-export sa PDF, SVG, PNG o Mermaid.", "Subaybayan ang mga entity sa Kanban board na may status, responsibilidad at assignee.", "Hayaang gumana ang mga AI agent sa lokal na MCP server at sa access log nito."], "minimumHardware": ["Mga graphics driver na sumusuporta sa DirectX 11", "Keyboard at mouse"], "recommendedHardware": ["Naka-install na clang, clangd o rust-analyzer para sa code check", "Mouse na may tatlong button para igalaw ang canvas"]}, "fi": {"language": "Suomi", "description": "Suunnittele ohjelmisto tietovuograafina ja luo ohjelma sen pohjalta.\n\nWirecraft on maksuton avoimen lähdekoodin suunnittelutyökalu tapahtumaohjatulle ja tietovuopohjaiselle ohjelmistolle. Sijoita prosessorit, tietotyypit ja tyypitetyt linkit piirtoalueelle, ryhmittele ne kokonaisuuksiksi ja anna 45 asteen reitityksen pitää suuretkin topologiat luettavina. Jokainen linkki on tyypitetty puskuri, jokainen prosessori funktio, ja palvelukirjastot lainataan niitä käyttäville prosessoreille.\n\nSamasta suunnitelmasta Wirecraft luo valmiit ohjelmat kielillä C17, Rust, Go, Kotlin, JavaScript (Node.js) ja PHP. Kirjoita kunkin prosessorin runko editorissa, joka kiinnittää luodun funktion otsikon koodisi yläpuolelle, joten näet aina parametrit, jotka generaattori välittää. Kun clang, clangd tai rust-analyzer on asennettu, saat koodin täydennyksen, ohjeet osoitettaessa, semanttiset värit, siirtymisen määrittelyyn, viittausten haun ja kääntäjän diagnostiikan, joka kohdistetaan kirjoittamaasi kohteeseen ja riviin.\n\nJulkaise suunnitelman osia uudelleenkäytettävinä komponentteina, joilla on tyypitetyt portit, ja viittaa niihin muista suunnitelmista sisältötiivisteellä lukittuina, jotta päivitykset tehdään tietoisesti. Aloita uusi työ arkkityyppien kirjastosta ja tutki suunnitelmaa sen tieto-, virhe- ja riippuvuusvirtojen verkkoanalyysillä.\n\nSuunnitelman ympärillä saat myös projektinhallinnan (Kanban-taulu ja backlog tilan, vastuun ja versiohistorian kanssa), piirustusten ja dokumentaation viennin PDF-, SVG-, PNG- ja Mermaid-muotoon tulostamista ja jakamista varten sekä valinnaisen paikallisen MCP-palvelimen, jonka kautta yhteensopivat tekoälyagentit voivat lukea ja muokata suunnitelmaa dokumentoiduilla työkaluilla.\n\nWirecraft avaa Threadworksin .orch-projektit ja säilyttää niiden tiedot. Tiliä ei tarvita, ja suunnittelu toimii ilman verkkoyhteyttä. Sovelluksen käyttöliittymä on englanninkielinen. Wirecraftia kehitetään aktiivisesti.", "shortDescription": "Suunnittele tietovuo-ohjelmistoja visuaalisesti ja luo niistä ohjelmia kielillä C17, Rust, Go, Kotlin, JavaScript tai PHP. Muokkaa prosessorien runkoja kielipalvelinten avulla, käytä komponentteja uudelleen, vie piirustuksia ja yhdistä tekoälyagentteja paikallisen MCP-palvelimen kautta.", "features": ["Visuaalinen tietovuosuunnittelija: prosessorit, tyypit, tyypitetyt linkit ja kokonaisuudet", "Luettava 45 asteen linkkien reititys suurissa topologioissa", "Luo C17-, Rust-, Go-, Kotlin-, JavaScript- ja PHP-ohjelmia yhdestä suunnitelmasta", "Runkoeditori, jossa luotu funktion otsikko on kiinnitetty koodin yläpuolelle", "Täydennys, osoitusohjeet, semanttiset värit ja diagnostiikka clangdilla tai rust-analyzerilla", "Siirry määrittelyyn ja hae viittauksia prosessorien rungoista", "Uudelleenkäytettävät komponentit tyypitetyillä porteilla, sisältötiivisteellä lukittuina", "Arkkityyppikirjasto sekä tieto-, virhe- ja riippuvuusvirtojen verkkoanalyysi", "Kanban-taulu, backlog, vastuut ja versiohistoria", "Piirustusten vienti PDF-, SVG-, PNG- ja Mermaid-muotoon sekä paikallinen MCP-palvelin"], "searchTerms": ["tietovuo", "ohjelmistosuunnittelu", "koodin generointi", "C17", "Rust", "MCP-palvelin", "arkkitehtuuri"], "captions": ["Suunnittele verkkopalvelin tietovuograafina prosessoreista, tyypeistä ja linkeistä.", "Ryhmittele prosessorit kokonaisuuksiksi; reititetyt linkit näyttävät jokaisen puskurin.", "Julkaise suunnitelma uudelleenkäytettävänä komponenttina tyypitetyin tulo- ja lähtöportein.", "Viittaa komponenttiin toisesta suunnitelmasta; sen portit liittyvät linkkeihisi.", "Muokkaa prosessorin runkoa sen kiinnitetyn, luodun C17-funktio-otsikon alla.", "Täydennä lainatun kirjaston jäsenet kirjoittaessasi clangdin avulla.", "Lue osoitusohjeet Rust-rungoissa, kun rust-analyzer on asennettu.", "Esikatsele piirustuksia nimiöineen ja vie ne PDF-, SVG-, PNG- tai Mermaid-muotoon.", "Seuraa kohteita Kanban-taululla tilan, vastuiden ja tekijöiden kanssa.", "Anna tekoälyagenttien työskennellä paikallisen MCP-palvelimen ja sen lokin kautta."], "minimumHardware": ["DirectX 11:tä tukevat näytönohjaimen ajurit", "Näppäimistö ja hiiri"], "recommendedHardware": ["clang, clangd tai rust-analyzer asennettuna koodin tarkistuksiin", "Kolmipainikkeinen hiiri piirtoalueen panorointiin"]}, "fr": {"language": "Français", "description": "Concevez un logiciel sous forme de graphe de flux de données, puis générez le programme à partir de celui-ci.\n\nWirecraft est un concepteur gratuit et open source pour les logiciels événementiels et à flux de données. Placez des processeurs, des types de données et des liens typés sur un canevas, regroupez-les en composites et laissez le routage à 45 degrés garder lisibles les grandes topologies. Chaque lien est un tampon typé, chaque processeur une fonction, et les bibliothèques de services sont prêtées aux processeurs qui les utilisent.\n\nÀ partir de la même conception, Wirecraft génère des programmes complets en C17, Rust, Go, Kotlin, JavaScript (Node.js) et PHP. Écrivez le corps de chaque processeur dans un éditeur qui épingle l'en-tête de fonction généré au-dessus de votre code, pour toujours voir les paramètres que le générateur transmettra. Avec clang, clangd ou rust-analyzer installés, vous obtenez la complétion, la documentation au survol, les couleurs sémantiques, l'accès à la définition, la recherche de références et des diagnostics du compilateur rattachés à l'entité et à la ligne que vous avez écrites.\n\nPubliez des parties d'une conception comme composants réutilisables aux ports typés et référencez-les depuis d'autres conceptions, épinglés par empreinte de contenu pour que les mises à jour soient délibérées. Démarrez un nouveau travail à partir d'une bibliothèque d'archétypes et examinez une conception grâce à l'analyse réseau de ses flux de données, d'erreurs et de dépendances.\n\nAutour de la conception, vous disposez aussi de la gestion de projet (tableau Kanban et backlog avec statut, responsabilité et historique des révisions), de l'export des plans et de la documentation en PDF, SVG, PNG et Mermaid pour imprimer et partager, et d'un serveur MCP local optionnel permettant aux agents d'IA compatibles de lire et modifier la conception au moyen d'outils documentés.\n\nWirecraft ouvre les projets Threadworks .orch et préserve leurs données. Aucun compte n'est requis et la conception fonctionne hors ligne. L'interface de l'application est en anglais. Wirecraft est en développement actif.", "shortDescription": "Concevez visuellement un logiciel à flux de données et générez-en des programmes en C17, Rust, Go, Kotlin, JavaScript ou PHP. Modifiez les corps des processeurs avec l'aide de serveurs de langage, réutilisez des composants, exportez des plans et connectez des agents d'IA via un serveur MCP local.", "features": ["Concepteur visuel de flux de données avec processeurs, types, liens typés et composites", "Routage lisible des liens à 45 degrés pour les grandes topologies", "Générer des programmes C17, Rust, Go, Kotlin, JavaScript et PHP à partir d'une conception", "Éditeur de corps avec l'en-tête de fonction généré épinglé au-dessus du code", "Complétion, survol, couleurs sémantiques et diagnostics avec clangd ou rust-analyzer", "Atteindre la définition et rechercher les références dans les corps des processeurs", "Composants réutilisables aux ports typés, épinglés par empreinte de contenu", "Bibliothèque d'archétypes et analyse réseau des flux de données, d'erreurs et de dépendances", "Tableau Kanban, backlog, responsabilité et historique des révisions", "Export des plans en PDF, SVG, PNG et Mermaid, et serveur MCP local pour agents d'IA"], "searchTerms": ["flux de données", "conception logicielle", "génération de code", "C17", "Rust", "serveur MCP", "architecture"], "captions": ["Concevez un serveur web comme graphe de processeurs, de types et de liens typés.", "Regroupez les processeurs en composites ; les liens routés montrent chaque tampon typé.", "Publiez une conception comme composant réutilisable avec ports d'entrée et de sortie typés.", "Référencez un composant depuis une autre conception ; ses ports rejoignent vos liens.", "Modifiez le corps d'un processeur sous son en-tête de fonction C17 généré et épinglé.", "Complétez les membres d'une bibliothèque prêtée pendant la saisie, grâce à clangd.", "Lisez la documentation au survol dans les corps Rust, avec rust-analyzer installé.", "Prévisualisez des plans avec cartouche et exportez-les en PDF, SVG, PNG ou Mermaid.", "Suivez les entités sur un tableau Kanban avec statut, responsabilité et assignés.", "Laissez des agents d'IA travailler via le serveur MCP local et son journal d'accès."], "minimumHardware": ["Pilotes graphiques compatibles DirectX 11", "Clavier et souris"], "recommendedHardware": ["clang, clangd ou rust-analyzer installé pour les vérifications de code", "Une souris à trois boutons pour déplacer le canevas"]}, "de": {"language": "Deutsch", "description": "Entwerfen Sie Software als Datenflussgraph und erzeugen Sie das Programm daraus.\n\nWirecraft ist ein kostenloser Open-Source-Designer für ereignisgesteuerte und datenflussbasierte Software. Platzieren Sie Prozessoren, Datentypen und typisierte Verbindungen auf einer Zeichenfläche, fassen Sie sie zu Kompositen zusammen und lassen Sie das 45-Grad-Routing auch große Topologien lesbar halten. Jede Verbindung ist ein typisierter Puffer, jeder Prozessor eine Funktion, und Dienstbibliotheken werden den Prozessoren bereitgestellt, die sie nutzen.\n\nAus demselben Entwurf erzeugt Wirecraft vollständige Programme in C17, Rust, Go, Kotlin, JavaScript (Node.js) und PHP. Schreiben Sie den Rumpf jedes Prozessors in einem Editor, der den generierten Funktionskopf über Ihrem Code anheftet, sodass Sie immer die Parameter sehen, die der Generator übergibt. Mit installiertem clang, clangd oder rust-analyzer erhalten Sie Vervollständigung, Hover-Dokumentation, semantische Farben, Gehe zu Definition, Verweise suchen und Compilerdiagnosen, die auf die Entität und Zeile zurückgeführt werden, die Sie geschrieben haben.\n\nVeröffentlichen Sie Teile eines Entwurfs als wiederverwendbare Komponenten mit typisierten Ports und referenzieren Sie sie aus anderen Entwürfen, per Inhaltshash fixiert, damit Aktualisierungen bewusst erfolgen. Beginnen Sie neue Arbeit mit einer Bibliothek von Archetypen und untersuchen Sie einen Entwurf mit einer Netzwerkanalyse seiner Daten-, Fehler- und Abhängigkeitsflüsse.\n\nRund um den Entwurf erhalten Sie außerdem Projektmanagement (Kanban-Board und Backlog mit Status, Verantwortung und Revisionsverlauf), den Export von Plänen und Dokumentation als PDF, SVG, PNG und Mermaid zum Drucken und Teilen sowie einen optionalen lokalen MCP-Server, über den kompatible KI-Agenten den Entwurf mit dokumentierten Werkzeugen lesen und bearbeiten können.\n\nWirecraft öffnet Threadworks-.orch-Projekte und bewahrt ihre Daten. Es ist kein Konto erforderlich, und der Entwurf funktioniert offline. Die Benutzeroberfläche ist auf Englisch. Wirecraft wird aktiv weiterentwickelt.", "shortDescription": "Entwerfen Sie Datenflusssoftware visuell und erzeugen Sie daraus Programme in C17, Rust, Go, Kotlin, JavaScript oder PHP. Bearbeiten Sie Prozessorrümpfe mit Sprachserver-Unterstützung, nutzen Sie Komponenten wieder, exportieren Sie Pläne und verbinden Sie KI-Agenten über einen lokalen MCP-Server.", "features": ["Visueller Datenfluss-Designer mit Prozessoren, Typen, typisierten Verbindungen und Kompositen", "Lesbares 45-Grad-Routing von Verbindungen für große Topologien", "Programme in C17, Rust, Go, Kotlin, JavaScript und PHP aus einem Entwurf erzeugen", "Rumpf-Editor mit dem generierten Funktionskopf über Ihrem Code", "Vervollständigung, Hover, semantische Farben und Diagnosen mit clangd oder rust-analyzer", "Gehe zu Definition und Verweise suchen über Prozessorrümpfe hinweg", "Wiederverwendbare Komponenten mit typisierten Ports, per Inhaltshash fixiert", "Archetyp-Bibliothek und Netzwerkanalyse von Daten-, Fehler- und Abhängigkeitsflüssen", "Kanban-Board, Backlog, Verantwortung und Revisionsverlauf", "Planexport als PDF, SVG, PNG und Mermaid sowie lokaler MCP-Server für KI-Agenten"], "searchTerms": ["Datenfluss", "Softwareentwurf", "Codegenerierung", "C17", "Rust", "MCP-Server", "Architektur"], "captions": ["Entwerfen Sie einen Webserver als Datenflussgraph aus Prozessoren, Typen und Verbindungen.", "Fassen Sie Prozessoren zu Kompositen zusammen; geroutete Verbindungen zeigen jeden Puffer.", "Veröffentlichen Sie einen Entwurf als Komponente mit typisierten Ein- und Ausgabeports.", "Referenzieren Sie eine Komponente aus einem anderen Entwurf; ihre Ports verbinden sich.", "Bearbeiten Sie einen Prozessorrumpf unter seinem angehefteten, generierten C17-Funktionskopf.", "Vervollständigen Sie beim Tippen die Mitglieder einer Bibliothek, unterstützt von clangd.", "Lesen Sie Hover-Dokumentation in Rust-Rümpfen, wenn rust-analyzer installiert ist.", "Zeigen Sie Pläne mit Schriftfeld in der Vorschau und exportieren Sie PDF, SVG, PNG oder Mermaid.", "Verfolgen Sie Entitäten auf einem Kanban-Board mit Status, Verantwortung und Bearbeitern.", "Lassen Sie KI-Agenten über den lokalen MCP-Server und sein Zugriffsprotokoll arbeiten."], "minimumHardware": ["Grafiktreiber mit DirectX-11-Unterstützung", "Tastatur und Maus"], "recommendedHardware": ["clang, clangd oder rust-analyzer für Codeprüfungen installiert", "Eine Maus mit drei Tasten zum Verschieben der Zeichenfläche"]}, "el": {"language": "Ελληνικά", "description": "Σχεδιάστε λογισμικό ως γράφο ροής δεδομένων και δημιουργήστε το πρόγραμμα από αυτόν.\n\nΤο Wirecraft είναι ένας δωρεάν σχεδιαστής ανοιχτού κώδικα για λογισμικό που βασίζεται σε συμβάντα και σε ροή δεδομένων. Τοποθετήστε επεξεργαστές, τύπους δεδομένων και τυποποιημένες συνδέσεις σε έναν καμβά, ομαδοποιήστε τους σε σύνθετα στοιχεία και αφήστε τη δρομολόγηση στις 45 μοίρες να κρατά ευανάγνωστες ακόμη και μεγάλες τοπολογίες. Κάθε σύνδεση είναι ένας τυποποιημένος buffer, κάθε επεξεργαστής μια συνάρτηση, και οι βιβλιοθήκες υπηρεσιών δανείζονται στους επεξεργαστές που τις χρησιμοποιούν.\n\nΑπό τον ίδιο σχεδιασμό το Wirecraft δημιουργεί πλήρη προγράμματα σε C17, Rust, Go, Kotlin, JavaScript (Node.js) και PHP. Γράψτε το σώμα κάθε επεξεργαστή σε έναν επεξεργαστή κειμένου που καρφιτσώνει την παραγόμενη κεφαλίδα της συνάρτησης πάνω από τον κώδικά σας, ώστε να βλέπετε πάντα τις παραμέτρους που θα περάσει η γεννήτρια. Με εγκατεστημένα τα clang, clangd ή rust-analyzer αποκτάτε συμπλήρωση κώδικα, τεκμηρίωση κατά την κατάδειξη, σημασιολογικά χρώματα, μετάβαση στον ορισμό, εύρεση αναφορών και διαγνωστικά του μεταγλωττιστή συνδεδεμένα με την οντότητα και τη γραμμή που γράψατε.\n\nΔημοσιεύστε τμήματα ενός σχεδιασμού ως επαναχρησιμοποιήσιμα στοιχεία με τυποποιημένες θύρες και αναφερθείτε σε αυτά από άλλους σχεδιασμούς, κλειδωμένα με αποτύπωμα περιεχομένου ώστε οι ενημερώσεις να γίνονται συνειδητά. Ξεκινήστε νέα δουλειά από μια βιβλιοθήκη αρχετύπων και εξετάστε έναν σχεδιασμό με ανάλυση δικτύου των ροών δεδομένων, σφαλμάτων και εξαρτήσεων.\n\nΓύρω από τον σχεδιασμό έχετε επίσης διαχείριση έργου (πίνακας Kanban και backlog με κατάσταση, υπευθυνότητα και ιστορικό αναθεωρήσεων), εξαγωγή σχεδίων και τεκμηρίωσης σε PDF, SVG, PNG και Mermaid για εκτύπωση και κοινή χρήση, και έναν προαιρετικό τοπικό διακομιστή MCP μέσω του οποίου συμβατοί πράκτορες ΤΝ μπορούν να διαβάζουν και να επεξεργάζονται τον σχεδιασμό με τεκμηριωμένα εργαλεία.\n\nΤο Wirecraft ανοίγει έργα .orch του Threadworks και διατηρεί τα δεδομένα τους. Δεν απαιτείται λογαριασμός και ο σχεδιασμός λειτουργεί χωρίς σύνδεση. Η διεπαφή της εφαρμογής είναι στα αγγλικά. Το Wirecraft αναπτύσσεται ενεργά.", "shortDescription": "Σχεδιάστε οπτικά λογισμικό ροής δεδομένων και δημιουργήστε προγράμματα σε C17, Rust, Go, Kotlin, JavaScript ή PHP. Επεξεργαστείτε σώματα επεξεργαστών με τη βοήθεια διακομιστών γλώσσας, επαναχρησιμοποιήστε στοιχεία, εξαγάγετε σχέδια και συνδέστε πράκτορες ΤΝ μέσω τοπικού διακομιστή MCP.", "features": ["Οπτικός σχεδιαστής ροής δεδομένων με επεξεργαστές, τύπους, τυποποιημένες συνδέσεις και σύνθετα", "Ευανάγνωστη δρομολόγηση συνδέσεων στις 45 μοίρες για μεγάλες τοπολογίες", "Δημιουργία προγραμμάτων C17, Rust, Go, Kotlin, JavaScript και PHP από έναν σχεδιασμό", "Επεξεργασία σωμάτων με την παραγόμενη κεφαλίδα συνάρτησης καρφιτσωμένη πάνω από τον κώδικα", "Συμπλήρωση, υποδείξεις, σημασιολογικά χρώματα και διαγνωστικά με clangd ή rust-analyzer", "Μετάβαση στον ορισμό και εύρεση αναφορών στα σώματα των επεξεργαστών", "Επαναχρησιμοποιήσιμα στοιχεία με τυποποιημένες θύρες, κλειδωμένα με αποτύπωμα", "Βιβλιοθήκη αρχετύπων και ανάλυση δικτύου ροών δεδομένων, σφαλμάτων και εξαρτήσεων", "Πίνακας Kanban, backlog, υπευθυνότητα και ιστορικό αναθεωρήσεων", "Εξαγωγή σχεδίων σε PDF, SVG, PNG και Mermaid και τοπικός διακομιστής MCP για πράκτορες ΤΝ"], "searchTerms": ["ροή δεδομένων", "σχεδίαση λογισμικού", "παραγωγή κώδικα", "C17", "Rust", "διακομιστής MCP", "αρχιτεκτονική"], "captions": ["Σχεδιάστε έναν διακομιστή ιστού ως γράφο επεξεργαστών, τύπων και συνδέσεων.", "Ομαδοποιήστε επεξεργαστές σε σύνθετα· οι δρομολογημένες συνδέσεις δείχνουν κάθε buffer.", "Δημοσιεύστε έναν σχεδιασμό ως στοιχείο με τυποποιημένες θύρες εισόδου και εξόδου.", "Αναφερθείτε σε ένα στοιχείο από άλλον σχεδιασμό· οι θύρες του ενώνονται με τις συνδέσεις σας.", "Επεξεργαστείτε το σώμα ενός επεξεργαστή κάτω από την καρφιτσωμένη κεφαλίδα C17.", "Συμπληρώστε τα μέλη μιας δανεισμένης βιβλιοθήκης καθώς πληκτρολογείτε, με το clangd.", "Διαβάστε τεκμηρίωση κατά την κατάδειξη σε σώματα Rust με εγκατεστημένο rust-analyzer.", "Προεπισκοπήστε σχέδια με υπόμνημα και εξαγάγετέ τα σε PDF, SVG, PNG ή Mermaid.", "Παρακολουθήστε οντότητες σε πίνακα Kanban με κατάσταση, υπευθυνότητα και αναθέσεις.", "Αφήστε πράκτορες ΤΝ να εργαστούν μέσω του τοπικού διακομιστή MCP και του αρχείου πρόσβασης."], "minimumHardware": ["Προγράμματα οδήγησης γραφικών με υποστήριξη DirectX 11", "Πληκτρολόγιο και ποντίκι"], "recommendedHardware": ["Εγκατεστημένο clang, clangd ή rust-analyzer για ελέγχους κώδικα", "Ποντίκι τριών πλήκτρων για μετακίνηση του καμβά"]}, "hi": {"language": "हिन्दी", "description": "सॉफ़्टवेयर को डेटा-फ़्लो ग्राफ़ के रूप में डिज़ाइन करें, फिर उसी से प्रोग्राम बनाएँ।\n\nWirecraft इवेंट-आधारित और डेटा-फ़्लो सॉफ़्टवेयर के लिए एक मुफ़्त, ओपन-सोर्स डिज़ाइनर है। कैनवास पर प्रोसेसर, डेटा टाइप और टाइप किए गए लिंक रखें, उन्हें कंपोज़िट में समूहित करें, और 45-डिग्री रूटिंग को बड़ी टोपोलॉजी भी पढ़ने योग्य रखने दें। हर लिंक एक टाइप किया हुआ बफ़र है, हर प्रोसेसर एक फ़ंक्शन है, और सर्विस लाइब्रेरी उन प्रोसेसरों को दी जाती हैं जो उनका उपयोग करते हैं।\n\nउसी डिज़ाइन से Wirecraft C17, Rust, Go, Kotlin, JavaScript (Node.js) और PHP में पूरे प्रोग्राम बनाता है। हर प्रोसेसर की बॉडी ऐसे एडिटर में लिखें जो जनरेट किए गए फ़ंक्शन हेडर को आपके कोड के ऊपर पिन रखता है, ताकि आप हमेशा देख सकें कि जनरेटर कौन से पैरामीटर देगा। clang, clangd या rust-analyzer इंस्टॉल होने पर आपको कोड पूर्णता, होवर पर दस्तावेज़, सिमेंटिक रंग, परिभाषा पर जाएँ, संदर्भ खोजें और आपकी लिखी एंटिटी व पंक्ति से जुड़े कंपाइलर डायग्नोस्टिक मिलते हैं।\n\nडिज़ाइन के हिस्सों को टाइप किए गए पोर्ट वाले पुन: उपयोग योग्य कंपोनेंट के रूप में प्रकाशित करें और अन्य डिज़ाइनों से उनका संदर्भ लें, जो कंटेंट हैश से पिन होते हैं ताकि अपडेट सोच-समझकर हों। आर्किटाइप की लाइब्रेरी से नया काम शुरू करें और डेटा, त्रुटि व निर्भरता प्रवाहों के नेटवर्क विश्लेषण से डिज़ाइन की जाँच करें।\n\nडिज़ाइन के साथ आपको प्रोजेक्ट प्रबंधन (स्थिति, ज़िम्मेदारी और संशोधन इतिहास वाला कानबान बोर्ड और बैकलॉग), प्रिंट और साझा करने के लिए योजनाओं व दस्तावेज़ों का PDF, SVG, PNG और Mermaid में निर्यात, और एक वैकल्पिक स्थानीय MCP सर्वर भी मिलता है, जिससे संगत AI एजेंट प्रलेखित टूल के ज़रिए डिज़ाइन पढ़ और संपादित कर सकते हैं।\n\nWirecraft Threadworks के .orch प्रोजेक्ट खोलता है और उनका डेटा सुरक्षित रखता है। किसी खाते की ज़रूरत नहीं है और डिज़ाइन का काम ऑफ़लाइन होता है। ऐप का इंटरफ़ेस अंग्रेज़ी में है। Wirecraft का सक्रिय रूप से विकास हो रहा है।", "shortDescription": "डेटा-फ़्लो सॉफ़्टवेयर को दृश्य रूप से डिज़ाइन करें और उससे C17, Rust, Go, Kotlin, JavaScript या PHP प्रोग्राम बनाएँ। लैंग्वेज सर्वर की मदद से प्रोसेसर बॉडी संपादित करें, कंपोनेंट दोबारा उपयोग करें, योजनाएँ निर्यात करें और स्थानीय MCP सर्वर से AI एजेंट जोड़ें।", "features": ["प्रोसेसर, टाइप, टाइप किए गए लिंक और कंपोज़िट वाला दृश्य डेटा-फ़्लो डिज़ाइनर", "बड़ी टोपोलॉजी के लिए पढ़ने योग्य 45-डिग्री लिंक रूटिंग", "एक डिज़ाइन से C17, Rust, Go, Kotlin, JavaScript और PHP प्रोग्राम बनाएँ", "कोड के ऊपर पिन किए गए जनरेटेड फ़ंक्शन हेडर वाला बॉडी एडिटर", "clangd या rust-analyzer के साथ पूर्णता, होवर, सिमेंटिक रंग और डायग्नोस्टिक", "प्रोसेसर बॉडी में परिभाषा पर जाएँ और संदर्भ खोजें", "टाइप किए गए पोर्ट वाले, कंटेंट हैश से पिन किए गए पुन: उपयोग योग्य कंपोनेंट", "आर्किटाइप लाइब्रेरी और डेटा, त्रुटि व निर्भरता प्रवाहों का नेटवर्क विश्लेषण", "कानबान बोर्ड, बैकलॉग, ज़िम्मेदारी और संशोधन इतिहास", "PDF, SVG, PNG और Mermaid में योजना निर्यात और AI एजेंटों के लिए स्थानीय MCP सर्वर"], "searchTerms": ["डेटा फ़्लो", "सॉफ़्टवेयर डिज़ाइन", "कोड जनरेशन", "C17", "Rust", "MCP सर्वर", "आर्किटेक्चर"], "captions": ["वेब सर्वर को प्रोसेसर, टाइप और लिंक के डेटा-फ़्लो ग्राफ़ के रूप में डिज़ाइन करें।", "प्रोसेसरों को कंपोज़िट में समूहित करें; रूट किए गए लिंक हर बफ़र दिखाते हैं।", "डिज़ाइन को टाइप किए गए इनपुट और आउटपुट पोर्ट वाले कंपोनेंट के रूप में प्रकाशित करें।", "दूसरे डिज़ाइन से कंपोनेंट का संदर्भ लें; उसके पोर्ट आपके लिंक से जुड़ते हैं।", "पिन किए गए जनरेटेड C17 फ़ंक्शन हेडर के नीचे प्रोसेसर बॉडी संपादित करें।", "clangd की मदद से टाइप करते समय दी गई लाइब्रेरी के सदस्य पूरे करें।", "rust-analyzer इंस्टॉल होने पर Rust बॉडी में होवर दस्तावेज़ पढ़ें।", "शीर्षक ब्लॉक वाली योजनाओं का पूर्वावलोकन करें और PDF, SVG, PNG या Mermaid में निर्यात करें।", "कानबान बोर्ड पर स्थिति, ज़िम्मेदारी और असाइनी के साथ एंटिटी ट्रैक करें।", "AI एजेंटों को स्थानीय MCP सर्वर और उसके एक्सेस लॉग के ज़रिए काम करने दें।"], "minimumHardware": ["DirectX 11 समर्थित ग्राफ़िक्स ड्राइवर", "कीबोर्ड और माउस"], "recommendedHardware": ["कोड जाँच के लिए clang, clangd या rust-analyzer इंस्टॉल", "कैनवास खिसकाने के लिए तीन बटन वाला माउस"]}, "it": {"language": "Italiano", "description": "Progetta il software come un grafo di flusso di dati e genera il programma a partire da esso.\n\nWirecraft è un progettista gratuito e open source per software a eventi e a flusso di dati. Disponi processori, tipi di dati e collegamenti tipizzati su una tela, raggruppali in compositi e lascia che l'instradamento a 45 gradi mantenga leggibili anche le topologie più grandi. Ogni collegamento è un buffer tipizzato, ogni processore una funzione, e le librerie di servizio vengono prestate ai processori che le usano.\n\nDallo stesso progetto Wirecraft genera programmi completi in C17, Rust, Go, Kotlin, JavaScript (Node.js) e PHP. Scrivi il corpo di ogni processore in un editor che fissa l'intestazione di funzione generata sopra il tuo codice, così vedi sempre i parametri che il generatore passerà. Con clang, clangd o rust-analyzer installati ottieni completamento, documentazione al passaggio del mouse, colori semantici, vai alla definizione, trova riferimenti e diagnostica del compilatore ricondotta all'entità e alla riga che hai scritto.\n\nPubblica parti di un progetto come componenti riutilizzabili con porte tipizzate e richiamale da altri progetti, fissate tramite hash del contenuto perché gli aggiornamenti siano consapevoli. Inizia nuovi lavori da una libreria di archetipi ed esamina un progetto con l'analisi di rete dei suoi flussi di dati, errori e dipendenze.\n\nIntorno al progetto hai anche la gestione dei progetti (bacheca Kanban e backlog con stato, responsabilità e cronologia delle revisioni), l'esportazione di tavole e documentazione in PDF, SVG, PNG e Mermaid per stampare e condividere, e un server MCP locale opzionale con cui agenti di IA compatibili possono leggere e modificare il progetto tramite strumenti documentati.\n\nWirecraft apre i progetti .orch di Threadworks e ne conserva i dati. Non è richiesto alcun account e la progettazione funziona offline. L'interfaccia dell'applicazione è in inglese. Wirecraft è in sviluppo attivo.", "shortDescription": "Progetta visivamente software a flusso di dati e genera programmi in C17, Rust, Go, Kotlin, JavaScript o PHP. Modifica i corpi dei processori con l'aiuto dei language server, riutilizza componenti, esporta tavole e collega agenti di IA tramite un server MCP locale.", "features": ["Progettista visivo di flussi di dati con processori, tipi, collegamenti tipizzati e compositi", "Instradamento leggibile dei collegamenti a 45 gradi per grandi topologie", "Genera programmi C17, Rust, Go, Kotlin, JavaScript e PHP da un unico progetto", "Editor dei corpi con l'intestazione di funzione generata fissata sopra il codice", "Completamento, hover, colori semantici e diagnostica con clangd o rust-analyzer", "Vai alla definizione e trova riferimenti tra i corpi dei processori", "Componenti riutilizzabili con porte tipizzate, fissati tramite hash del contenuto", "Libreria di archetipi e analisi di rete dei flussi di dati, errori e dipendenze", "Bacheca Kanban, backlog, responsabilità e cronologia delle revisioni", "Esportazione di tavol
