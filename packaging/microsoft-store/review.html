<script id="data" type="application/json">{"af": {"language": "Afrikaans", "description": "Bou sagteware visueel op, skryf elke komponent se algoritme en genereer dan die program.\n\nWirecraft is 'n gratis oopbron-ontwikkelingsraamwerk wat 'n sagteware-oplossing soos 'n produksielyn uitlê. Jy verdeel die probleem in verwerkende komponente en verklaar uitdruklik die skakels waardeur hulle data aan mekaar deurgee. In gewone kode is hierdie kanale implisiet: data beweeg deur funksie- en metode-oproepe, soms versteek in die skep van objekte, en die oproepgrafiek is moeilik om sonder gereedskap te skets. In Wirecraft is die skakel 'n eie ontwerpelement, sodat die argitektuur sigbaar bly soos materiaal wat van werkstasie na werkstasie beweeg.\n\n1. Ontwerp. Plaas verwerkers, tipes en skakels op 'n doek en groepeer hulle in samestellings. Elke verwerker is 'n funksionele komponent en elke skakel 'n getipeerde datakanaal. Objekoriëntering bly: tipes vorm uitdruklike hiërargieë en afhanklikhede, en biblioteke leen stelle metodes uit aan die komponente wat hulle gebruik.\n2. Programmeer. Skryf die algoritme van elke komponent in sy eie redigeerder, onder die funksiekop wat die generator sal maak, sodat jy die insette, uitsette en biblioteke sien wat dit ontvang. Met clang, clangd of rust-analyzer geïnstalleer kry jy voltooiing, sweefinligting, gaan na definisie, soek verwysings en samestellerdiagnostiek op die reëls wat jy geskryf het.\n3. Genereer. Wirecraft stel die komponente en hul skakels saam tot 'n volledige program in C17, Rust, Go, Kotlin, JavaScript (Node.js) of PHP.\n\nSkakels is opsioneel. Sonder hulle werk samestellings as vouers en blaar-entiteite as lêers, en elke entiteit hou sy kode saam met sy spesifikasie en toetsdata, sodat hul verband uitdruklik is eerder as veronderstel.\n\nHergebruik dele van 'n ontwerp as komponente met getipeerde poorte, begin vanaf argetipes en ontleed data-, fout- en afhanklikheidsvloei. Wirecraft bied ook projekbestuur (Kanban-bord, agterstand, hersieningsgeskiedenis), uitvoer van tekeninge na PDF, SVG, PNG en Mermaid om te druk, en 'n opsionele plaaslike MCP-bediener vir KI-agente.\n\nWirecraft maak Threadworks .orch-projekte oop. Geen rekening word benodig nie en dit werk vanlyn. Die koppelvlak is in Engels. Wirecraft word aktief ontwikkel.", "shortDescription": "'n Visuele ontwikkelingsraamwerk: verdeel 'n sagteware-oplossing in komponente wat deur uitdruklike, getipeerde dataskakels verbind word, skryf elke komponent se algoritme met hulp van 'n taalbediener en genereer programme in C17, Rust, Go, Kotlin, JavaScript of PHP. Sluit herbruikbare komponente, projekbestuur, tekening-uitvoer en 'n plaaslike MCP-bediener in.", "features": ["Visuele opbou: verdeel 'n oplossing in verwerkende komponente wat deur uitdruklike dataskakels verbind word", "Skakels verklaar die datakanale tussen komponente, soos stasies op 'n monteerlyn", "Tipes met uitdruklike hiërargieë en afhanklikhede; biblioteke leen metodes aan komponente uit", "Skryf elke komponent se algoritme onder sy vasgespelde, gegenereerde funksiekop", "Voltooiing, sweefinligting, definisie, verwysings en diagnostiek met clangd of rust-analyzer", "Genereer C17-, Rust-, Go-, Kotlin-, JavaScript- en PHP-programme uit die ontwerp en jou kode", "Sonder skakels is samestellings vouers en entiteite lêers met kode, spesifikasie en toetse", "Herbruikbare komponente met getipeerde poorte, argetipes en ontleding van data- en afhanklikheidsvloei", "Kanban-bord, agterstand, verantwoordelikheid en hersieningsgeskiedenis", "Uitvoer van tekeninge na PDF, SVG, PNG en Mermaid, en 'n plaaslike MCP-bediener vir KI-agente"], "searchTerms": ["datavloei", "visuele programmering", "sagteware-argitektuur", "kodegenerering", "C17", "Rust", "MCP-bediener"], "captions": ["Bou 'n webbediener op uit verwerkende komponente wat deur uitdruklike, getipeerde dataskakels verbind word.", "Groepeer komponente in samestellings; geroeteerde skakels wys elke datakanaal.", "Publi , tako da vidite ulaze, izlaze i biblioteke koje dobija. Uz instalirani clang, clangd ili rust-analyzer dobijate dovršavanje, opise pri prelasku mišem, prelazak na definiciju, pretragu referenci i dijagnostiku kompajlera za redove koje ste napisali.\n3. Generirajte. Wirecraft sklapa komponente i njihove veze u potpun program na jeziku C17, Rust, Go, Kotlin, JavaScript (Node.js) ili PHP.\n\nVeze nisu obavezne. Bez njih kompoziti rade kao folderi, a krajnji entiteti kao datoteke, i svaki entitet drži svoj kod zajedno sa specifikacijom i testnim podacima, pa je njihova povezanost izričita, a ne podrazumijevana.\n\nPonovo koristite dijelove dizajna kao komponente s tipiziranim portovima, počnite od arhetipova i analizirajte tokove podataka, grešaka i zavisnosti. Wirecraft nudi i upravljanje projektom (Kanban ploča, zaostaci, historija revizija), izvoz crteža u PDF, SVG, PNG i Mermaid za štampu i opcionalni lokalni MCP server za AI agente.\n\nWirecraft otvara Threadworks .orch projekte. Račun nije potreban i radi bez internetske veze. Interfejs je na engleskom. Wirecraft se aktivno razvija.", "shortDescription": "Vizuelni razvojni okvir: podijelite softversko rješenje na komponente povezane izričitim tipiziranim vezama podataka, napišite algoritam svake komponente uz pomoć jezičkog servera i generirajte programe na C17, Rust, Go, Kotlin, JavaScript ili PHP. Uključuje komponente za višekratnu upotrebu, upravljanje projektom, izvoz crteža i lokalni MCP server.", "features": ["Vizuelna izgradnja: podijelite rješenje na komponente za obradu povezane izričitim vezama podataka", "Veze deklariraju kanale podataka između komponenti, kao stanice montažne linije", "Tipovi s izričitim hijerarhijama i zavisnostima; biblioteke posuđuju metode komponentama", "Pišite algoritam svake komponente ispod zakačenog generiranog zaglavlja funkcije", "Dovršavanje, opisi, definicije, reference i dijagnostika uz clangd ili rust-analyzer", "Generirajte C17, Rust, Go, Kotlin, JavaScript i PHP programe iz dizajna i svog koda", "Bez veza kompoziti su folderi, a entiteti datoteke s kodom, specifikacijom i testovima", "Komponente za višekratnu upotrebu s tipiziranim portovima, arhetipovi i analiza tokova podataka i zavisnosti", "Kanban ploča, zaostaci, odgovornost i historija revizija", "Izvoz crteža u PDF, SVG, PNG i Mermaid i lokalni MCP server za AI agente"], "searchTerms": ["tok podataka", "vizuelno programiranje", "softverska arhitektura", "generiranje koda", "C17", "Rust", "MCP server"], "captions": ["Izgradite web server od komponenti za obradu povezanih izričitim tipiziranim vezama podataka.", "Grupirajte komponente u kompozite; provučene veze prikazuju svaki kanal podataka.", "Objavite dizajn kao komponentu s tipiziranim ulaznim i izlaznim portovima.", "Referencirajte komponentu iz drugog dizajna; njeni portovi se spajaju s vašim vezama.", "Pišite algoritam komponente ispod zakačenog generiranog zaglavlja C17 funkcije.", "Dovršavajte članove posuđene biblioteke dok kucate, uz clangd.", "Čitajte dokumentaciju pri prelasku mišem u Rust tijelima uz instalirani rust-analyzer.", "Pregledajte planove sa zaglavljem crteža i izvezite ih u PDF, SVG, PNG ili Mermaid.", "Pratite entitete na Kanban ploči sa statusom, odgovornošću i izvršiocima.", "Pustite AI agente da rade preko lokalnog MCP servera i njegovog dnevnika pristupa."], "minimumHardware": ["Grafički drajveri s podrškom za DirectX 11", "Tastatura i miš"], "recommendedHardware": ["Instaliran clang, clangd ili rust-analyzer za provjeru koda", "Miš s tri tipke za pomjeranje platna"]}, "bg": {"language": "Български", "description": "Изграждайте софтуер визуално, напишете алгоритъма на всеки компонент и след това генерирайте програмата.\n\nWirecraft е безплатна рамка за разработка с отворен код, която подрежда софтуерно решение като производствена линия. Разделяте задачата на обработващи компоненти и изрично декларирате връзките, по които те си предават данни. В обичайния код тези канали са неявни: данните преминават през извиквания на функции и методи, понякога скрити в създаването на обекти, а графът на извикванията е трудно да се скицира без инструменти. В Wirecraft връзката е самостоятелен елемент на дизайна, така че архитектурата остава видима като материал, който преминава от едно работно място към друго.\n\n1. Проектирайте. Поставете процесори, типове и връзки върху платно и ги групирайте в композити. Всеки процесор е функционален компонент, а всяка връзка – типизиран канал за данни. Обектната ориентация остава: типовете образуват изрични йерархии и зависимости, а библиотеките предоставят набори от методи на компонентите, които ги използват.\n2. Програмирайте. Пишете алгоритъма на всеки компонент в собствен редактор под заглавката на функцията, която генераторът ще създаде, така че виждате входовете, изходите и библиотеките, които получава. С инсталирани clang, clangd или rust-analyzer получавате довършване, подсказки, преход към дефиниция, търсене на препратки и диагностика на компилатора за редовете, които сте написали.\n3. Генерирайте. Wirecraft сглобява компонентите и връзките им в цялостна програма на C17, Rust, Go, Kotlin, JavaScript (Node.js) или PHP.\n\nВръзките не са задължителни. Без тях композитите служат като папки, а крайните обекти като файлове, и всеки обект държи кода си заедно със спецификацията и тестовите си данни, така че връзката между тях е изрична, а не предполагаема.\n\nИзползвайте отново части от проект като компоненти с типизирани портове, започвайте от архетипи и анализирайте потоците на данни, грешки и зависимости. Wirecraft предлага и управление на проекти (Kanban табло, backlog, история на ревизиите), експорт на чертежи в PDF, SVG, PNG и Mermaid за печат и незадължителен локален MCP сървър за агенти с ИИ.\n\nWirecraft отваря .orch проекти на Threadworks. Не изисква акаунт и работи офлайн. Интерфейсът е на английски. Wirecraft се разработва активно.", "shortDescription": "Визуална рамка за разработка: разделете софтуерно решение на компоненти, свързани с изрични типизирани връзки за данни, напишете алгоритъма на всеки компонент с помощта на езиков сървър и генерирайте програми на C17, Rust, Go, Kotlin, JavaScript или PHP. Включва компоненти за многократна употреба, управление на проекти, експорт на чертежи и локален MCP сървър.", "features": ["Визуално изграждане: разделете решение на обработващи компоненти, свързани с изрични връзки за данни", "Връзките декларират каналите за данни между компонентите като станции на монтажна линия", "Типове с изрични йерархии и зависимости; библиотеките предоставят методи на компонентите", "Пишете алгоритъма на всеки компонент под закачената генерирана заглавка на функцията", "Довършване, подсказки, дефиниции, препратки и диагностика с clangd или rust-analyzer", "Генерирайте програми на C17, Rust, Go, Kotlin, JavaScript и PHP от проекта и вашия код", "Без връзки композитите са папки, а обектите файлове с код, спецификация и тестове", "Компоненти за многократна употреба с типизирани портове, архетипи и анализ на потоци от данни и зависимости", "Kanban табло, backlog, отговорност и история на ревизиите", "Експорт на чертежи в PDF, SVG, PNG и Mermaid и локален MCP сървър за агенти с ИИ"], "searchTerms": ["поток от данни", "визуално програмиране", "софтуерна архитектура", "генериране на код", "C17", "Rust", "MCP сървър"], "captions": ["Изградете уеб сървър от обработващи компоненти, свързани с изрични типизирани връзки за данни.", "Групирайте компонентите в композити; прокараните връзки показват всеки канал за данни.", "Публикувайте проект като компонент с типизирани входни и изходни портове.", "Използвайте компонент в друг проект; портовете му се свързват с вашите връзки.", "Пишете алгоритъма на компонент под закачената генерирана заглавка на C17 функция.", "Довършвайте членовете на предоставена библиотека, докато пишете, с clangd.", "Четете документация при посочване в Rust тела с инсталиран rust-analyzer.", "Преглеждайте планове с щампа и ги експортирайте в PDF, SVG, PNG или Mermaid.", "Следете обектите на Kanban табло със статус, отговорност и изпълнители.", "Оставете ИИ агенти да работят чрез локалния MCP сървър и неговия журнал за достъп."], "minimumHardware": ["Графични драйвери с поддръжка на DirectX 11", "Клавиатура и мишка"], "recommendedHardware": ["Инсталиран clang, clangd или rust-analyzer за проверка на кода", "Мишка с три бутона за местене на платното"]}, "zh": {"language": "中文（简体）", "description": "以可视化方式搭建软件，编写每个组件的算法，然后生成程序。\n\nWirecraft 是一个免费的开源开发框架，它像生产线一样组织软件解决方案。你将问题拆分为处理组件，并显式声明它们相互传递数据所经过的连接。在传统代码中，这些通道是隐式的：数据通过函数和方法调用传递，有时隐藏在对象构造中，没有工具很难画出调用图。在 Wirecraft 中，连接本身就是一个设计元素，因此架构始终清晰可见，就像在工位之间流转的物料。\n\n1. 设计。在画布上放置处理器、类型和连接，并将它们组合成复合体。每个处理器都是一个函数式组件，每个连接都是一条带类型的数据通道。面向对象依然存在：类型构成显式的层次结构和依赖关系，库则为使用它们的组件提供成套方法。\n2. 编程。在每个组件自己的编辑器中，于生成器将要生成的函数头下方编写其算法，从而看到它接收的输入、输出和库。安装 clang、clangd 或 rust-analyzer 后，你可以在自己编写的代码行上获得补全、悬停信息、转到定义、查找引用和编译器诊断。\n3. 生成。Wirecraft 将组件及其连接组装成完整的 C17、Rust、Go、Kotlin、JavaScript (Node.js) 或 PHP 程序。\n\n连接是可选的。没有连接时，复合体相当于文件夹，叶子实体相当于文件，每个实体都把代码与其规格说明和测试数据放在一起，使它们之间的关联是显式的，而不是隐含的。\n\n将设计的一部分复用为带类型端口的组件，从原型开始，并分析数据流、错误流和依赖流。Wirecraft 还提供项目管理（看板、待办列表、修订历史）、将图纸导出为 PDF、SVG、PNG 和 Mermaid 以便打印，以及供 AI 智能体使用的可选本地 MCP 服务器。\n\nWirecraft 可打开 Threadworks 的 .orch 项目。无需账户，可离线使用。界面为英文。Wirecraft 正在积极开发中。", "shortDescription": "一个可视化开发框架：将软件解决方案拆分为由显式、带类型的数据连接相连的组件，借助语言服务器编写每个组件的算法，并生成 C17、Rust、Go、Kotlin、JavaScript 或 PHP 程序。包含可复用组件、项目管理、图纸导出和本地 MCP 服务器。", "features": ["可视化搭建：将解决方案拆分为由显式数据连接相连的处理组件", "连接声明组件之间的数据通道，就像装配线上的工位", "具有显式层次结构和依赖关系的类型；库为组件提供方法", "在固定显示的生成函数头下编写每个组件的算法", "借助 clangd 或 rust-analyzer 提供补全、悬停、定义、引用和诊断", "根据设计和你的代码生成 C17、Rust、Go、Kotlin、JavaScript 和 PHP 程序", "没有连接时，复合体是文件夹，实体是包含代码、规格说明和测试的文件", "带类型端口的可复用组件、原型，以及数据流和依赖流分析", "看板、待办列表、责任人和修订历史", "将图纸导出为 PDF、SVG、PNG 和 Mermaid，并提供供 AI 智能体使用的本地 MCP 服务器"], "searchTerms": ["数据流", "可视化编程", "软件架构", "代码生成", "C17", "Rust", "MCP 服务器"], "captions": ["用显式、带类型的数据连接相连的处理组件搭建一个 Web 服务器。", "将组件组合成复合体；布线后的连接显示每一条数据通道。", "将设计发布为带类型化输入和输出端口的可重用组件。", "在另一份设计中引用组件；它的端口会接入你的连接。", "在固定显示的生成 C17 函数头下编写组件的算法。", "输入时借助 clangd 补全所借用库的成员。", "安装 rust-analyzer 后，在 Rust 主体中阅读悬停文档。", "预览带标题栏的图纸，并导出为 PDF、SVG、PNG 或 Mermaid。", "在看板上跟踪实体的状态、负责人和执行人。", "让 AI 代理通过本地 MCP 服务器及其访问日志处理设计。"], "minimumHardware": ["支持 DirectX 11 的图形驱动程序", "键盘和鼠标"], "recommendedHardware": ["安装 clang、clangd 或 rust-analyzer 以进行代码检查", "用于平移画布的三键鼠标"]}, "cs": {"language": "Čeština", "description": "Sestavte software vizuálně, napište algoritmus každé komponenty a poté vygenerujte program.\n\nWirecraft je bezplatný open-source vývojový framework, který uspořádá softwarové řešení jako výrobní linku. Problém rozdělíte na zpracovávající komponenty a výslovně deklarujete propojení, kterými si předávají data. V běžném kódu jsou tyto kanály implicitní: data putují voláním funkcí a metod, někdy skrytým ve vytváření objektů, a graf volání se bez nástrojů těžko načrtává. Ve Wirecraftu je propojení samostatným návrhovým prvkem, takže architektura zůstává viditelná jako materiál putující mezi pracovišti.\n\n1. Navrhujte. Umístěte procesory, typy a propojení na plátno a seskupte je do kompozitů. Každý procesor je funkční komponenta a každé propojení typovaný datový kanál. Objektová orientace zůstává: typy tvoří výslovné hierarchie a závislosti a knihovny půjčují sady metod komponentám, které je používají.\n2. Programujte. Algoritmus každé komponenty pište ve vlastním editoru pod hlavičkou funkce, kterou vytvoří generátor, takže vidíte vstupy, výstupy a knihovny, které dostává. S nainstalovaným clang, clangd nebo rust-analyzer získáte doplňování, nápovědu při najetí, přechod na definici, hledání odkazů a diagnostiku překladače na řádcích, které jste napsali.\n3. Generujte. Wirecraft sestaví komponenty a jejich propojení do úplného programu v C17, Rust, Go, Kotlin, JavaScript (Node.js) nebo PHP.\n\nPropojení jsou volitelná. Bez nich fungují kompozity jako složky a koncové entity jako soubory a každá entita drží svůj kód pohromadě se specifikací a testovacími daty, takže jejich souvislost je výslovná, nikoli předpokládaná.\n\nPoužívejte části návrhu znovu jako komponenty s typovanými porty, začněte z archetypů a analyzujte toky dat, chyb a závislostí. Wirecraft nabízí také řízení projektu (tabule Kanban, backlog, historie revizí), export výkresů do PDF, SVG, PNG a Mermaid pro tisk a volitelný místní server MCP pro agenty AI.\n\nWirecraft otevírá projekty .orch z Threadworks. Nevyžaduje účet a funguje offline. Rozhraní je v angličtině. Wirecraft se aktivně vyvíjí.", "shortDescription": "Vizuální vývojový framework: rozdělte softwarové řešení na komponenty spojené výslovnými typovanými datovými propojeními, napište algoritmus každé komponenty s pomocí jazykového serveru a generujte programy v C17, Rust, Go, Kotlin, JavaScript nebo PHP. Obsahuje opakovaně použitelné komponenty, řízení projektu, export výkresů a místní server MCP.", "features": ["Vizuální sestavení: rozdělte řešení na zpracovávající komponenty s výslovnými datovými propojeními", "Propojení deklarují datové kanály mezi komponentami jako stanoviště montážní linky", "Typy s výslovnými hierarchiemi a závislostmi; knihovny půjčují komponentám metody", "Pište algoritmus každé komponenty pod připnutou vygenerovanou hlavičkou funkce", "Doplňování, nápověda, definice, odkazy a diagnostika s clangd nebo rust-analyzer", "Generujte programy v C17, Rust, Go, Kotlin, JavaScript a PHP z návrhu a vlastního kódu", "Bez propojení jsou kompozity složky a entity soubory s kódem, specifikací a testy", "Opakovaně použitelné komponenty s typovanými porty, archetypy a analýza toků dat a závislostí", "Tabule Kanban, backlog, odpovědnost a historie revizí", "Export výkresů do PDF, SVG, PNG a Mermaid a místní server MCP pro agenty AI"], "searchTerms": ["tok dat", "vizuální programování", "softwarová architektura", "generování kódu", "C17", "Rust", "server MCP"], "captions": ["Sestavte webový server ze zpracovávajících komponent spojených výslovnými typovanými datovými propojeními.", "Seskupte komponenty do kompozitů; vedená propojení ukazují každý datový kanál.", "Publikujte návrh jako komponentu s typovanými vstupními a výstupními porty.", "Odkažte na komponentu z jiného návrhu; její porty se napojí na vaše propojení.", "Pište algoritmus komponenty pod připnutou vygenerovanou hlavičkou funkce C17.", "Doplňujte členy zapůjčené knihovny při psaní díky clangd.", "Čtěte dokumentaci při najetí myší v tělech Rust s nainstalovaným rust-analyzer.", "Prohlížejte plány s rohovým razítkem a exportujte je do PDF, SVG, PNG nebo Mermaid.", "Sledujte entity na tabuli Kanban se stavem, odpovědností a řešiteli.", "Nechte agenty AI pracovat přes místní server MCP a jeho protokol přístupů."], "minimumHardware": ["Grafické ovladače s podporou DirectX 11", "Klávesnice a myš"], "recommendedHardware": ["Nainstalovaný clang, clangd nebo rust-analyzer pro kontrolu kódu", "Myš se třemi tlačítky pro posouvání plátna"]}, "da": {"language": "Dansk", "description": "Byg software op visuelt, skriv algoritmen for hver komponent, og generér derefter programmet.\n\nWirecraft er et gratis open source-udviklingsframework, der lægger en softwareløsning an som en produktionslinje. Du deler problemet op i behandlende komponenter og erklærer eksplicit de forbindelser, som de sender data til hinanden igennem. I almindelig kode er disse kanaler implicitte: data bevæger sig gennem funktions- og metodekald, nogle gange skjult i oprettelsen af objekter, og kaldgrafen er svær at skitsere uden værktøjer. I Wirecraft er forbindelsen et selvstændigt designelement, så arkitekturen forbliver synlig som materiale, der flyttes mellem arbejdsstationer.\n\n1. Design. Placér processorer, typer og forbindelser på et lærred, og saml dem i kompositter. Hver processor er en funktionel komponent og hver forbindelse en typet datakanal. Objektorienteringen består: typer danner eksplicitte hierarkier og afhængigheder, og biblioteker låner samlinger af metoder ud til de komponenter, der bruger dem.\n2. Programmér. Skriv algoritmen for hver komponent i dens egen editor under den funktionsheader, som generatoren vil lave, så du ser de input, output og biblioteker, den modtager. Med clang, clangd eller rust-analyzer installeret får du autofuldførelse, hover, gå til definition, find referencer og compilerdiagnosticering på de linjer, du har skrevet.\n3. Generér. Wirecraft samler komponenterne og deres forbindelser til et komplet program i C17, Rust, Go, Kotlin, JavaScript (Node.js) eller PHP.\n\nForbindelser er valgfrie. Uden dem fungerer kompositter som mapper og bladenheder som filer, og hver enhed holder sin kode sammen med sin specifikation og sine testdata, så sammenhængen er eksplicit i stedet for underforstået.\n\nGenbrug dele af et design som komponenter med typede porte, start fra arketyper, og analysér data-, fejl- og afhængighedsstrømme. Wirecraft tilbyder også projektstyring (Kanban-tavle, backlog, revisionshistorik), eksport af tegninger til PDF, SVG, PNG og Mermaid til udskrivning og en valgfri lokal MCP-server til AI-agenter.\n\nWirecraft åbner Threadworks-.orch-projekter. Der kræves ingen konto, og det virker offline. Brugerfladen er på engelsk. Wirecraft er under aktiv udvikling.", "shortDescription": "Et visuelt udviklingsframework: del en softwareløsning op i komponenter, der er forbundet med eksplicitte, typede dataforbindelser, skriv algoritmen for hver komponent med hjælp fra en sprogserver, og generér programmer i C17, Rust, Go, Kotlin, JavaScript eller PHP. Med genbrugelige komponenter, projektstyring, eksport af tegninger og en lokal MCP-server.", "features": ["Visuel opbygning: del en løsning op i behandlende komponenter med eksplicitte dataforbindelser", "Forbindelser erklærer datakanalerne mellem komponenter, som stationer på et samlebånd", "Typer med eksplicitte hierarkier og afhængigheder; biblioteker låner metoder ud til komponenter", "Skriv algoritmen for hver komponent under dens fastgjorte, genererede funktionsheader", "Autofuldførelse, hover, definition, referencer og diagnosticering med clangd eller rust-analyzer", "Generér C17-, Rust-, Go-, Kotlin-, JavaScript- og PHP-programmer fra designet og din kode", "Uden forbindelser er kompositter mapper og enheder filer med kode, specifikation og tests", "Genbrugelige komponenter med typede porte, arketyper og analyse af data- og afhængighedsstrømme", "Kanban-tavle, backlog, ansvar og revisionshistorik", "Eksport af tegninger til PDF, SVG, PNG og Mermaid samt en lokal MCP-server til AI-agenter"], "searchTerms": ["dataflow", "visuel programmering", "softwarearkitektur", "kodegenerering", "C17", "Rust", "MCP-server"], "captions": ["Byg en webserver op af behandlende komponenter forbundet med eksplicitte, typede dataforbindelser.", "Saml komponenter i kompositter; rutede forbindelser viser hver datakanal.", "Udgiv et design som en genbrugelig komponent med typede ind- og udgangsporte.", "Henvis til en komponent fra et andet design; dens porte forbindes med dine forbindelser.", "Skriv en komponents algoritme under dens fastgjorte, genererede C17-funktionsheader.", "Fuldfør medlemmerne af et udlånt bibliotek, mens du skriver, med clangd.", "Læs hover-dokumentation i Rust-kroppe, når rust-analyzer er installeret.", "Se tegninger med titelfelt, og eksportér dem til PDF, SVG, PNG eller Mermaid.", "Følg enheder på en Kanban-tavle med status, ansvar og tildelte.", "Lad AI-agenter arbejde via den lokale MCP-server og dens adgangslog."], "minimumHardware": ["Grafikdrivere med understøttelse af DirectX 11", "Tastatur og mus"], "recommendedHardware": ["clang, clangd eller rust-analyzer installeret til kodekontrol", "En mus med tre knapper til at panorere lærredet"]}, "nl": {"language": "Nederlands", "description": "Bouw software visueel op, schrijf het algoritme van elk onderdeel en genereer daarna het programma.\n\nWirecraft is een gratis opensource-ontwikkelframework dat een softwareoplossing opzet als een productielijn. U deelt het probleem op in verwerkende componenten en declareert expliciet de verbindingen waarlangs ze elkaar gegevens doorgeven. In gewone code zijn die kanalen impliciet: gegevens gaan via functie- en methodeaanroepen, soms verborgen in het aanmaken van objecten, en de aanroepgraaf is zonder hulpmiddelen moeilijk te schetsen. In Wirecraft is de verbinding een eigen ontwerpelement, zodat de architectuur zichtbaar blijft als materiaal dat van werkstation naar werkstation gaat.\n\n1. Ontwerpen. Plaats processors, typen en verbindingen op een canvas en groepeer ze in composieten. Elke processor is een functionele component en elke verbinding een getypeerd gegevenskanaal. Objectoriëntatie blijft: typen vormen expliciete hiërarchieën en afhankelijkheden, en bibliotheken lenen reeksen methoden uit aan de componenten die ze gebruiken.\n2. Programmeren. Schrijf het algoritme van elke component in een eigen editor, onder de functiekop die de generator zal maken, zodat u de invoer, uitvoer en bibliotheken ziet die de component krijgt. Met clang, clangd of rust-analyzer geïnstalleerd krijgt u aanvulling, hoverinformatie, ga naar definitie, verwijzingen zoeken en compilerdiagnostiek op de regels die u schreef.\n3. Genereren. Wirecraft voegt de componenten en hun verbindingen samen tot een volledig programma in C17, Rust, Go, Kotlin, JavaScript (Node.js) of PHP.\n\nVerbindingen zijn optioneel. Zonder verbindingen werken composieten als mappen en eindentiteiten als bestanden, en elke entiteit houdt haar code bij haar specificatie en testgegevens, zodat die samenhang expliciet is in plaats van verondersteld.\n\nHergebruik delen van een ontwerp als componenten met getypeerde poorten, begin vanuit archetypen en analyseer gegevens-, fout- en afhankelijkheidsstromen. Wirecraft biedt ook projectbeheer (Kanban-bord, backlog, revisiegeschiedenis), export van tekeningen naar PDF, SVG, PNG en Mermaid om af te drukken en een optionele lokale MCP-server voor AI-agents.\n\nWirecraft opent Threadworks-.orch-projecten. Er is geen account nodig en het werkt offline. De interface is in het Engels. Wirecraft wordt actief ontwikkeld.", "shortDescription": "Een visueel ontwikkelframework: deel een softwareoplossing op in componenten die verbonden zijn door expliciete, getypeerde gegevensverbindingen, schrijf het algoritme van elke component met hulp van een taalserver en genereer programma's in C17, Rust, Go, Kotlin, JavaScript of PHP. Met herbruikbare componenten, projectbeheer, export van tekeningen en een lokale MCP-server.", "features": ["Visueel opbouwen: deel een oplossing op in verwerkende componenten met expliciete gegevensverbindingen", "Verbindingen declareren de gegevenskanalen tussen componenten, zoals stations aan een assemblagelijn", "Typen met expliciete hiërarchieën en afhankelijkheden; bibliotheken lenen methoden uit aan componenten", "Schrijf het algoritme van elke component onder de vastgezette, gegenereerde functiekop", "Aanvulling, hover, definitie, verwijzingen en diagnostiek met clangd of rust-analyzer", "Genereer C17-, Rust-, Go-, Kotlin-, JavaScript- en PHP-programma's uit het ontwerp en uw code", "Zonder verbindingen zijn composieten mappen en entiteiten bestanden met code, specificatie en tests", "Herbruikbare componenten met getypeerde poorten, archetypen en analyse van gegevens- en afhankelijkheidsstromen", "Kanban-bord, backlog, verantwoordelijkheid en revisiegeschiedenis", "Export van tekeningen naar PDF, SVG, PNG en Mermaid, en een lokale MCP-server voor AI-agents"], "searchTerms": ["gegevensstroom", "visueel programmeren", "softwarearchitectuur", "codegeneratie", "C17", "Rust", "MCP-server"], "captions": ["Bouw een webserver op uit verwerkende componenten met expliciete, getypeerde gegevensverbindingen.", "Groepeer componenten in composieten; gerouteerde verbindingen tonen elk gegevenskanaal.", "Publiceer een ontwerp als herbruikbare component met getypeerde in- en uitvoerpoorten.", "Verwijs naar een component vanuit een ander ontwerp; de poorten sluiten aan op je koppelingen.", "Schrijf het algoritme van een component onder de vastgezette, gegenereerde C17-functiekop.", "Vul tijdens het typen de leden van een uitgeleende bibliotheek aan met clangd.", "Lees hoverdocumentatie in Rust-bodies wanneer rust-analyzer is geïnstalleerd.", "Bekijk plannen met titelblok en exporteer ze naar PDF, SVG, PNG of Mermaid.", "Volg entiteiten op een Kanban-bord met status, verantwoordelijkheid en toegewezenen.", "Laat AI-agents werken via de lokale MCP-server en zijn toegangslogboek."], "minimumHardware": ["Grafische stuurprogramma's met DirectX 11-ondersteuning", "Toetsenbord en muis"], "recommendedHardware": ["clang, clangd of rust-analyzer geïnstalleerd voor codecontroles", "Een muis met drie knoppen om het canvas te verschuiven"]}, "en": {"language": "English", "description": "Scaffold software visually, write each component's algorithm, then generate the program.\n\nWirecraft is a free, open-source development framework that lays out a software solution like a production line. You break the problem into processing components and declare explicitly the links through which they pass data to one another. In conventional code those channels are implicit: data moves through function and method calls, sometimes hidden in object construction, and the call graph is hard to sketch without tools. In Wirecraft the link is a design element of its own, so the architecture stays visible as material moving between workstations.\n\n1. Design. Place processors, types and links on a canvas and group them into composites. Each processor is a functional component and each link a typed data channel. Object orientation remains: types form explicit hierarchies and dependencies, and libraries lend suites of methods to the components that use them.\n2. Program. Write the algorithm of each component in its own editor, under the function header the generator will produce, so you see the inputs, outputs and libraries it receives. With clang, clangd or rust-analyzer installed you get completion, hover, go-to-definition, find references and compiler diagnostics on the lines you wrote.\n3. Generate. Wirecraft assembles the components and their links into a complete program in C17, Rust, Go, Kotlin, JavaScript (Node.js) or PHP.\n\nLinks are optional. Without them, composites act as folders and leaf entities as files, and every entity keeps its code together with its specification and test data, so their association is explicit rather than implied.\n\nReuse parts of a design as components with typed ports, start from archetypes, and analyze data, error and dependency flows. Wirecraft also offers project management (Kanban board, backlog, revision history), plan export to PDF, SVG, PNG and Mermaid for printing, and an optional local MCP server for AI agents.\n\nWirecraft opens Threadworks .orch projects. No account is required and it works offline. The interface is in English. Wirecraft is under active development.", "shortDescription": "A visual development framework: break a software solution into components joined by explicit, typed data links, write each component's algorithm with language-server help, and generate C17, Rust, Go, Kotlin, JavaScript or PHP programs. Includes reusable components, project management, plan export and a local MCP server.", "features": ["Visual scaffolding: break a solution into processing components joined by explicit data links", "Links declare the data channels between components, like stations on an assembly line", "Types with explicit hierarchies and dependencies; libraries lend method suites to components", "Write each component's algorithm under its pinned, generated function header", "Completion, hover, go-to-definition, references and diagnostics with clangd or rust-analyzer", "Generate C17, Rust, Go, Kotlin, JavaScript and PHP programs from the design and your code", "Without links, composites are folders and entities are files with code, specification and tests", "Reusable components with typed ports, archetypes and analysis of data and dependency flows", "Kanban board, backlog, responsibility and revision history", "Plan export to PDF, SVG, PNG and Mermaid, and a local MCP server for AI agents"], "searchTerms": ["dataflow", "visual programming", "software architecture", "code generation", "C17", "Rust", "MCP server"], "captions": ["Scaffold a web server as processing components joined by explicit, typed data links.", "Group components into composites; routed links show every data channel.", "Publish a design as a reusable component with typed input and output ports.", "Reference a component from another design; its ports join your links.", "Write a component's algorithm under its pinned, generated C17 function header.", "Complete the members of a lent library while you type, powered by clangd.", "Read hover documentation in Rust bodies, with rust-analyzer installed.", "Preview plans with a title block and export them to PDF, SVG, PNG or Mermaid.", "Track entities on a Kanban board with status, responsibility and assignees.", "Let AI agents work on the design through the local MCP server and its access log."], "minimumHardware": ["Graphics drivers supporting DirectX 11", "Keyboard and mouse"], "recommendedHardware": ["clang, clangd or rust-analyzer installed for code checks", "A three-button mouse for canvas panning"]}, "et": {"language": "Eesti", "description": "Ehita tarkvara visuaalselt üles, kirjuta iga komponendi algoritm ja genereeri seejärel programm.\n\nWirecraft on tasuta avatud lähtekoodiga arendusraamistik, mis kujundab tarkvaralahenduse nagu tootmisliini. Jagad probleemi töötlevateks komponentideks ja deklareerid selgesõnaliselt lingid, mille kaudu need üksteisele andmeid edastavad. Tavapärases koodis on need kanalid kaudsed: andmed liiguvad funktsiooni- ja meetodikutsete kaudu, mõnikord objektide loomise sisse peidetuna, ning kutsegraafi on ilma tööriistadeta raske visandada. Wirecraftis on link omaette disainielement, nii et arhitektuur jääb nähtavaks nagu materjal, mis liigub töökohalt töökohale.\n\n1. Kavanda. Paiguta protsessorid, tüübid ja lingid lõuendile ning rühmita need liitüksusteks. Iga protsessor on funktsionaalne komponent ja iga link tüübitud andmekanal. Objektorienteeritus jääb alles: tüübid moodustavad selgesõnalised hierarhiad ja sõltuvused ning teegid laenavad meetodite kogumeid neid kasutavatele komponentidele.\n2. Programmeeri. Kirjuta iga komponendi algoritm tema enda redaktoris selle funktsioonipäise alla, mille generaator loob, nii et näed sisendeid, väljundeid ja teeke, mille komponent saab. Kui clang, clangd või rust-analyzer on paigaldatud, saad koodilõpetuse, kohtspikrid, definitsioonile liikumise, viidete otsingu ja kompilaatori diagnostika enda kirjutatud ridadele.\n3. Genereeri. Wirecraft paneb komponendid ja nende lingid kokku terviklikuks programmiks keeles C17, Rust, Go, Kotlin, JavaScript (Node.js) või PHP.\n\nLingid on valikulised. Ilma nendeta toimivad liitüksused kaustadena ja leheüksused failidena ning iga üksus hoiab oma koodi koos spetsifikatsiooni ja testandmetega, nii et nende seos on selgesõnaline, mitte eeldatud.\n\nKasuta kavandi osi uuesti tüübitud portidega komponentidena, alusta arhetüüpidest ning analüüsi andme-, vea- ja sõltuvusvoogusid. Wirecraft pakub ka projektihaldust (Kanbani tahvel, ootejärjekord, redaktsiooniajalugu), jooniste eksporti PDF-, SVG-, PNG- ja Mermaid-vormingusse printimiseks ning valikulist kohalikku MCP-serverit tehisintellekti agentidele.\n\nWirecraft avab Threadworksi .orch-projekte. Kontot pole vaja ja see töötab võrguühenduseta. Kasutajaliides on inglise keeles. Wirecrafti arendatakse aktiivselt.", "shortDescription": "Visuaalne arendusraamistik: jaga tarkvaralahendus komponentideks, mida ühendavad selgesõnalised tüübitud andmelingid, kirjuta iga komponendi algoritm keeleserveri abiga ja genereeri programme keeles C17, Rust, Go, Kotlin, JavaScript või PHP. Sisaldab taaskasutatavaid komponente, projektihaldust, jooniste eksporti ja kohalikku MCP-serverit.", "features": ["Visuaalne ülesehitus: jaga lahendus töötlevateks komponentideks, mida ühendavad selgesõnalised andmelingid", "Lingid deklareerivad komponentidevahelised andmekanalid nagu koosteliini tööpunktid", "Tüübid selgesõnaliste hierarhiate ja sõltuvustega; teegid laenavad komponentidele meetodeid", "Kirjuta iga komponendi algoritm kinnitatud genereeritud funktsioonipäise alla", "Koodilõpetus, kohtspikrid, definitsioon, viited ja diagnostika clangdi või rust-analyzeriga", "Genereeri C17-, Rust-, Go-, Kotlin-, JavaScript- ja PHP-programme kavandist ja oma koodist", "Ilma linkideta on liitüksused kaustad ja üksused failid koodi, spetsifikatsiooni ja testidega", "Taaskasutatavad tüübitud portidega komponendid, arhetüübid ning andme- ja sõltuvusvoogude analüüs", "Kanbani tahvel, ootejärjekord, vastutus ja redaktsiooniajalugu", "Jooniste eksport PDF-, SVG-, PNG- ja Mermaid-vormingusse ning kohalik MCP-server agentidele"], "searchTerms": ["andmevoog", "visuaalne programmeerimine", "tarkvaraarhitektuur", "koodi genereerimine", "C17", "Rust", "MCP-server"], "captions": ["Ehita veebiserver töötlevatest komponentidest, mida ühendavad selgesõnalised tüübitud andmelingid.", "Rühmita komponendid liitüksusteks; marsruuditud lingid näitavad iga andmekanalit.", "Avaldage kujundus korduvkasutatava komponendina tüübitud sisend- ja väljundportidega.", "Viidake komponendile teisest kujundusest; selle pordid liituvad teie ühendustega.", "Kirjuta komponendi algoritm kinnitatud genereeritud C17-funktsioonipäise alla.", "Lõpetage laenatud teegi liikmed trükkimise ajal clangdi abil.", "Lugege Rusti kehades kursori all dokumentatsiooni, kui rust-analyzer on paigaldatud.", "Vaadake plaane koos nurgatempliga ja eksportige need PDF-, SVG-, PNG- või Mermaid-vormingusse.", "Jälgige olemeid Kanbani tahvlil oleku, vastutuse ja täitjatega.", "Laske tehisintellekti agentidel töötada kohaliku MCP-serveri ja selle pääsulogi kaudu."], "minimumHardware": ["DirectX 11 toega graafikadraiverid", "Klaviatuur ja hiir"], "recommendedHardware": ["Koodikontrolliks paigaldatud clang, clangd või rust-analyzer", "Kolme nupuga hiir lõuendi liigutamiseks"]}, "fil": {"language": "Filipino", "description": "Buuin ang software nang biswal, isulat ang algorithm ng bawat component, at saka i-generate ang programa.\n\nAng Wirecraft ay isang libre at open-source na development framework na nag-aayos ng isang software solution na parang linya ng produksiyon. Hinahati mo ang problema sa mga processing component at tahasang idinedeklara ang mga link na dinadaanan ng datos na ipinapasa nila sa isa't isa. Sa karaniwang code, implicit ang mga channel na ito: dumadaan ang datos sa mga tawag sa function at method, kung minsan ay nakatago sa paglikha ng mga object, at mahirap iguhit ang call graph nang walang tool. Sa Wirecraft, ang link ay isang sariling elemento ng disenyo, kaya nananatiling nakikita ang arkitektura na parang materyales na lumilipat mula sa isang workstation patungo sa isa pa.\n\n1. Magdisenyo. Ilagay ang mga processor, type at link sa isang canvas at ipangkat ang mga ito sa mga composite. Ang bawat processor ay isang functional component at ang bawat link ay isang typed data channel. Nananatili ang object orientation: bumubuo ang mga type ng tahasang hierarchy at dependency, at nagpapahiram ang mga library ng mga hanay ng method sa mga component na gumagamit sa mga ito.\n2. Magprograma. Isulat ang algorithm ng bawat component sa sarili nitong editor, sa ilalim ng function header na gagawin ng generator, para makita mo ang mga input, output at library na natatanggap nito. Kapag naka-install ang clang, clangd o rust-analyzer, makakakuha ka ng completion, hover na impormasyon, go-to-definition, paghahanap ng mga reference at diagnostics ng compiler sa mga linyang isinulat mo.\n3. Mag-generate. Binubuo ng Wirecraft ang mga component at ang mga link nila bilang kumpletong programa sa C17, Rust, Go, Kotlin, JavaScript (Node.js) o PHP.\n\nOpsiyonal ang mga link. Kung wala ang mga ito, gumagana ang mga composite bilang folder at ang mga dulong entity bilang file, at iniingatan ng bawat entity ang code nito kasama ang specification at test data nito, kaya tahasan ang kaugnayan nila sa halip na ipinagpapalagay.\n\nGamitin muli ang mga bahagi ng isang disenyo bilang mga component na may typed port, magsimula sa mga archetype, at suriin ang daloy ng datos, error at dependency. Nag-aalok din ang Wirecraft ng project management (Kanban board, backlog, kasaysayan ng rebisyon), pag-export ng mga drawing sa PDF, SVG, PNG at Mermaid para sa pag-print, at opsiyonal na lokal na MCP server para sa mga AI agent.\n\nBinubuksan ng Wirecraft ang mga .orch project ng Threadworks. Walang kailangang account at gumagana ito offline. Nasa Ingles ang interface. Aktibong dine-develop ang Wirecraft.", "shortDescription": "Isang biswal na development framework: hatiin ang isang software solution sa mga component na pinag-uugnay ng tahasan at typed na data link, isulat ang algorithm ng bawat component sa tulong ng language server, at mag-generate ng mga programa sa C17, Rust, Go, Kotlin, JavaScript o PHP. May kasamang reusable na component, project management, pag-export ng drawing at lokal na MCP server.", "features": ["Biswal na pagbuo: hatiin ang solusyon sa mga processing component na pinag-uugnay ng tahasang data link", "Idinedeklara ng mga link ang mga data channel sa pagitan ng mga component, gaya ng istasyon sa assembly line", "Mga type na may tahasang hierarchy at dependency; nagpapahiram ang mga library ng method sa mga component", "Isulat ang algorithm ng bawat component sa ilalim ng naka-pin at na-generate na function header", "Completion, hover, definition, reference at diagnostics gamit ang clangd o rust-analyzer", "Mag-generate ng mga programang C17, Rust, Go, Kotlin, JavaScript at PHP mula sa disenyo at sa iyong code", "Kung walang link, folder ang mga composite at file ang mga entity na may code, specification at test", "Reusable na component na may typed port, mga archetype at pagsusuri ng daloy ng datos at dependency", "Kanban board, backlog, pananagutan at kasaysayan ng rebisyon", "Pag-export ng drawing sa PDF, SVG, PNG at Mermaid, at lokal na MCP server para sa mga AI agent"], "searchTerms": ["dataflow", "biswal na programming", "arkitektura ng software", "code generation", "C17", "Rust", "MCP server"], "captions": ["Buuin ang isang web server mula sa mga processing component na pinag-uugnay ng tahasan at typed na data link.", "Ipangkat ang mga component sa mga composite; ipinapakita ng mga naka-route na link ang bawat data channel.", "I-publish ang disenyo bilang reusable na component na may typed na input at output port.", "I-reference ang component mula sa ibang disenyo; kumokonekta ang mga port nito sa iyong link.", "Isulat ang algorithm ng isang component sa ilalim ng naka-pin at na-generate na C17 function header.", "Kumpletuhin ang mga member ng hiniram na library habang nagta-type, gamit ang clangd.", "Basahin ang dokumentasyon sa pag-hover sa mga Rust body kapag may rust-analyzer.", "I-preview ang mga plano na may title block at i-export sa PDF, SVG, PNG o Mermaid.", "Subaybayan ang mga entity sa Kanban board na may status, responsibilidad at assignee.", "Hayaang gumana ang mga AI agent sa lokal na MCP server at sa access log nito."], "minimumHardware": ["Mga graphics driver na sumusuporta sa DirectX 11", "Keyboard at mouse"], "recommendedHardware": ["Naka-install na clang, clangd o rust-analyzer para sa code check", "Mouse na may tatlong button para igalaw ang canvas"]}, "fi": {"language": "Suomi", "description": "Rakenna ohjelmisto visuaalisesti, kirjoita kunkin komponentin algoritmi ja luo sitten ohjelma.\n\nWirecraft on ilmainen avoimen lähdekoodin kehityskehys, joka jäsentää ohjelmistoratkaisun tuotantolinjan tavoin. Jaat ongelman käsitteleviin komponentteihin ja määrittelet nimenomaisesti linkit, joiden kautta ne välittävät tietoa toisilleen. Tavallisessa koodissa nämä kanavat ovat implisiittisiä: tieto kulkee funktio- ja metodikutsujen kautta, joskus olioiden luontiin piilotettuna, ja kutsugraafia on vaikea hahmotella ilman työkaluja. Wirecraftissa linkki on oma suunnitteluelementtinsä, joten arkkitehtuuri pysyy näkyvissä kuin materiaali, joka siirtyy työpisteeltä toiselle.\n\n1. Suunnittele. Sijoita prosessorit, tyypit ja linkit piirtoalueelle ja ryhmittele ne koosteiksi. Jokainen prosessori on toiminnallinen komponentti ja jokainen linkki tyypitetty tietokanava. Olio-ohjelmointi säilyy: tyypit muodostavat nimenomaisia hierarkioita ja riippuvuuksia, ja kirjastot lainaavat metodikokoelmia niitä käyttäville komponenteille.\n2. Ohjelmoi. Kirjoita kunkin komponentin algoritmi omassa editorissaan sen funktio-otsikon alle, jonka generaattori tuottaa, jolloin näet komponentin saamat syötteet, tulosteet ja kirjastot. Kun clang, clangd tai rust-analyzer on asennettu, saat täydennykset, kohdistintiedot, siirtymisen määrittelyyn, viittausten haun ja kääntäjän diagnostiikan kirjoittamillesi riveille.\n3. Luo. Wirecraft kokoaa komponentit ja niiden linkit valmiiksi ohjelmaksi kielellä C17, Rust, Go, Kotlin, JavaScript (Node.js) tai PHP.\n\nLinkit ovat valinnaisia. Ilman niitä koosteet toimivat kansioina ja lehtientiteetit tiedostoina, ja jokainen entiteetti pitää koodinsa yhdessä määrittelynsä ja testiaineistonsa kanssa, joten yhteys on nimenomainen eikä oletettu.\n\nKäytä suunnitelman osia uudelleen komponentteina, joilla on tyypitetyt portit, aloita arkkityypeistä ja analysoi tieto-, virhe- ja riippuvuusvirtoja. Wirecraft tarjoaa myös projektinhallinnan (Kanban-taulu, työjono, versiohistoria), piirustusten viennin PDF-, SVG-, PNG- ja Mermaid-muotoon tulostusta varten sekä valinnaisen paikallisen MCP-palvelimen tekoälyagenteille.\n\nWirecraft avaa Threadworksin .orch-projektit. Tiliä ei tarvita, ja se toimii ilman verkkoyhteyttä. Käyttöliittymä on englanninkielinen. Wirecraftia kehitetään aktiivisesti.", "shortDescription": "Visuaalinen kehityskehys: jaa ohjelmistoratkaisu komponentteihin, joita yhdistävät nimenomaiset, tyypitetyt tietolinkit, kirjoita kunkin komponentin algoritmi kielipalvelimen avulla ja luo ohjelmia kielillä C17, Rust, Go, Kotlin, JavaScript tai PHP. Mukana uudelleenkäytettävät komponentit, projektinhallinta, piirustusten vienti ja paikallinen MCP-palvelin.", "features": ["Visuaalinen rakentaminen: jaa ratkaisu käsitteleviin komponentteihin nimenomaisin tietolinkein", "Linkit määrittelevät komponenttien väliset tietokanavat kuin kokoonpanolinjan työpisteet", "Tyypit nimenomaisine hierarkioineen ja riippuvuuksineen; kirjastot lainaavat metodeja komponenteille", "Kirjoita kunkin komponentin algoritmi kiinnitetyn, luodun funktio-otsikon alle", "Täydennys, kohdistintiedot, määrittely, viittaukset ja diagnostiikka clangdilla tai rust-analyzerilla", "Luo C17-, Rust-, Go-, Kotlin-, JavaScript- ja PHP-ohjelmia suunnitelmasta ja koodistasi", "Ilman linkkejä koosteet ovat kansioita ja entiteetit tiedostoja, joissa on koodi, määrittely ja testit", "Uudelleenkäytettävät komponentit tyypitetyin portein, arkkityypit sekä tieto- ja riippuvuusvirtojen analyysi", "Kanban-taulu, työjono, vastuut ja versiohistoria", "Piirustusten vienti PDF-, SVG-, PNG- ja Mermaid-muotoon sekä paikallinen MCP-palvelin tekoälyagenteille"], "searchTerms": ["tietovirta", "visuaalinen ohjelmointi", "ohjelmistoarkkitehtuuri", "koodin generointi", "C17", "Rust", "MCP-palvelin"], "captions": ["Rakenna verkkopalvelin käsittelevistä komponenteista, joita yhdistävät nimenomaiset, tyypitetyt tietolinkit.", "Ryhmittele komponentit koosteiksi; reititetyt linkit näyttävät jokaisen tietokanavan.", "Julkaise suunnitelma uudelleenkäytettävänä komponenttina tyypitetyin tulo- ja lähtöportein.", "Viittaa komponenttiin toisesta suunnitelmasta; sen portit liittyvät linkkeihisi.", "Kirjoita komponentin algoritmi kiinnitetyn, luodun C17-funktio-otsikon alle.", "Täydennä lainatun kirjaston jäsenet kirjoittaessasi clangdin avulla.", "Lue osoitusohjeet Rust-rungoissa, kun rust-analyzer on asennettu.", "Esikatsele piirustuksia nimiöineen ja vie ne PDF-, SVG-, PNG- tai Mermaid-muotoon.", "Seuraa kohteita Kanban-taululla tilan, vastuiden ja tekijöiden kanssa.", "Anna tekoälyagenttien työskennellä paikallisen MCP-palvelimen ja sen lokin kautta."], "minimumHardware": ["DirectX 11:tä tukevat näytönohjaimen ajurit", "Näppäimistö ja hiiri"], "recommendedHardware": ["clang, clangd tai rust-analyzer asennettuna koodin tarkistuksiin", "Kolmipainikkeinen hiiri piirtoalueen panorointiin"]}, "fr": {"language": "Français", "description": "Construisez un logiciel visuellement, écrivez l'algorithme de chaque composant, puis générez le programme.\n\nWirecraft est un framework de développement libre et gratuit qui organise une solution logicielle comme une chaîne de production. Vous décomposez le problème en composants de traitement et déclarez explicitement les liens par lesquels ils se transmettent des données. Dans le code classique, ces canaux sont implicites : les données circulent par des appels de fonctions et de méthodes, parfois cachés dans la construction d'objets, et le graphe d'appels est difficile à esquisser sans outils. Dans Wirecraft, le lien est un élément de conception à part entière, si bien que l'architecture reste visible, comme une matière qui passe d'un poste de travail à l'autre.\n\n1. Concevoir. Placez processeurs, types et liens sur un canevas et regroupez-les en composites. Chaque processeur est un composant fonctionnel et chaque lien un canal de données typé. L'orientation objet demeure : les types forment des hiérarchies et des dépendances explicites, et les bibliothèques prêtent des ensembles de méthodes aux composants qui les utilisent.\n2. Programmer. Écrivez l'algorithme de chaque composant dans son propre éditeur, sous l'en-tête de fonction que le générateur produira, pour voir les entrées, les sorties et les bibliothèques qu'il reçoit. Avec clang, clangd ou rust-analyzer installés, vous obtenez complétion, infobulles, atteindre la définition, recherche de références et diagnostics du compilateur sur les lignes que vous avez écrites.\n3. Générer. Wirecraft assemble les composants et leurs liens en un programme complet en C17, Rust, Go, Kotlin, JavaScript (Node.js) ou PHP.\n\nLes liens sont facultatifs. Sans eux, les composites servent de dossiers et les entités terminales de fichiers, et chaque entité garde son code avec sa spécification et ses données de test, de sorte que leur association est explicite plutôt que supposée.\n\nRéutilisez des parties d'une conception comme composants à ports typés, partez d'archétypes et analysez les flux de données, d'erreurs et de dépendances. Wirecraft offre aussi la gestion de projet (tableau Kanban, backlog, historique des révisions), l'export de plans en PDF, SVG, PNG et Mermaid pour l'impression et un serveur MCP local facultatif pour les agents d'IA.\n\nWirecraft ouvre les projets .orch de Threadworks. Aucun compte n'est nécessaire et il fonctionne hors ligne. L'interface est en anglais. Wirecraft est en développement actif.", "shortDescription": "Un framework de développement visuel : décomposez une solution logicielle en composants reliés par des liens de données explicites et typés, écrivez l'algorithme de chaque composant avec l'aide d'un serveur de langage et générez des programmes C17, Rust, Go, Kotlin, JavaScript ou PHP. Avec composants réutilisables, gestion de projet, export de plans et serveur MCP local.", "features": ["Construction visuelle : décomposez une solution en composants de traitement reliés par des liens de données explicites", "Les liens déclarent les canaux de données entre composants, comme les postes d'une chaîne de montage", "Types aux hiérarchies et dépendances explicites ; les bibliothèques prêtent des méthodes aux composants", "Écrivez l'algorithme de chaque composant sous son en-tête de fonction généré et épinglé", "Complétion, infobulles, définition, références et diagnostics avec clangd ou rust-analyzer", "Générez des programmes C17, Rust, Go, Kotlin, JavaScript et PHP à partir de la conception et de votre code", "Sans liens, les composites sont des dossiers et les entités des fichiers avec code, spécification et tests", "Composants réutilisables à ports typés, archétypes et analyse des flux de données et de dépendances", "Tableau Kanban, backlog, responsabilité et historique des révisions", "Export de plans en PDF, SVG, PNG et Mermaid, et serveur MCP local pour les agents d'IA"], "searchTerms": ["flux de données", "programmation visuelle", "architecture logicielle", "génération de code", "C17", "Rust", "serveur MCP"], "captions": ["Construisez un serveur web en composants de traitement reliés par des liens de données explicites et typés.", "Regroupez les composants en composites ; les liens routés montrent chaque canal de données.", "Publiez une conception comme composant réutilisable avec ports d'entrée et de sortie typés.", "Référencez un composant depuis une autre conception ; ses ports rejoignent vos liens.", "Écrivez l'algorithme d'un composant sous son en-tête de fonction C17 généré et épinglé.", "Complétez les membres d'une bibliothèque prêtée pendant la saisie, grâce à clangd.", "Lisez la documentation au survol dans les corps Rust, avec rust-analyzer installé.", "Prévisualisez des plans avec cartouche et exportez-les en PDF, SVG, PNG ou Mermaid.", "Suivez les entités sur un tableau Kanban avec statut, responsabilité et assignés.", "Laissez des agents d'IA travailler via le serveur MCP local et son journal d'accès."], "minimumHardware": ["Pilotes graphiques compatibles DirectX 11", "Clavier et souris"], "recommendedHardware": ["clang, clangd ou rust-analyzer installé pour les vérifications de code", "Une souris à trois boutons pour déplacer le canevas"]}, "de": {"language": "Deutsch", "description": "Software visuell aufbauen, den Algorithmus jeder Komponente schreiben und dann das Programm erzeugen.\n\nWirecraft ist ein kostenloses Open-Source-Entwicklungsframework, das eine Softwarelösung wie eine Fertigungslinie anlegt. Sie zerlegen das Problem in verarbeitende Komponenten und deklarieren ausdrücklich die Verbindungen, über die sie einander Daten übergeben. In herkömmlichem Code sind diese Kanäle implizit: Daten wandern über Funktions- und Methodenaufrufe, manchmal verborgen in der Objekterzeugung, und der Aufrufgraph lässt sich ohne Werkzeuge kaum skizzieren. In Wirecraft ist die Verbindung ein eigenes Entwurfselement, sodass die Architektur sichtbar bleibt wie Material, das zwischen Arbeitsstationen wandert.\n\n1. Entwerfen. Platzieren Sie Prozessoren, Typen und Verbindungen auf einer Zeichenfläche und fassen Sie sie zu Kompositen zusammen. Jeder Prozessor ist eine funktionale Komponente, jede Verbindung ein typisierter Datenkanal. Die Objektorientierung bleibt erhalten: Typen bilden ausdrückliche Hierarchien und Abhängigkeiten, und Bibliotheken stellen den Komponenten, die sie nutzen, Methodensammlungen bereit.\n2. Programmieren. Schreiben Sie den Algorithmus jeder Komponente in einem eigenen Editor unter dem Funktionskopf, den der Generator erzeugen wird, sodass Sie die Eingaben, Ausgaben und Bibliotheken sehen, die sie erhält. Mit installiertem clang, clangd oder rust-analyzer erhalten Sie Vervollständigung, Hover, Gehe zu Definition, Verweise suchen und Compilerdiagnosen für die Zeilen, die Sie geschrieben haben.\n3. Erzeugen. Wirecraft setzt die Komponenten und ihre Verbindungen zu einem vollständigen Programm in C17, Rust, Go, Kotlin, JavaScript (Node.js) oder PHP zusammen.\n\nVerbindungen sind optional. Ohne sie wirken Komposite als Ordner und Blattentitäten als Dateien, und jede Entität hält ihren Code mit ihrer Spezifikation und ihren Testdaten zusammen, sodass die Zuordnung ausdrücklich statt nur angenommen ist.\n\nNutzen Sie Teile eines Entwurfs als Komponenten mit typisierten Ports wieder, beginnen Sie mit Archetypen und analysieren Sie Daten-, Fehler- und Abhängigkeitsflüsse. Wirecraft bietet außerdem Projektmanagement (Kanban-Board, Backlog, Revisionsverlauf), den Export von Plänen als PDF, SVG, PNG und Mermaid zum Drucken sowie einen optionalen lokalen MCP-Server für KI-Agenten.\n\nWirecraft öffnet Threadworks-.orch-Projekte. Es ist kein Konto erforderlich, und es funktioniert offline. Die Oberfläche ist auf Englisch. Wirecraft wird aktiv weiterentwickelt.", "shortDescription": "Ein visuelles Entwicklungsframework: Zerlegen Sie eine Softwarelösung in Komponenten, die durch ausdrückliche, typisierte Datenverbindungen verknüpft sind, schreiben Sie den Algorithmus jeder Komponente mit Sprachserver-Unterstützung und erzeugen Sie Programme in C17, Rust, Go, Kotlin, JavaScript oder PHP. Mit wiederverwendbaren Komponenten, Projektmanagement, Planexport und lokalem MCP-Server.", "features": ["Visueller Aufbau: Zerlegen Sie eine Lösung in verarbeitende Komponenten mit ausdrücklichen Datenverbindungen", "Verbindungen deklarieren die Datenkanäle zwischen Komponenten, wie Stationen einer Montagelinie", "Typen mit ausdrücklichen Hierarchien und Abhängigkeiten; Bibliotheken stellen Komponenten Methoden bereit", "Schreiben Sie den Algorithmus jeder Komponente unter ihrem angehefteten, generierten Funktionskopf", "Vervollständigung, Hover, Gehe zu Definition, Verweise und Diagnosen mit clangd oder rust-analyzer", "Erzeugen Sie Programme in C17, Rust, Go, Kotlin, JavaScript und PHP aus Entwurf und Code", "Ohne Verbindungen sind Komposite Ordner und Entitäten Dateien mit Code, Spezifikation und Tests", "Wiederverwendbare Komponenten mit typisierten Ports, Archetypen und Analyse von Daten- und Abhängigkeitsflüssen", "Kanban-Board, Backlog, Verantwortung und Revisionsverlauf", "Planexport als PDF, SVG, PNG und Mermaid sowie ein lokaler MCP-Server für KI-Agenten"], "searchTerms": ["Datenfluss", "visuelle Programmierung", "Softwarearchitektur", "Codegenerierung", "C17", "Rust", "MCP-Server"], "captions": ["Bauen Sie einen Webserver aus verarbeitenden Komponenten mit ausdrücklichen, typisierten Datenverbindungen auf.", "Fassen Sie Komponenten zu Kompositen zusammen; geroutete Verbindungen zeigen jeden Datenkanal.", "Veröffentlichen Sie einen Entwurf als Komponente mit typisierten Ein- und Ausgabeports.", "Referenzieren Sie eine Komponente aus einem anderen Entwurf; ihre Ports verbinden sich.", "Schreiben Sie den Algorithmus einer Komponente unter ihrem angehefteten, generierten C17-Funktionskopf.", "Vervollständigen Sie beim Tippen die Mitglieder einer Bibliothek, unterstützt von clangd.", "Lesen Sie Hover-Dokumentation in Rust-Rümpfen, wenn rust-analyzer installiert ist.", "Zeigen Sie Pläne mit Schriftfeld in der Vorschau und exportieren Sie PDF, SVG, PNG oder Mermaid.", "Verfolgen Sie Entitäten auf einem Kanban-Board mit Status, Verantwortung und Bearbeitern.", "Lassen Sie KI-Agenten über den lokalen MCP-Server und sein Zugriffsprotokoll arbeiten."], "minimumHardware": ["Grafiktreiber mit DirectX-11-Unterstützung", "Tastatur und Maus"], "recommendedHardware": ["clang, clangd oder rust-analyzer für Codeprüfungen installiert", "Eine Maus mit drei Tasten zum Verschieben der Zeichenfläche"]}, "el": {"language": "Ελληνικά", "description": "Χτίστε λογισμικό οπτικά, γράψτε τον αλγόριθμο κάθε στοιχείου και έπειτα δημιουργήστε το πρόγραμμα.\n\nΤο Wirecraft είναι ένα δωρεάν πλαίσιο ανάπτυξης ανοιχτού κώδικα που οργανώνει μια λύση λογισμικού σαν γραμμή παραγωγής. Χωρίζετε το πρόβλημα σε στοιχεία επεξεργασίας και δηλώνετε ρητά τις συνδέσεις μέσω των οποίων ανταλλάσσουν δεδομένα. Στον συνηθισμένο κώδικα αυτά τα κανάλια είναι έμμεσα: τα δεδομένα περνούν από κλήσεις συναρτήσεων και μεθόδων, μερικές φορές κρυμμένες στη δημιουργία αντικειμένων, και ο γράφος κλήσεων είναι δύσκολο να σχεδιαστεί χωρίς εργαλεία. Στο Wirecraft η σύνδεση είναι αυτοτελές στοιχείο σχεδίασης, έτσι η αρχιτεκτονική μένει ορατή σαν υλικό που περνά από θέση εργασίας σε θέση εργασίας.\n\n1. Σχεδιάστε. Τοποθετήστε επεξεργαστές, τύπους και συνδέσεις σε έναν καμβά και ομαδοποιήστε τα σε σύνθετα. Κάθε επεξεργαστής είναι λειτουργικό στοιχείο και κάθε σύνδεση ένα τυποποιημένο κανάλι δεδομένων. Ο αντικειμενοστραφής προσανατολισμός παραμένει: οι τύποι σχηματίζουν ρητές ιεραρχίες και εξαρτήσεις, και οι βιβλιοθήκες δανείζουν σύνολα μεθόδων στα στοιχεία που τις χρησιμοποιούν.\n2. Προγραμματίστε. Γράψτε τον αλγόριθμο κάθε στοιχείου στον δικό του επεξεργαστή κειμένου, κάτω από την κεφαλίδα συνάρτησης που θα παραγάγει η γεννήτρια, ώστε να βλέπετε τις εισόδους, τις εξόδους και τις βιβλιοθήκες που λαμβάνει. Με εγκατεστημένα τα clang, clangd ή rust-analyzer έχετε αυτόματη συμπλήρωση, πληροφορίες κατά την αιώρηση, μετάβαση στον ορισμό, εύρεση αναφορών και διαγνωστικά του μεταγλωττιστή στις γραμμές που γράψατε.\n3. Δημιουργήστε. Το Wirecraft συναρμολογεί τα στοιχεία και τις συνδέσεις τους σε πλήρες πρόγραμμα σε C17, Rust, Go, Kotlin, JavaScript (Node.js) ή PHP.\n\nΟι συνδέσεις είναι προαιρετικές. Χωρίς αυτές, τα σύνθετα λειτουργούν ως φάκελοι και οι τελικές οντότητες ως αρχεία, και κάθε οντότητα κρατά τον κώδικά της μαζί με την προδιαγραφή και τα δεδομένα δοκιμών της, ώστε η συσχέτισή τους να είναι ρητή και όχι υπονοούμενη.\n\nΕπαναχρησιμοποιήστε μέρη ενός σχεδίου ως στοιχεία με τυποποιημένες θύρες, ξεκινήστε από αρχέτυπα και αναλύστε ροές δεδομένων, σφαλμάτων και εξαρτήσεων. Το Wirecraft προσφέρει επίσης διαχείριση έργου (πίνακας Kanban, backlog, ιστορικό αναθεωρήσεων), εξαγωγή σχεδίων σε PDF, SVG, PNG και Mermaid για εκτύπωση και προαιρετικό τοπικό διακομιστή MCP για πράκτορες ΤΝ.\n\nΤο Wirecraft ανοίγει έργα .orch του Threadworks. Δεν απαιτείται λογαριασμός και λειτουργεί εκτός σύνδεσης. Η διεπαφή είναι στα αγγλικά. Το Wirecraft αναπτύσσεται ενεργά.", "shortDescription": "Ένα οπτικό πλαίσιο ανάπτυξης: χωρίστε μια λύση λογισμικού σε στοιχεία που ενώνονται με ρητές, τυποποιημένες συνδέσεις δεδομένων, γράψτε τον αλγόριθμο κάθε στοιχείου με τη βοήθεια διακομιστή γλώσσας και δημιουργήστε προγράμματα σε C17, Rust, Go, Kotlin, JavaScript ή PHP. Περιλαμβάνει επαναχρησιμοποιήσιμα στοιχεία, διαχείριση έργου, εξαγωγή σχεδίων και τοπικό διακομιστή MCP.", "features": ["Οπτική δόμηση: χωρίστε μια λύση σε στοιχεία επεξεργασίας που ενώνονται με ρητές συνδέσεις δεδομένων", "Οι συνδέσεις δηλώνουν τα κανάλια δεδομένων μεταξύ στοιχείων, σαν σταθμούς γραμμής συναρμολόγησης", "Τύποι με ρητές ιεραρχίες και εξαρτήσεις· οι βιβλιοθήκες δανείζουν μεθόδους στα στοιχεία", "Γράψτε τον αλγόριθμο κάθε στοιχείου κάτω από την καρφιτσωμένη, παραγόμενη κεφαλίδα συνάρτησης", "Συμπλήρωση, αιώρηση, ορισμοί, αναφορές και διαγνωστικά με clangd ή rust-analyzer", "Δημιουργήστε προγράμματα C17, Rust, Go, Kotlin, JavaScript και PHP από το σχέδιο και τον κώδικά σας", "Χωρίς συνδέσεις, τα σύνθετα είναι φάκελοι και οι οντότητες αρχεία με κώδικα, προδιαγραφή και δοκιμές", "Επαναχρησιμοποιήσιμα στοιχεία με τυποποιημένες θύρες, αρχέτυπα και ανάλυση ροών δεδομένων και εξαρτήσεων", "Πίνακας Kanban, backlog, ευθύνη και ιστορικό αναθεωρήσεων", "Εξαγωγή σχεδίων σε PDF, SVG, PNG και Mermaid και τοπικός διακομιστής MCP για πράκτορες ΤΝ"], "searchTerms": ["ροή δεδομένων", "οπτικός προγραμματισμός", "αρχιτεκτονική λογισμικού", "παραγωγή κώδικα", "C17", "Rust", "διακομιστής MCP"], "captions": ["Χτίστε έναν διακομιστή ιστού από στοιχεία επεξεργασίας που ενώνονται με ρητές, τυποποιημένες συνδέσεις δεδομένων.", "Ομαδοποιήστε στοιχεία σε σύνθετα· οι δρομολογημένες συνδέσεις δείχνουν κάθε κανάλι δεδομένων.", "Δημοσιεύστε έναν σχεδιασμό ως στοιχείο με τυποποιημένες θύρες εισόδου και εξόδου.", "Αναφερθείτε σε ένα στοιχείο από άλλον σχεδιασμό· οι θύρες του ενώνονται με τις συνδέσεις σας.", "Γράψτε τον αλγόριθμο ενός στοιχείου κάτω από την καρφιτσωμένη, παραγόμενη κεφαλίδα συνάρτησης C17.", "Συμπληρώστε τα μέλη μιας δανεισμένης βιβλιοθήκης καθώς πληκτρολογείτε, με το clangd.", "Διαβάστε τεκμηρίωση κατά την κατάδειξη σε σώματα Rust με εγκατεστημένο rust-analyzer.", "Προεπισκοπήστε σχέδια με υπόμνημα και εξαγάγετέ τα σε PDF, SVG, PNG ή Mermaid.", "Παρακολουθήστε οντότητες σε πίνακα Kanban με κατάσταση, υπευθυνότητα και αναθέσεις.", "Αφήστε πράκτορες ΤΝ να εργαστούν μέσω του τοπικού διακομιστή MCP και του αρχείου πρόσβασης."], "minimumHardware": ["Προγράμματα οδήγησης γραφικών με υποστήριξη DirectX 11", "Πληκτρολόγιο και ποντίκι"], "recommendedHardware": ["Εγκατεστημένο clang, clangd ή rust-analyzer για ελέγχους κώδικα", "Ποντίκι τριών πλήκτρων για μετακίνηση του καμβά"]}, "hi": {"language": "हिन्दी", "description": "सॉफ़्टवेयर को दृश्य रूप से खड़ा करें, हर घटक का एल्गोरिदम लिखें और फिर प्रोग्राम जनरेट करें।\n\nWirecraft एक निःशुल्क, ओपन-सोर्स डेवलपमेंट फ़्रेमवर्क है जो किसी सॉफ़्टवेयर समाधान को उत्पादन लाइन की तरह व्यवस्थित करता है। आप समस्या को प्रसंस्करण घटकों में बाँटते हैं और उन लिंक को स्पष्ट रूप से घोषित करते हैं जिनसे वे एक-दूसरे को डेटा भेजते हैं। पारंपरिक कोड में ये चैनल अंतर्निहित होते हैं: डेटा फ़ंक्शन और मेथड कॉल से होकर चलता है, कभी-कभी ऑब्जेक्ट बनाने में छिपा हुआ, और टूल के बिना कॉल ग्राफ़ बनाना कठिन होता है। Wirecraft में लिंक अपने आप में एक डिज़ाइन तत्व है, इसलिए आर्किटेक्चर एक कार्यस्थल से दूसरे तक जाती सामग्री की तरह दिखाई देता रहता है।\n\n1. डिज़ाइन करें। कैनवास पर प्रोसेसर, टाइप और लिंक रखें और उन्हें कंपोज़िट में समूहित करें। हर प्रोसेसर एक फ़ंक्शनल घटक है और हर लिंक एक टाइप वाला डेटा चैनल। ऑब्जेक्ट ओरिएंटेशन बना रहता है: टाइप स्पष्ट पदानुक्रम और निर्भरताएँ बनाते हैं, और लाइब्रेरी उन्हें उपयोग करने वाले घटकों को मेथड के समूह उधार देती हैं।\n2. प्रोग्राम करें। हर घटक का एल्गोरिदम उसके अपने एडिटर में, उस फ़ंक्शन हेडर के नीचे लिखें जिसे जनरेटर बनाएगा, ताकि आप उसे मिलने वाले इनपुट, आउटपुट और लाइब्रेरी देख सकें। clang, clangd या rust-analyzer इंस्टॉल होने पर आपको अपनी लिखी पंक्तियों पर कम्प्लीशन, होवर जानकारी, परिभाषा पर जाना, संदर्भ खोजना और कंपाइलर डायग्नॉस्टिक मिलते हैं।\n3. जनरेट करें। Wirecraft घटकों और उनके लिंक को C17, Rust, Go, Kotlin, JavaScript (Node.js) या PHP के पूरे प्रोग्राम में जोड़ता है।\n\nलिंक वैकल्पिक हैं। उनके बिना कंपोज़िट फ़ोल्डर की तरह और अंतिम इकाइयाँ फ़ाइलों की तरह काम करती हैं, और हर इकाई अपना कोड अपने विनिर्देश और परीक्षण डेटा के साथ रखती है, इसलिए उनका संबंध अनुमानित नहीं बल्कि स्पष्ट होता है।\n\nडिज़ाइन के हिस्सों को टाइप वाले पोर्ट वाले घटकों के रूप में फिर से उपयोग करें, आर्कीटाइप से शुरू करें और डेटा, त्रुटि व निर्भरता प्रवाहों का विश्लेषण करें। Wirecraft प्रोजेक्ट प्रबंधन (कानबान बोर्ड, बैकलॉग, संशोधन इतिहास), छपाई के लिए PDF, SVG, PNG और Mermaid में ड्रॉइंग निर्यात और AI एजेंटों के लिए वैकल्पिक स्थानीय MCP सर्वर भी देता है।\n\nWirecraft, Threadworks के .orch प्रोजेक्ट खोलता है। कोई खाता आवश्यक नहीं है और यह ऑफ़लाइन काम करता है। इंटरफ़ेस अंग्रेज़ी में है। Wirecraft सक्रिय विकास में है।", "shortDescription": "एक विज़ुअल डेवलपमेंट फ़्रेमवर्क: किसी सॉफ़्टवेयर समाधान को स्पष्ट, टाइप वाले डेटा लिंक से जुड़े घटकों में बाँटें, लैंग्वेज सर्वर की मदद से हर घटक का एल्गोरिदम लिखें और C17, Rust, Go, Kotlin, JavaScript या PHP प्रोग्राम जनरेट करें। इसमें पुन: उपयोग योग्य घटक, प्रोजेक्ट प्रबंधन, ड्रॉइंग निर्यात और स्थानीय MCP सर्वर शामिल हैं।", "features": ["विज़ुअल ढाँचा: समाधान को स्पष्ट डेटा लिंक से जुड़े प्रसंस्करण घटकों में बाँटें", "लिंक घटकों के बीच डेटा चैनल घोषित करते हैं, जैसे असेंबली लाइन के स्टेशन", "स्पष्ट पदानुक्रम और निर्भरताओं वाले टाइप; लाइब्रेरी घटकों को मेथड उधार देती हैं", "हर घटक का एल्गोरिदम पिन किए गए जनरेटेड फ़ंक्शन हेडर के नीचे लिखें", "clangd या rust-analyzer के साथ कम्प्लीशन, होवर, परिभाषा, संदर्भ और डायग्नॉस्टिक", "डिज़ाइन और अपने कोड से C17, Rust, Go, Kotlin, JavaScript और PHP प्रोग्राम जनरेट करें", "लिंक के बिना कंपोज़िट फ़ोल्डर और इकाइयाँ कोड, विनिर्देश व परीक्षण वाली फ़ाइलें हैं", "टाइप वाले पोर्ट के साथ पुन: उपयोग योग्य घटक, आर्कीटाइप और डेटा व निर्भरता प्रवाह विश्लेषण", "कानबान बोर्ड, बैकलॉग, ज़िम्मेदारी और संशोधन इतिहास", "PDF, SVG, PNG और Mermaid में ड्रॉइंग निर्यात और AI एजेंटों के लिए स्थानीय MCP सर्वर"], "searchTerms": ["डेटा प्रवाह", "विज़ुअल प्रोग्रामिंग", "सॉफ़्टवेयर आर्किटेक्चर", "कोड जनरेशन", "C17", "Rust", "MCP सर्वर"], "captions": ["स्पष्ट, टाइप वाले डेटा लिंक से जुड़े प्रसंस्करण घटकों से एक वेब सर्वर खड़ा करें।", "घटकों को कंपोज़िट nsiemi di metodi ai componenti che le usano.\n2. Programmare. Scrivi l'algoritmo di ogni componente nel suo editor, sotto l'intestazione di funzione che il generatore produrrà, così vedi gli ingressi, le uscite e le librerie che riceve. Con clang, clangd o rust-analyzer installati ottieni completamento, informazioni al passaggio del mouse, vai alla definizione, ricerca dei riferimenti e diagnostica del compilatore sulle righe che hai scritto.\n3. Generare. Wirecraft assembla i componenti e i loro collegamenti in un programma completo in C17, Rust, Go, Kotlin, JavaScript (Node.js) o PHP.\n\nI collegamenti sono facoltativi. Senza di essi i compositi fungono da cartelle e le entità foglia da file, e ogni entità tiene insieme codice, specifica e dati di test, così la loro associazione è esplicita anziché sottintesa.\n\nRiusa parti di un progetto come componenti con porte tipizzate, parti dagli archetipi e analizza i flussi di dati, errori e dipendenze. Wirecraft offre anche gestione dei progetti (bacheca Kanban, backlog, cronologia delle revisioni), esportazione di tavole in PDF, SVG, PNG e Mermaid per la stampa e un server MCP locale opzionale per gli agenti di IA.\n\nWirecraft apre i progetti .orch di Threadworks. Non serve un account e funziona offline. L'interfaccia è in inglese. Wirecraft è in sviluppo attivo.", "shortDescription": "Un framework di sviluppo visuale: scomponi una soluzione software in componenti uniti da collegamenti di dati espliciti e tipizzati, scrivi l'algoritmo di ogni componente con l'aiuto di un language server e genera programmi in C17, Rust, Go, Kotlin, JavaScript o PHP. Include componenti riutilizzabili, gestione dei progetti, esportazione di tavole e un server MCP locale.", "features": ["Costruzione visuale: scomponi una soluzione in componenti di elaborazione uniti da collegamenti di dati espliciti", "I collegamenti dichiarano i canali di dati tra i componenti, come le stazioni di una catena di montaggio", "Tipi con gerarchie e dipendenz 보입니다.\n\n1. 설계. 캔버스에 프로세서, 타입, 링크를 배치하고 컴포지트로 묶습니다. 각 프로세서는 함수형 구성 요소이고 각 링크는 타입이 지정된 데이터 채널입니다. 객체 지향도 그대로 유지됩니다. 타입은 명시적인 계층과 의존 관계를 이루고, 라이브러리는 이를 사용하는 구성 요소에 메서드 모음을 빌려줍니다.\n2. 프로그래밍. 각 구성 요소의 알고리즘을 전용 편집기에서, 생성기가 만들 함수 헤더 아래에 작성하므로 받는 입력, 출력, 라이브러리를 항상 볼 수 있습니다. clang, clangd 또는 rust-analyzer를 설치하면 작성한 줄에서 자동 완성, 호버 정보, 정의로 이동, 참조 찾기, 컴파일러 진단을 이용할 수 있습니다.\n3. 생성. Wirecraft는 구성 요소와 링크를 조립해 C17, Rust, Go, Kotlin, JavaScript(Node.js) 또는 PHP로 된 완전한 프로그램을 만듭니다.\n\n링크는 선택 사항입니다. 링크가 없으면 컴포지트는 폴더, 말단 엔터티는 파일처럼 동작하며, 각 엔터티는 코드를 명세 및 테스트 데이터와 함께 보관하므로 그 연관이 암묵적이지 않고 명시적입니다.\n\n설계의 일부를 타입이 지정된 포트를 가진 구성 요소로 재사용하고, 아키타입에서 시작하며, 데이터·오류·의존성 흐름을 분석하세요. Wirecraft는 프로젝트 관리(칸반 보드, 백로그, 리비전 기록), 인쇄용 PDF·SVG·PNG·Mermaid 도면 내보내기, AI 에이전트를 위한 선택적 로컬 MCP 서버도 제공합니다.\n\nWirecraft는 Threadworks .orch 프로젝트를 엽니다. 계정이 필요 없고 오프라인에서 작동합니다. 인터페이스는 영어입니다. Wirecraft는 활발히 개발 중입니다.", "shortDescription": "시각적 개발 프레임워크: 소프트웨어 솔루션을 명시적이고 타입이 지정된 데이터 링크로 연결된 구성 요소로 나누고, 언어 서버의 도움으로 각 구성 요소의 알고리즘을 작성하며, C17, Rust, Go, Kotlin, JavaScript 또는 PHP 프로그램을 생성합니다. 재사용 가능한 구성 요소, 프로젝트 관리, 도면 내보내기, 로컬 MCP 서버를 포함합니다.", "features": ["시각적 구성: 솔루션을 명시적인 데이터 링크로 연결된 처리 구성 요소로 분할", "링크가 구성 요소 사이의 데이터 채널을 조립 라인의 작업대처럼 선언", "명시적인 계층과 의존 관계를 갖는 타입, 구성 요소에 메서드를 빌려주는 라이브러리", "고정된 생성 함수 헤더 아래에 각 구성 요소의 알고리즘 작성", "clangd 또는 rust-analyzer를 통한 자동 완성, 호버, 정의, 참조, 진단", "설계와 직접 작성한 코드로 C17, Rust, Go, Kotlin, JavaScript, PHP 프로그램 생성", "링크가 없으면 컴포지트는 폴더, 엔터티는 코드·명세·테스트를 담은 파일", "타입이 지정된 포트를 가진 재사용 구성 요소, 아키타입, 데이터와 의존성 흐름 분석", "칸반 보드, 백로그, 담당 및 리비전 기록", "PDF, SVG, PNG, Mermaid 도면 내보내기와 AI 에이전트용 로컬 MCP 서버"], "searchTerms": ["데이터 흐름", "시각적 프로그래밍", "소프트웨어 아키텍처", "코드 생성", "C17", "Rust", "MCP 서버"], "captions": ["명시적이고 타입이 지정된 데이터 링크로 연결된 처리 구성 요소로 웹 서버를 구성합니다.", "구성 요소를 컴포지트로 묶습니다. 배선된 링크가 모든 데이터 채널을 보여 줍니다.", "설계를 형식 지정 입출력 포트가 있는 재사용 구성 요소로 게시합니다.", "다른 설계에서 구성 요소를 참조하면 그 포트가 링크에 연결됩니다.", "고정된 생성 C17 함수 헤더 아래에 구성 요소의 알고리즘을 작성합니다.", "clangd로 대여된 라이브러리의 멤버를 입력하면서 완성합니다.", "rust-analyzer를 설치하면 Rust 본문에서 마우스오버 문서를 읽을 수 있습니다.", "표제란이 있는 도 as objektas laiko savo kodą kartu su specifikacija ir testiniais duomenimis, todėl jų sąsaja yra aiški, o ne numanoma.\n\nPakartotinai naudokite projekto dalis kaip komponentus su tipizuotais prievadais, pradėkite nuo archetipų ir analizuokite duomenų, klaidų ir priklausomybių srautus. Wirecraft taip pat siūlo projektų valdymą (Kanban lenta, darbų sąrašas, versijų istorija), brėžinių eksportą į PDF, SVG, PNG ir Mermaid spausdinimui bei pasirenkamą vietinį MCP serverį DI agentams.\n\nWirecraft atidaro Threadworks .orch projektus. Paskyros nereikia, veikia neprisijungus. Sąsaja yra anglų kalba. Wirecraft aktyviai kuriamas.", "shortDescription": "Vizuali kūrimo sistema: suskaidykite programinės įrangos sprendimą į komponentus, sujungtus aiškiais tipizuotais duomenų ryšiais, parašykite kiekvieno komponento algoritmą su kalbos serverio pagalba ir generuokite programas C17, Rust, Go, Kotlin, JavaScript arba PHP kalba. Yra pakartotinai naudojami komponentai, projektų valdymas, brėžinių eksportas ir vietinis MCP serveris.", "features": ["Vizualus kūrimas: suskaidykite sprendimą į apdorojimo komponentus, sujungtus aiškiais duomenų ryšiais", "Ryšiai deklaruoja duomenų kanalus tarp komponentų, kaip surinkimo linijos stotys", "Tipai su aiškiomis hierarchijomis ir priklausomybėmis; bibliotekos skolina metodus komponentams", "Rašykite kiekvieno komponento algoritmą po prisegta sugeneruota funkcijos antrašte", "Užbaigimas, užuominos, apibrėžimas, nuorodos ir diagnostika su clangd arba rust-analyzer", "Generuokite C17, Rust, Go, Kotlin, JavaScript ir PHP programas iš projekto ir savo kodo", "Be ryšių sudėtiniai elementai yra aplankai, o objektai – failai su kodu, specifikacija ir testais", "Pakartotinai naudojami komponentai su tipizuotais prievadais, archetipai ir duomenų bei priklausomybių srautų analizė", "Kanban lenta, darbų sąrašas, atsakomybė ir versijų istorija", "Brėžinių eksportas į PDF, SVG, PNG ir Mermaid bei vietinis MCP serveris DI agentams"], "searchTerms": ["duomenų lgorytm każdego komponentu, a potem wygeneruj program.\n\nWirecraft to bezpłatny framework programistyczny o otwartym kodzie, który układa rozwiązanie programowe jak linię produkcyjną. Dzielisz problem na komponenty przetwarzające i jawnie deklarujesz połączenia, którymi przekazują sobie dane. W zwykłym kodzie te kanały są niejawne: dane przepływają przez wywołania funkcji i metod, czasem ukryte w tworzeniu obiektów, a graf wywołań trudno naszkicować bez narzędzi. W Wirecraft połączenie jest osobnym elementem projektu, dzięki czemu architektura pozostaje widoczna jak materiał przechodzący między stanowiskami pracy.\n\n1. Projektuj. Umieść procesory, typy i połączenia na płótnie i zgrupuj je w kompozyty. Każdy procesor jest komponentem funkcyjnym, a każde połączenie typowanym kanałem danych. Programowanie obiektowe pozostaje: typy tworzą jawne hierarchie i zależności, a biblioteki udostępniają zestawy metod komponentom, które z nich korzystają.\n2. Programuj. Pisz algorytm każdego komponentu w osobnym edytorze, pod nagłówkiem funkcji, który utworzy generator, aby widzieć wejścia, wyjścia i biblioteki, które otrzymuje. Z zainstalowanym clang, clangd lub rust-analyzer masz uzupełnianie, podpowiedzi, przejście do definicji, wyszukiwanie odwołań i diagnostykę kompilatora w napisanych przez siebie wierszach.\n3. Generuj. Wirecraft składa komponenty i ich połączenia w kompletny program w C17, Rust, Go, Kotlin, JavaScript (Node.js) lub PHP.\n\nPołączenia są opcjonalne. Bez nich kompozyty działają jak foldery, a jednostki końcowe jak pliki, i każda jednostka trzyma swój kod razem ze specyfikacją i danymi testowymi, więc ich powiązanie jest jawne, a nie domniemane.\n\nUżywaj ponownie części projektu jako komponentów z typowanymi portami, zaczynaj od archetypów i analizuj przepływy danych, błędów i zależności. Wirecraft oferuje też zarządzanie projektem (tablica Kanban, backlog, historia wersji), eksport rysunków do PDF, SVG, PNG i Mermaid do druku oraz opcjonalny lokalny serwer MCP dla agentów AI.\n\nWirecraft otwiera projekty .orch z Threadworks. Nie wymaga konta i działa offline. Interfejs jest w języku angielskim. Wirecraft jest aktywnie rozwijany.", "shortDescription": "Wizualny framework programistyczny: podziel rozwiązanie programowe na komponenty połączone jawnymi, typowanymi połączeniami danych, napisz algorytm każdego komponentu z pomocą serwera języka i generuj programy w C17, Rust, Go, Kotlin, JavaScript lub PHP. Zawiera komponenty wielokrotnego użytku, zarządzanie projektem, eksport rysunków i lokalny serwer MCP.", "features": ["Wizualna budowa: podziel rozwiązanie na komponenty przetwarzające z jawnymi połączeniami danych", "Połączenia deklarują kanały danych między komponentami, jak stanowiska linii montażowej", "Typy z jawnymi hierarchiami i zależnościami; biblioteki udostępniają metody komponentom", "Pisz algorytm każdego komponentu pod przypiętym, wygenerowanym nagłówkiem funkcji", "Uzupełnianie, podpowiedzi, definicje, odwołania i diagnostyka z clangd lub rust-analyzer", "Generuj programy w C17, Rust, Go, Kotlin, JavaScript i PHP z projektu i swojego kodu", "Bez połączeń kompozyty są folderami, a jednostki plikami z kodem, specyfikacją i testami", "Komponenty wielokrotnego użytku z typowanymi portami, archetypy i analiza przepływów danych i zależności", "Tablica Kanban, backlog, odpowiedzialność i historia wersji", "Eksport rysunków do PDF, SVG, PNG i Mermaid oraz lokalny serwer MCP dla agentów AI"], "searchTerms": ["przepływ danych", "programowanie wizualne", "architektura oprogramowania", "generowanie kodu", "C17", "Rust", "serwer MCP"], "captions": ["Zbuduj serwer WWW z komponentów przetwarzających połączonych jawnymi, typowanymi połączeniami danych.", "Grupuj komponenty w kompozyty; poprowadzone połączenia pokazują każdy kanał danych.", "Opublikuj projekt jako komponent z typowanymi portami wejściowymi i wyjściowymi.", "Odwołaj się do komponentu z innego projektu; jego porty łączą się z Twoimi połączeniami.", "Pisz liotecas que ele recebe. Com clang, clangd ou rust-analyzer instalados, você tem autocompletar, informações ao passar o cursor, ir para a definição, localizar referências e diagnósticos do compilador nas linhas que escreveu.\n3. Gerar. O Wirecraft monta os componentes e as suas ligações num programa completo em C17, Rust, Go, Kotlin, JavaScript (Node.js) ou PHP.\n\nAs ligações são opcionais. Sem elas, os compostos funcionam como pastas e as entidades finais como arquivos, e cada entidade mantém o seu código junto com a especificação e os dados de teste, de modo que a associação é explícita em vez de presumida.\n\nReutilize partes de um projeto como componentes com portas tipadas, comece a partir de arquétipos e analise fluxos de dados, erros e dependências. O Wirecraft também oferece gestão de projetos (quadro Kanban, backlog, histórico de revisões), exportação de plantas em PDF, SVG, PNG e Mermaid para impressão e um servidor MCP local opcional para agentes de IA.\n\nO Wirecraft abre projetos .orch do Threadworks. Não é necessária conta e funciona offline. A interface está em inglês. O Wirecraft está em desenvolvimento ativo.", "shortDescription": "Um framework de desenvolvimento visual: divida uma solução de software em componentes unidos por ligações de dados explícitas e tipadas, escreva o algoritmo de cada componente com ajuda de um servidor de linguagem e gere programas em C17, Rust, Go, Kotlin, JavaScript ou PHP. Inclui componentes reutilizáveis, gestão de projetos, exportação de plantas e um servidor MCP local.", "features": ["Construção visual: divida uma solução em componentes de processamento unidos por ligações de dados explícitas", "As ligações declaram os canais de dados entre componentes, como estações de uma linha de montagem", "Tipos com hierarquias e dependências explícitas; bibliotecas emprestam métodos aos componentes", "Escreva o algoritmo de cada componente sob o seu cabeçalho de função gerado e fixado", "Autocompletar, informações ao passar o
