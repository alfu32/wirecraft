[workspace]
members = ["crates/wirecraft-core", "crates/wirecraft-runtime", "crates/wirecraft-desktop"]
resolver = "2"
exclude = ["vendor/gpui-component"]

[workspace.package]
version = "0.11.5"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
